<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1211" role="img" aria-labelledby="sbTitle sbDesc">
<title id="sbTitle">地址跳变的路过通道——打印分镜</title>
<desc id="sbDesc">5 格分镜，每格画该拍结束态</desc>

<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="960" height="1211" fill="url(#bgL)"/>
<rect class="page-grain" width="960" height="1211" fill="url(#dots)"/>
<rect class="page-vig" width="960" height="1211" fill="url(#vig)"/>
<rect class="page-hdr" width="960" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">地址跳变的路过通道·分镜</text>
<text x="480" y="56" text-anchor="middle" font-size="12" fill="#5b666f">011→100 不是一步到位；INH 与格雷码把中间态关掉</text>
<rect x="20" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="停在011" transform="translate(47 84) scale(0.4129)"><rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><rect x="120" y="204" width="120" height="52" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="180" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f5d7a">011</text>
<text x="300" y="238" font-size="13" fill="#16202b">选中通道 3，稳定</text></g></g>
<text x="32" y="348" font-size="12" font-weight="bold" fill="#1f5d7a">1. 停在011</text>
<rect x="490" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="三位抢跑" transform="translate(517 84) scale(0.4129)"><rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><rect x="340" y="204" width="120" height="52" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="400" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#a4630f">111</text>
<text x="480" y="238" font-size="13" fill="#16202b">中间态先到</text>
<rect x="620" y="204" width="120" height="52" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="680" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#a4630f">010</text></g></g>
<text x="502" y="348" font-size="12" font-weight="bold" fill="#a4630f">2. 三位抢跑</text>
<rect x="20" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="路过111" transform="translate(47 402) scale(0.4129)"><rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><rect x="340" y="310" width="120" height="34" rx="6" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="400" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a8321f">通道 7 先导通</text>
<text x="480" y="334" font-size="12" fill="#a8321f">无关信号短促进入 / 泄一包电荷</text></g></g>
<text x="32" y="666" font-size="12" font-weight="bold" fill="#a8321f">3. 路过111</text>
<rect x="490" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="先拉INH" transform="translate(517 402) scale(0.4129)"><rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><path d="M120,440 L340,440 L340,404 L620,404 L620,440 L864,440" fill="none" stroke="#3d6b4a" stroke-width="3"/>
<text x="690" y="398" font-size="12.5" font-weight="bold" fill="#3d6b4a">INH 罩住整个地址跳变</text></g></g>
<text x="502" y="666" font-size="12" font-weight="bold" fill="#3d6b4a">4. 先拉INH</text>
<rect x="20" y="706" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="等够再采" transform="translate(47 720) scale(0.4129)"><rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g transform="translate(0 -4)"><rect x="96" y="508" width="816" height="76" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="120" y="538" font-size="13" font-weight="bold" fill="#3d6b4a">对策按代价排：先拉 INH → 格雷码 → 采样窗错开 ≥ t_ON</text>
<text x="120" y="564" font-size="12" fill="#16202b">判据：地址稳定到采样窗开启的间隔 ≥ t_ON，期间不采样。</text></g></g>
<text x="32" y="984" font-size="12" font-weight="bold" fill="#6b3f63">5. 等够再采</text>
<text x="24" y="1036" font-size="22" fill="#16202b">1. 当前选中通道 3：地址 011 稳定</text>
<text x="24" y="1066" font-size="22" fill="#16202b">2. 改到 100 时三位不同时翻转，中间态先出现</text>
<text x="24" y="1096" font-size="22" fill="#16202b">3. 111 短暂导通：无关通道被采进系统</text>
<text x="24" y="1126" font-size="22" fill="#16202b">4. 先把 INH 拉高全断，再改地址</text>
<text x="24" y="1156" font-size="22" fill="#16202b">5. 地址稳定到采样窗开启 ≥ t_ON；格雷码只动一位</text>
</svg>

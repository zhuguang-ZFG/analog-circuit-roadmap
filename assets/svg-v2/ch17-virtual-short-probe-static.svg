<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">虚短探针：两次读数判运放死活</title>
<desc id="figDesc">两输入端压差 8mV——虚短成立，问题不在运放</desc>
<metadata id="visual-timeline">{&quot;duration&quot;: 7.5, &quot;beats&quot;: [{&quot;name&quot;: &quot;认脚&quot;, &quot;start&quot;: 0.0, &quot;end&quot;: 1.5, &quot;caption&quot;: &quot;运放两输入端：V-（反相）与 V+（同相）——虚短验证就从这两个脚开始&quot;}, {&quot;name&quot;: &quot;量V-&quot;, &quot;start&quot;: 1.5, &quot;end&quot;: 3.0, &quot;caption&quot;: &quot;第一步：表笔落 V-，读数 2.500V&quot;}, {&quot;name&quot;: &quot;量V+&quot;, &quot;start&quot;: 3.0, &quot;end&quot;: 4.5, &quot;caption&quot;: &quot;第二步：表笔落 V+，读数 2.508V&quot;}, {&quot;name&quot;: &quot;算压差&quot;, &quot;start&quot;: 4.5, &quot;end&quot;: 6.0, &quot;caption&quot;: &quot;压差 = 2.508 - 2.500 = 8mV，远小于供电轨&quot;}, {&quot;name&quot;: &quot;判读&quot;, &quot;start&quot;: 6.0, &quot;end&quot;: 7.5, &quot;caption&quot;: &quot;虚短成立，运放与反馈链工作正常——问题不在这里&quot;}]}</metadata>
<!-- 节拍：认脚、量V-、量V+、算压差、判读；总时长 7.5s；单次播放 -->


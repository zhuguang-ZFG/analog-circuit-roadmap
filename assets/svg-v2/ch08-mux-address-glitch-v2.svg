<text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b">地址跳变的路过通道</text>
<text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#5b666f">011→100 不是一步到位；INH 与格雷码把中间态关掉</text>
<rect x="48" y="96" width="864" height="300" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<text x="72" y="128" font-size="12" fill="#5b666f">三位地址时间线</text>
<line x1="96" y1="230" x2="864" y2="230" stroke="#c9bb9d" stroke-width="1.6"/>
<line x1="96" y1="360" x2="864" y2="360" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="72" y="386" font-size="12" fill="#5b666f">选中通道</text>
<text x="72" y="430" font-size="12" fill="#5b666f">INH</text>
<line x1="96" y1="446" x2="864" y2="446" stroke="#c9bb9d" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" font-size="12" fill="#5b666f">时间（切换沿几十 ns 级）</text>
<g data-beat="停在011" opacity="0"><rect x="120" y="204" width="120" height="52" rx="8" fill="#e6eff3" stroke="#1f5d7a" stroke-width="2"/>
<text x="180" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f5d7a">011</text>
<text x="300" y="238" font-size="13" fill="#16202b">选中通道 3，稳定</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.6s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="0s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="三位抢跑" opacity="0"><rect x="340" y="204" width="120" height="52" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="400" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#a4630f">111</text>
<text x="480" y="238" font-size="13" fill="#16202b">中间态先到</text>
<rect x="620" y="204" width="120" height="52" rx="8" fill="#f7eedb" stroke="#a4630f" stroke-width="2"/>
<text x="680" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#a4630f">010</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="1.6s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3.4s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="1.6s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="路过111" opacity="0"><rect x="340" y="310" width="120" height="34" rx="6" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="400" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a8321f">通道 7 先导通</text>
<text x="480" y="334" font-size="12" fill="#a8321f">无关信号短促进入 / 泄一包电荷</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3.4s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5.2s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="3.4s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="先拉INH" opacity="0"><path d="M120,440 L340,440 L340,404 L620,404 L620,440 L864,440" fill="none" stroke="#3d6b4a" stroke-width="3"/>
<text x="690" y="398" font-size="12.5" font-weight="bold" fill="#3d6b4a">INH 罩住整个地址跳变</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="5.2s" dur="0.45s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6.8s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="5.2s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<g data-beat="等够再采" opacity="0"><rect x="96" y="508" width="816" height="76" rx="10" fill="#e8efe6" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="120" y="538" font-size="13" font-weight="bold" fill="#3d6b4a">对策按代价排：先拉 INH → 格雷码 → 采样窗错开 ≥ t_ON</text>
<text x="120" y="564" font-size="12" fill="#16202b">判据：地址稳定到采样窗开启的间隔 ≥ t_ON，期间不采样。</text><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6.8s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" begin="6.8s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></g>
<rect x="24" y="556" width="912" height="34" rx="9" fill="#f7eedb" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-caption="停在011" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="0s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="1.4s" dur="0.2s" fill="freeze"/><text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5d7a">当前选中通道 3：地址 011 稳定</text></g>
<g data-caption="三位抢跑" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="1.6s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="3.2s" dur="0.2s" fill="freeze"/><text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4630f">改到 100 时三位不同时翻转，中间态先出现</text></g>
<g data-caption="路过111" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="3.4s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="5s" dur="0.2s" fill="freeze"/><text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#a8321f">111 短暂导通：无关通道被采进系统</text></g>
<g data-caption="先拉INH" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="5.2s" dur="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.6 1" begin="6.6s" dur="0.2s" fill="freeze"/><text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b4a">先把 INH 拉高全断，再改地址</text></g>
<g data-caption="等够再采" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1" begin="6.8s" dur="0.2s" fill="freeze"/><text x="480" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3f63">地址稳定到采样窗开启 ≥ t_ON；格雷码只动一位</text></g>
</svg>

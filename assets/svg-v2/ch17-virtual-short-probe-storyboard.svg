<text x="684" y="276" font-size="14" font-weight="bold" fill="#a4630f">压差 2.508 - 2.500 = 8mV</text></g></g>
<text x="502" y="666" font-size="12" font-weight="bold" fill="#a4630f">4. 算压差</text>
<rect x="20" y="706" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="判读" transform="translate(47 720) scale(0.4129)"><polygon points="380,180 380,320 560,250" fill="#f6eedb" stroke="#37424e" stroke-width="2.2"/>

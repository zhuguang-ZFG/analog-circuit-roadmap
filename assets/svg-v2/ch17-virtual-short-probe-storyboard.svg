<text x="352" y="298" font-size="14" font-weight="bold" fill="#16202b">+</text>
<text x="470" y="256" text-anchor="middle" font-size="12.5" fill="#5b666f">运放</text>
<text x="300" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5d7a">V-</text>

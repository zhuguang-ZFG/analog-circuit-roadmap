<text x="684" y="276" font-size="14" font-weight="bold" fill="#a4630f">压差 2.508 - 2.500 = 8mV</text>
<rect x="60" y="400" width="840" height="120" rx="12" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="84" y="436" font-size="14" font-weight="bold" fill="#3d6b4a">判读：压差 8mV 远小于几十 mV 阈值 → 虚短成立</text>
<text x="84" y="466" font-size="12.5" fill="#16202b">运放两输入端近似等电位，反馈在正常工作——问题不在运放，</text>
<text x="84" y="490" font-size="12.5" fill="#16202b">嫌疑移交：供电、前级信号、输出负载。</text></g></g>
<text x="32" y="984" font-size="12" font-weight="bold" fill="#3d6b4a">5. 判读</text>
<text x="24" y="1036" font-size="22" fill="#16202b">1. 运放两输入端：V-（反相）与 V+（同相）——虚短验证就从这两个脚开始</text>
<text x="24" y="1066" font-size="22" fill="#16202b">2. 第一步：表笔落 V-，读数 2.500V</text>
<text x="24" y="1096" font-size="22" fill="#16202b">3. 第二步：表笔落 V+，读数 2.508V</text>
<text x="24" y="1126" font-size="22" fill="#16202b">4. 压差 = 2.508 - 2.500 = 8mV，远小于供电轨</text>
<text x="24" y="1156" font-size="22" fill="#16202b">5. 虚短成立，运放与反馈链工作正常——问题不在这里</text>

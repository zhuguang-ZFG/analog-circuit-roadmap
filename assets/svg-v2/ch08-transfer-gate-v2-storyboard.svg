<line x1="210" y1="136" x2="210" y2="500" stroke="#5b666f" stroke-width="1.2" stroke-dasharray="3,5"/>
<text x="210" y="522" text-anchor="middle" font-size="11" fill="#5b666f">2.5V 门限</text>
<rect x="48" y="548" width="864" height="48" rx="10" fill="#e6eff3" stroke="#1f5d7a" stroke-width="1.2"/>
<text x="72" y="579" font-size="12.5" fill="#16202b">VDD=5V，VTH=1V；N 管管低段、P 管管高段，源漏对称所以双向。</text>
<g transform="translate(0 -4)"><rect x="96" y="120" width="360" height="86" rx="10" fill="#f6e7e1" stroke="#a8321f" stroke-width="1.6"/>
<text x="116" y="150" font-size="13" font-weight="bold" fill="#a8321f">4V 够不够，看下游是谁</text>
<text x="116" y="176" font-size="12" fill="#16202b">CMOS 门限 2.5V：够用</text>
<text x="116" y="196" font-size="12" fill="#16202b">轨到轨 ADC：不够</text>
<path d="M700,250 L820,250 M820,250 L800,236 M820,250 L800,264" stroke="#a8321f" stroke-width="2.4" fill="none"/>
<text x="760" y="230" text-anchor="middle" font-size="12" fill="#a8321f">双向</text></g></g>
<text x="502" y="666" font-size="12" font-weight="bold" fill="#a8321f">4. 双向与边界</text>
<text x="24" y="718" font-size="22" fill="#16202b">1. VIN=0V：N 管全开，P 管没导通</text>
<text x="24" y="748" font-size="22" fill="#16202b">2. VIN 升到 4V：N 管压差只剩 VTH，传输停住</text>
<text x="24" y="778" font-size="22" fill="#16202b">3. P 管接管高段，包络 20→26.7→20Ω 覆盖全摆幅</text>
<text x="24" y="808" font-size="22" fill="#16202b">4. 源漏对称所以双向；下游门限 2.5V 决定 4V 够不够</text>
</svg>

<text x="32" y="666" font-size="12" font-weight="bold" fill="#3d6b4a">3. 互补并联</text>
<rect x="490" y="388" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>
<g data-storyboard-beat="双向与边界" transform="translate(517 402) scale(0.4129)"><rect x="48" y="92" width="864" height="440" rx="14" fill="#f6eedb" stroke="#c9bb9d" stroke-width="1.4"/>
<line x1="96" y1="470" x2="864" y2="470" stroke="#c9bb9d" stroke-width="2"/>
<text x="96" y="500" font-size="12" fill="#5b666f">VIN 0V</text>
<text x="840" y="500" text-anchor="end" font-size="12" fill="#5b666f">5V</text>

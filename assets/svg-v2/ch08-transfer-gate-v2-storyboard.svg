<text x="72" y="579" font-size="12.5" fill="#16202b">VDD=5V，VTH=1V；N 管管低段、P 管管高段，源漏对称所以双向。</text>
<g transform="translate(0 -4)"><path d="M96,410 C180,410 240,380 290,300 C350,240 430,300 500,360 C580,410 700,410 864,410" fill="none" stroke="#3d6b4a" stroke-width="3.4"/>

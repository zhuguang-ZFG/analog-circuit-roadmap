<text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16202b">传输门：谁行谁上·分镜</text>
<text x="480" y="56" text-anchor="middle" font-size="12" fill="#5b666f">单管有阈值缺口，互补并联才轨到轨</text>
<rect x="20" y="70" width="450" height="300" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.2"/>

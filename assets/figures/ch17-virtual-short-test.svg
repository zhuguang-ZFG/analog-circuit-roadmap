<title id="figTitle">虚短检验：一刀把故障劈成两半</title>
<desc id="figDesc">顶部判据条给出动作：量反相端 V− 是否约等于同相端 V+，教学示例是 V− 比 V+ 低 8mV 且随信号摆动。中央判断节点 V− ≈ V+ 分出两支：虚短成立说明运放与反馈环路直流上是活的，嫌疑转向输入源、供电、负载三处；虚短不成立则立刻缩到反馈网络开路、输出撞轨、供电异常、共模超范围四个方向。底部结语：一刀下去排除的是一整类机理，虚短成立的前提见 12.1。</desc>
<defs>
<marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16202b"/></marker>
<marker id="arrGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d6b4a"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8321f"/></marker>
</defs>

<path d="M420 38 c 30 3.4 72 -2.6 120 0.4" fill="none" stroke="#a4630f" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
<text x="480" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#16202b" style="font-family:'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif;font-weight:400">虚短检验：一刀把故障劈成两半</text>

<rect x="36" y="60" width="888" height="58" rx="10" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.8"/>
<text x="56" y="86" font-size="14" font-weight="bold" fill="#16202b">判据条：量反相端 V− 是否 ≈ 同相端 V+（虚短检验）</text>
<text x="56" y="108" font-size="13" fill="#37424e">教学示例：V− 比 V+ 低 8mV 且随信号摆动 —— 环路是活的，先判死活，再找元件</text>

<path d="M480 118 Q480.00 132.00 480 146" fill="none" stroke="#16202b" stroke-width="1.8" marker-end="url(#arrInk)"/>

<polygon points="480,150 640,196 480,242 320,196" fill="#fdf8ea" stroke="#16202b" stroke-width="2"/>
<text x="480" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#16202b">V− ≈ V+ ？</text>
<text x="480" y="216" text-anchor="middle" font-size="12" fill="#5b666f">万用表 / 示波器直流档量两输入端</text>

<path d="M330 210 Q292.17 233.29 254 256" fill="none" stroke="#3d6b4a" stroke-width="2" marker-end="url(#arrGrn)"/>
<text x="256" y="228" font-size="13" font-weight="bold" fill="#3d6b4a">成立</text>
<path d="M630 210 Q668.09 232.84 706 256" fill="none" stroke="#a8321f" stroke-width="2" marker-end="url(#arrRed)"/>
<text x="666" y="228" font-size="13" font-weight="bold" fill="#a8321f">不成立</text>

<rect x="36" y="262" width="434" height="268" rx="12" fill="#e8efe6" stroke="#3d6b4a" stroke-width="2"/>
<text x="56" y="292" font-size="16" font-weight="bold" fill="#3d6b4a">虚短成立 → 环路是活的</text>
<text x="56" y="316" font-size="13" fill="#37424e">运放与反馈环路直流上是活的</text>
<path d="M56 330 Q253.00 330.32 450 330" fill="none" stroke="#3d6b4a" stroke-width="1.6"/>
<text x="56" y="356" font-size="13" font-weight="bold" fill="#16202b">嫌疑转向三处：</text>
<text x="56" y="384" font-size="14" fill="#16202b">· 输入源：信号到底进来没有</text>
<text x="56" y="410" font-size="14" fill="#16202b">· 供电：正负轨在引脚上都在吗</text>
<text x="56" y="436" font-size="14" fill="#16202b">· 负载：是不是把输出拉垮了</text>
<text x="56" y="478" font-size="12" fill="#5b666f">测得 8mV 级压差且随信号摆动即落在本支</text>
<text x="56" y="502" font-size="12" fill="#5b666f">排除的是一整类机理：环路死活已定</text>

<rect x="490" y="262" width="434" height="268" rx="12" fill="#f6e7e1" stroke="#a8321f" stroke-width="2"/>
<text x="510" y="292" font-size="16" font-weight="bold" fill="#a8321f">虚短不成立 → 四个方向</text>
<text x="510" y="316" font-size="13" fill="#37424e">立刻缩小包围圈，逐个排除：</text>
<path d="M510 330 Q707.00 328.70 904 330" fill="none" stroke="#a8321f" stroke-width="1.6"/>
<text x="510" y="360" font-size="14" fill="#16202b">① 反馈网络开路：Rf 虚焊或断开</text>
<text x="510" y="388" font-size="14" fill="#16202b">② 输出撞轨：输出顶到电源轨</text>
<text x="510" y="416" font-size="14" fill="#16202b">③ 供电异常：电源脚虚焊、缺轨</text>
<text x="510" y="444" font-size="14" fill="#16202b">④ 共模超范围：输入出规格</text>
<text x="510" y="478" font-size="12" fill="#5b666f">对应表 17-3 前两行的头号嫌疑与一分钟验证</text>
<text x="510" y="502" font-size="12" fill="#5b666f">先补焊反馈、再查供电与共模</text>

<rect x="36" y="556" width="888" height="88" rx="12" fill="#fdf8ea" stroke="#c9bb9d" stroke-width="1.8"/>
<text x="480" y="592" text-anchor="middle" font-size="16" font-weight="bold" fill="#16202b">一刀下去，排除的不是一个元件，是一整类机理</text>
<text x="480" y="620" text-anchor="middle" font-size="13" fill="#5b666f">虚短成立的前提与机理见 12.1；先判环路死活，再谈元件值与器件选型</text>
</svg>

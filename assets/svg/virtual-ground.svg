<text x="544" y="288" font-size="10" fill="#64748b">直接进：负半周撞地</text>
<text x="544" y="166" font-size="10" font-weight="bold" fill="#059669">骑上 6V：全程能走</text>
<text x="780" y="133" text-anchor="end" font-size="9.5" fill="#b45309">12V</text>

<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">去耦电容为什么要「贴脸」放？——走线电感 vs 本地水库</text>

<text x="200" y="50" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#dc2626">场景 A：电容太远（或没有）</text>

<path d="M420,340.0 L424,340.0 L428,340.0 L432,340.0 L436,340.0 L440,340.0 L444,340.0 L448,340.0 L452,340.0 L456,340.0 L460,340.0 L464,340.0 L468,340.0 L472,340.0 L476,340.0 L480,340.0 L484,340.0 L488,340.0 L492,340.0 L496,340.0 L500,340.0 L504,340.0 L508,340.0 L512,340.0 L516,340.0 L520,340.1 L524,340.1 L528,340.3 L532,340.4 L536,340.7 L540,341.1 L544,341.7 L548,342.5 L552,343.5 L556,344.6 L560,345.8 L564,347.1 L568,348.2 L572,349.2 L576,349.8 L580,350.0 L584,349.8 L588,349.2 L592,348.2 L596,347.1 L600,345.8 L604,344.6 L608,343.5 L612,342.5 L616,341.7 L620,341.1 L624,340.7 L628,340.4 L632,340.3 L636,340.1 L640,340.1 L644,340.0 L648,340.0 L652,340.0 L656,340.0 L660,340.0 L664,340.0 L668,340.0 L672,340.0 L676,340.0 L680,340.0 L684,340.0 L688,340.0 L692,340.0 L696,340.0 L700,340.0 L704,340.0 L708,340.0 L712,340.0 L716,340.0 L720,340.0 L724,340.0 L728,340.0 L732,340.0 L736,340.0 L740,340.0" fill="none" stroke="#059669" stroke-width="3"/>

<text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">① IC 翻转瞬间要 100mA 尖峰电流，但只持续几 ns<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.24;1" dur="5s" repeatCount="indefinite"/></text><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 走线电感：直流随便过，ns 尖峰面前=断路（V=L·di/dt）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.28;0.42;0.46;1" dur="5s" repeatCount="indefinite"/></text><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 100nF 贴脸=本地水库：它距离近、电感小，尖峰由它顶上<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.5;0.68;0.72;1" dur="5s" repeatCount="indefinite"/></text><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">④ 所以记住：距离&lt;3mm、先过电容再到 IC、电容回路越短越好<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.76;1" dur="5s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.84;1" dur="5s" repeatCount="indefinite"/>
<rect x="80" y="434" width="640" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="456" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">100nF 管高频（ns 尖峰）· 10µF 管中频 · 大电解管低频——三级去耦，各司其职</text>
</g></svg>
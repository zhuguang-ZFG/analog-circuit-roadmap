<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">大师的排故智慧：三份心法，一条军规</text>

<text x="400" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">大师的排故智慧：三份心法，一条军规</text>
<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">金句逐条读，粒子替你走流程——军规清单在底部</text>
<rect x="35" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb">Bob Pease · 老中医</text><line x1="49" y1="138" x2="251" y2="138" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/><circle cx="55" cy="161" r="3.5" fill="#2563eb"/><text x="69" y="166" font-size="11.5" fill="#334155">先量电源——近一半故障藏在这里</text><circle cx="55" cy="199" r="3.5" fill="#2563eb"/><text x="69" y="204" font-size="11.5" fill="#334155">怀疑一切，包括你的仪器</text><circle cx="55" cy="237" r="3.5" fill="#2563eb"/><text x="69" y="242" font-size="11.5" fill="#334155">数字表测不出振荡 → 示波器复核</text><circle cx="55" cy="275" r="3.5" fill="#2563eb"/><text x="69" y="280" font-size="11.5" fill="#334155">记录一切：症状-假设-结果存档</text><circle r="5" fill="#2563eb"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M150,110 V295"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M150,110 V295"/></circle><rect x="285" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="400" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626">Jim Williams · 手术刀</text><line x1="299" y1="138" x2="501" y2="138" stroke="#dc2626" stroke-width="1.5" opacity="0.4"/><circle cx="305" cy="161" r="3.5" fill="#dc2626"/><text x="319" y="166" font-size="11.5" fill="#334155">先想透，再动手</text><circle cx="305" cy="199" r="3.5" fill="#dc2626"/><text x="319" y="204" font-size="11.5" fill="#334155">测量前先在脑子里预测波形</text><circle cx="305" cy="237" r="3.5" fill="#dc2626"/><text x="319" y="242" font-size="11.5" fill="#334155">测量链不能改变被测对象</text><circle cx="305" cy="275" r="3.5" fill="#dc2626"/><text x="319" y="280" font-size="11.5" fill="#334155">把故障做小：最小可复现电路</text><circle r="5" fill="#dc2626"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M400,110 V295"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M400,110 V295"/></circle><rect x="535" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><text x="650" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed">共通心法</text><line x1="549" y1="138" x2="751" y2="138" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/><circle cx="555" cy="161" r="3.5" fill="#7c3aed"/><text x="569" y="166" font-size="11.5" fill="#334155">慢观察</text><circle cx="555" cy="199" r="3.5" fill="#7c3aed"/><text x="569" y="204" font-size="11.5" fill="#334155">快假设</text><circle cx="555" cy="237" r="3.5" fill="#7c3aed"/><text x="569" y="242" font-size="11.5" fill="#334155">严验证</text><circle cx="555" cy="275" r="3.5" fill="#7c3aed"/><text x="569" y="280" font-size="11.5" fill="#334155">电路永远是对的，错的是你的模型</text><circle r="5" fill="#7c3aed"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M650,110 V295"/></circle>
<circle r="5" fill="#7c3aed"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M650,110 V295"/></circle><rect x="60" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="135" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">先量电源</text><line x1="210" y1="367" x2="228" y2="367" stroke="#334155" stroke-width="2"/><polygon points="230,367 219,361 219,373" fill="#334155"/><rect x="230" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="305" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">预测波形再测量</text><line x1="380" y1="367" x2="398" y2="367" stroke="#334155" stroke-width="2"/><polygon points="400,367 389,361 389,373" fill="#334155"/><rect x="400" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="475" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">最小化复现</text><line x1="550" y1="367" x2="568" y2="367" stroke="#334155" stroke-width="2"/><polygon points="570,367 559,361 559,373" fill="#334155"/><rect x="570" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="645" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">示波器复核</text><circle r="5" fill="#b45309"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M68,367 H712"/></circle>
<circle r="5" fill="#b45309"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M68,367 H712"/></circle>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">排故不是体力活，是科学方法——观察 → 假设 → 实验 → 结论，一次循环逼近真相</text>
<text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① Pease：先量电源——他的维修记录里近一半故障藏在这里<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② Williams：测量前预测波形，预测与实测不符处就是理解缺口<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 共通：慢观察、快假设、严验证——观察→假设→实验→结论<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 军规：先量电源、预测波形、最小化复现、示波器复核——现场最冷静的人<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<title>大师的排故智慧：三份心法，一条军规</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="520" fill="url(#bgL)"/>
<rect width="800" height="520" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="520" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
rect[fill="#f8fafc"]{fill:#0f172a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#64748b}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">大师的排故智慧：三份心法，一条军规</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">金句逐条读，粒子替你走流程——军规清单在底部</text>
<rect x="35" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb">Bob Pease · 老中医</text><line x1="49" y1="138" x2="251" y2="138" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/><circle cx="55" cy="161" r="3.5" fill="#2563eb"/><text x="69" y="166" font-size="11.5" fill="#334155">先量电源——近一半故障藏在这里</text><circle cx="55" cy="199" r="3.5" fill="#2563eb"/><text x="69" y="204" font-size="11.5" fill="#334155">怀疑一切，包括你的仪器</text><circle cx="55" cy="237" r="3.5" fill="#2563eb"/><text x="69" y="242" font-size="11.5" fill="#334155">数字表测不出振荡 → 示波器复核</text><circle cx="55" cy="275" r="3.5" fill="#2563eb"/><text x="69" y="280" font-size="11.5" fill="#334155">记录一切：症状-假设-结果存档</text><g filter="url(#pglow)"><circle r="5" fill="#2563eb"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M150,110 V295"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M150,110 V295"/></circle></g><rect x="285" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="400" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626">Jim Williams · 手术刀</text><line x1="299" y1="138" x2="501" y2="138" stroke="#dc2626" stroke-width="1.5" opacity="0.4"/><circle cx="305" cy="161" r="3.5" fill="#dc2626"/><text x="319" y="166" font-size="11.5" fill="#334155">先想透，再动手</text><circle cx="305" cy="199" r="3.5" fill="#dc2626"/><text x="319" y="204" font-size="11.5" fill="#334155">测量前先在脑子里预测波形</text><circle cx="305" cy="237" r="3.5" fill="#dc2626"/><text x="319" y="242" font-size="11.5" fill="#334155">测量链不能改变被测对象</text><circle cx="305" cy="275" r="3.5" fill="#dc2626"/><text x="319" y="280" font-size="11.5" fill="#334155">把故障做小：最小可复现电路</text><g filter="url(#pglow)"><circle r="5" fill="#dc2626"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M400,110 V295"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M400,110 V295"/></circle></g><rect x="535" y="100" width="230" height="210" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><text x="650" y="126" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed">共通心法</text><line x1="549" y1="138" x2="751" y2="138" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/><circle cx="555" cy="161" r="3.5" fill="#7c3aed"/><text x="569" y="166" font-size="11.5" fill="#334155">慢观察</text><circle cx="555" cy="199" r="3.5" fill="#7c3aed"/><text x="569" y="204" font-size="11.5" fill="#334155">快假设</text><circle cx="555" cy="237" r="3.5" fill="#7c3aed"/><text x="569" y="242" font-size="11.5" fill="#334155">严验证</text><circle cx="555" cy="275" r="3.5" fill="#7c3aed"/><text x="569" y="280" font-size="11.5" fill="#334155">电路永远是对的，错的是你的模型</text><g filter="url(#pglow)"><circle r="5" fill="#7c3aed"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M650,110 V295"/></circle>
<circle r="5" fill="#7c3aed"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M650,110 V295"/></circle></g><rect x="60" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="135" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">先量电源</text><line x1="210" y1="367" x2="228" y2="367" stroke="#334155" stroke-width="2"/><polygon points="230,367 219,361 219,373" fill="#334155"/><rect x="230" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="305" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">预测波形再测量</text><line x1="380" y1="367" x2="398" y2="367" stroke="#334155" stroke-width="2"/><polygon points="400,367 389,361 389,373" fill="#334155"/><rect x="400" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="475" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">最小化复现</text><line x1="550" y1="367" x2="568" y2="367" stroke="#334155" stroke-width="2"/><polygon points="570,367 559,361 559,373" fill="#334155"/><rect x="570" y="345" width="150" height="44" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="645" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">示波器复核</text><g filter="url(#pglow)"><circle r="5" fill="#b45309"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M68,367 H712"/></circle>
<circle r="5" fill="#b45309"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M68,367 H712"/></circle></g>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">排故不是体力活，是科学方法——观察 → 假设 → 实验 → 结论，一次循环逼近真相</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="178.3" y="426.9" width="443.4" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① Pease：先量电源——他的维修记录里近一半故障藏在这里<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="173.6" y="426.9" width="452.8" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② Williams：测量前预测波形，预测与实测不符处就是理解缺口<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="171.7" y="426.9" width="456.5" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 共通：慢观察、快假设、严验证——观察→假设→实验→结论<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="125.1" y="426.9" width="549.7" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 军规：先量电源、预测波形、最小化复现、示波器复核——现场最冷静的人<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
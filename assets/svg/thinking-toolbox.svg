}
</style>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">思维工具箱：老手的四个暗器</text>

<text x="400" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">思维工具箱：老手的四个暗器</text>
<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">开工先归因 · 坏板找对比 · 偶发用极限 · 短路靠隔离</text>
<rect x="45" y="100" width="340" height="130" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><text x="69" y="134" font-size="15" font-weight="bold" fill="#2563eb">内外归因</text><text x="69" y="164" font-size="11" fill="#334155">先换"已知好的"电源/线缆</text><text x="69" y="184" font-size="11" fill="#334155">传感器，把故障域切成板内/板外</text><text x="69" y="206" font-size="10" fill="#64748b">何时用：开工第一步——30 秒排除一半嫌疑</text><rect x="415" y="100" width="340" height="130" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="439" y="134" font-size="15" font-weight="bold" fill="#dc2626">对比法</text><text x="439" y="164" font-size="11" fill="#334155">好板并排同点测量——差异即线索，玄学变科学</text><text x="439" y="198" font-size="10" fill="#64748b">何时用：量产批次不良、玄学故障</text><rect x="45" y="260" width="340" height="130" rx="14" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><text x="69" y="294" font-size="15" font-weight="bold" fill="#b45309">极限法</text><text x="69" y="324" font-size="11" fill="#334155">电压拉偏 ±10%、温度吹风/冷冻</text><text x="69" y="344" font-size="11" fill="#334155">把偶发故障逼成必现</text><text x="69" y="366" font-size="10" fill="#64748b">何时用：偶发不现形就没法测</text><rect x="415" y="260" width="340" height="130" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><text x="439" y="294" font-size="15" font-weight="bold" fill="#7c3aed">隔离法</text><text x="439" y="324" font-size="11" fill="#334155">断开疑似负载/后级，看前级是否恢复</text><text x="439" y="358" font-size="10" fill="#64748b">何时用：短路、过载、闩锁定位</text><circle r="5" fill="#059669"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">四招组合就是老手的节奏——先内外、再对比、极限逼、隔离切</text>
<text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 内外归因：先换已知好的电源/线缆/传感器——30 秒排除一半嫌疑<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 对比法：好板并排同点测——差异即线索，玄学变科学<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 极限法：电压拉偏 ±10%、温度吹风冷冻——把偶发故障逼成必现<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 隔离法：断开疑似负载/后级，看前级恢复——短路、闩锁现形<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
</svg>
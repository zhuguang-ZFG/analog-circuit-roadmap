<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="ttl">
<title id="ttl">思维工具箱：老手的四个暗器</title>
<desc>思维工具箱：老手的四个暗器；节拍：① 内外归因：先换已知好的电源/线缆/传感器——30 秒排除一半嫌疑；② 对比法：好板并排同点测——差异即线索，玄学变科学；③ 极限法：电压拉偏 ±10%、温度吹风冷冻——把偶发故障逼成必现；④ 隔离法：断开疑似负载/后级，看前级恢复——短路、闩锁现形</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="500" fill="url(#bgL)"/>
<rect width="800" height="500" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="500" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">思维工具箱：老手的四个暗器</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">开工先归因 · 坏板找对比 · 偶发用极限 · 短路靠隔离</text>
<rect x="45" y="100" width="340" height="130" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><text x="69" y="134" font-size="15" font-weight="bold" fill="#2563eb">内外归因</text><text x="69" y="164" font-size="11" fill="#334155">先换"已知好的"电源/线缆</text><text x="69" y="184" font-size="11" fill="#334155">传感器，把故障域切成板内/板外</text><text x="69" y="206" font-size="10" fill="#64748b">何时用：开工第一步——30 秒排除一半嫌疑</text><rect x="415" y="100" width="340" height="130" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="439" y="134" font-size="15" font-weight="bold" fill="#dc2626">对比法</text><text x="439" y="164" font-size="11" fill="#334155">好板并排同点测量——差异即线索，玄学变科学</text><text x="439" y="198" font-size="10" fill="#64748b">何时用：量产批次不良、玄学故障</text><rect x="45" y="260" width="340" height="130" rx="14" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><text x="69" y="294" font-size="15" font-weight="bold" fill="#b45309">极限法</text><text x="69" y="324" font-size="11" fill="#334155">电压拉偏 ±10%、温度吹风/冷冻</text><text x="69" y="344" font-size="11" fill="#334155">把偶发故障逼成必现</text><text x="69" y="366" font-size="10" fill="#64748b">何时用：偶发不现形就没法测</text><rect x="415" y="260" width="340" height="130" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><text x="439" y="294" font-size="15" font-weight="bold" fill="#7c3aed">隔离法</text><text x="439" y="324" font-size="11" fill="#334155">断开疑似负载/后级，看前级是否恢复</text><text x="439" y="358" font-size="10" fill="#64748b">何时用：短路、过载、闩锁定位</text><g filter="url(#pglow)"><circle r="5" fill="#059669"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M60,105 H740 V385 H60 V105"/></circle></g>
<text x="400" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">四招组合就是老手的节奏——先内外、再对比、极限逼、隔离切</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="149.5" y="431.9" width="500.9" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 内外归因：先换已知好的电源/线缆/传感器——30 秒排除一半嫌疑<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="193.3" y="431.9" width="413.4" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 对比法：好板并排同点测——差异即线索，玄学变科学<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="154.3" y="431.9" width="491.4" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 极限法：电压拉偏 ±10%、温度吹风冷冻——把偶发故障逼成必现<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="166.2" y="431.9" width="467.6" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="445" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 隔离法：断开疑似负载/后级，看前级恢复——短路、闩锁现形<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
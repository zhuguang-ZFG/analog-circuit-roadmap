<path d="M430,372 L433,370 L437,368 L440,366 L443,364 L447,363 L450,361 L453,359 L457,357 L460,355 L463,353 L467,351 L470,350 L473,348 L477,346 L480,344 L483,342 L487,344 L490,346 L493,348 L497,350 L500,351 L503,353 L507,355 L510,357 L513,359 L517,361 L520,363 L523,364 L527,366 L530,368 L533,370 L537,372 L540,370 L543,368 L547,366 L550,364 L553,363 L557,361 L560,359 L563,357 L567,355 L570,353 L573,351 L577,350 L580,348 L583,346 L587,344 L590,342 L593,344 L597,346 L600,348 L603,350 L607,351 L610,353 L613,355 L617,357 L620,359 L623,361 L627,363 L630,364 L633,366 L637,368 L640,370 L643,372 L647,370 L650,368 L653,366 L657,364 L660,363 L663,361 L667,359 L670,357 L673,355 L677,353 L680,351 L683,350 L687,348 L690,346 L693,344 L697,342 L700,344 L703,346 L707,348 L710,350 L713,351 L717,353 L720,355 L723,357 L727,359 L730,361 L733,363 L737,364 L740,366 L743,368 L747,370 L750,372" fill="none" stroke="#059669" stroke-width="2.8"/>
<line x1="430" y1="392" x2="750" y2="392" stroke="#2563eb" stroke-width="2.8"/>
<text x="440" y="412" font-size="11.5" font-weight="bold" fill="#2563eb">输出 24V = 12V/(1−0.5)</text>
<text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 开关闭合：12V 全加在电感上，电流斜坡上升——能量存进磁场（输出靠电容撑）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.26;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 开关断开：电感不许电流突变，极性翻转与 12V 串联叠加——顶开二极管向 24V 灌能<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.5;0.56;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 伏秒平衡：Vin·D = (Vout−Vin)·(1−D) → Vout = Vin/(1−D)——D 越近 1 升得越高<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
<rect x="35" y="470" width="730" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="492" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">升压的秘密 = 电感电压与输入「叠罗汉」；Buck 是电感在后级碾平，Boost 是电感在前级打气</text>
</g></svg>
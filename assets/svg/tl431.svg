<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">TL431：会"变身"的基准——自带 2.5V 标尺的比较器</text>

<text x="250" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">TL431 内部：基准 + 运放 + 吸入级</text>
<rect x="70" y="80" width="330" height="220" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="235" y="104" text-anchor="middle" font-size="11" fill="#94a3b8">TL431 内部框图</text>
<text x="20" y="196" font-size="11.5" font-weight="bold" fill="#059669">REF</text>
<line x1="52" y1="192" x2="120" y2="192" stroke="#334155" stroke-width="2.5"/>
<polygon points="150,160 150,224 220,192" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="156" y="184" font-size="12" font-weight="bold" fill="#059669">+</text>
<text x="156" y="214" font-size="12" font-weight="bold" fill="#dc2626">−</text>
<line x1="120" y1="192" x2="150" y2="176" stroke="#334155" stroke-width="2"/>
<rect x="110" y="236" width="90" height="30" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="155" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2563eb">带隙 2.5V</text>
<line x1="155" y1="236" x2="155" y2="208" stroke="#334155" stroke-width="2"/>
<g stroke="#334155" fill="none" stroke-width="2.5">
<circle cx="268" cy="192" r="34" stroke-width="1.8"/>
<line x1="245" y1="172" x2="245" y2="212" stroke-width="3.5"/>
<line x1="245" y1="184" x2="280" y2="157"/>
<line x1="245" y1="200" x2="280" y2="227"/>
<line x1="280" y1="157" x2="280" y2="137"/>
<line x1="280" y1="227" x2="280" y2="247"/>
<line x1="195" y1="192" x2="245" y2="192"/>
<polygon points="280,227 267.5,223.6 273.5,215.8" fill="#334155" stroke="none"/>
</g>
<text x="187" y="184" font-size="12.5" font-weight="bold" fill="#dc2626">B</text>
<text x="289" y="144" font-size="12.5" font-weight="bold" fill="#2563eb">C</text>
<text x="289" y="252" font-size="12.5" font-weight="bold" fill="#059669">E</text>
<line x1="220" y1="192" x2="245" y2="192" stroke="#334155" stroke-width="2"/>
<line x1="280" y1="137" x2="280" y2="110" stroke="#334155" stroke-width="2.5"/>
<text x="292" y="116" font-size="11.5" font-weight="bold" fill="#dc2626">K（阴极吸流）</text>
<line x1="280" y1="247" x2="280" y2="268" stroke="#334155" stroke-width="2"/>
<text x="292" y="266" font-size="11.5" font-weight="bold" fill="#475569">A（阳极）</text>
<line x1="280" y1="268" x2="280" y2="282" stroke="#334155" stroke-width="2"/>
<text x="60" y="330" font-size="11" fill="#dc2626" opacity="0">REF &lt; 2.5V：调整管关，K 不吸流
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.4;0.46;1" dur="6s" repeatCount="indefinite"/></text>
<text x="60" y="354" font-size="11" fill="#059669" opacity="0">REF &gt; 2.5V：调整管开，K 猛吸流把电压拽下来
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/></text>
<g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/><g filter="url(#pglow)"><circle r="5" fill="#dc2626"><animateMotion dur="2.0s" begin="-0.50s" repeatCount="indefinite" path="M284,114 V160 V222 V264"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite" path="M284,114 V160 V222 V264"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="2.0s" begin="0.50s" repeatCount="indefinite" path="M284,114 V160 V222 V264"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite" path="M284,114 V160 V222 V264"/></circle></g></g>
<rect x="460" y="90" width="290" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="605" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">变身稳压器：分压采样闭环</text>
<text x="480" y="146" font-size="11" fill="#475569">Vout ──[R1]──┬── REF</text>
<text x="480" y="168" font-size="11" fill="#475569">            [R2]</text>
<text x="480" y="190" font-size="11" fill="#475569">K 串电阻到 Vout，A 接地</text>
<text x="480" y="218" font-size="11.5" font-weight="bold" fill="#2563eb">Vout = 2.5V × (1 + R1/R2)</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/><rect x="78.5" y="416.9" width="643.1" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① REF 与内部 2.5V 带隙基准比大小——低于基准：运放关断调整管，阴极不吸流（高阻）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/><rect x="86.0" y="416.9" width="627.9" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② REF 高过 2.5V 一点点：运放立刻导通调整管——阴极大力吸流，把采样源头电压拽低<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/><rect x="17.8" y="416.9" width="764.4" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 分压器把 Vout 按比例送到 REF——闭环自动停在 REF=2.5V：Vout=2.5×(1+R1/R2)，换电阻=换电压<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.79;1" dur="6s" repeatCount="indefinite"/>
<rect x="35" y="450" width="730" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="41" y="457" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="472.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">阴极电压永远 ≥2.5V——并联稳压、精密恒流、光耦反馈全用它</text>
</g></svg>
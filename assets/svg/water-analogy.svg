<text x="520" y="520" text-anchor="middle" font-size="10" fill="#64748b">转速不能突变，断电顶着冲</text>
<circle cx="280" cy="460" r="27" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>

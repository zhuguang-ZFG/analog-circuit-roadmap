<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">水路 = 电路：一张图看懂全书通用比喻（第 0 章 0.1）</text>

<text x="400" y="48" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">同一套直觉：水怎么流，电就怎么走——八个词，一张图</text>

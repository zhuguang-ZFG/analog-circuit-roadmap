<text x="400" y="472" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">惠普第一桶金 HP200A 就是这颗灯泡：幅度大→灯丝热→阻升→增益降，自稳在 3 倍</text>
</g></svg>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">运放反相放大器：「虚短虚断」是怎么回事（增益 = −Rf/Rin）</text>

<text x="300" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">反相放大电路（LM358，±12V 供电）</text>

<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">从需求到打样：六步流程</text>

<text x="400" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">从需求到打样：六步流程</text>
<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">六步一链，粒子从头走到尾——仿真不过，沿橙色回环回炉</text>
<rect x="19" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><circle cx="37" cy="127" r="11" fill="#2563eb"/><text x="37" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text><text x="77" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">需求指标</text><text x="77" y="179" text-anchor="middle" font-size="9.5" fill="#475569">精度/带宽/功耗/温度</text><line x1="135" y1="165" x2="148" y2="165" stroke="#334155" stroke-width="2"/><polygon points="151,165 144,160 144,170" fill="#334155"/><rect x="148" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><circle cx="166" cy="127" r="11" fill="#2563eb"/><text x="166" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text><text x="206" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">拓扑选择</text><text x="206" y="179" text-anchor="middle" font-size="9.5" fill="#475569">差分/单端、LDO/DCDC</text><line x1="264" y1="165" x2="277" y2="165" stroke="#334155" stroke-width="2"/><polygon points="280,165 273,160 273,170" fill="#334155"/><rect x="277" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><circle cx="295" cy="127" r="11" fill="#7c3aed"/><text x="295" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text><text x="335" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">器件选型</text><text x="335" y="179" text-anchor="middle" font-size="9.5" fill="#475569">绝对最大额定→电特性</text><line x1="393" y1="165" x2="406" y2="165" stroke="#334155" stroke-width="2"/><polygon points="409,165 402,160 402,170" fill="#334155"/><rect x="406" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><circle cx="424" cy="127" r="11" fill="#7c3aed"/><text x="424" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text><text x="464" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">仿真验证</text><text x="464" y="179" text-anchor="middle" font-size="9.5" fill="#475569">DC/瞬态/AC/温度</text><line x1="522" y1="165" x2="535" y2="165" stroke="#334155" stroke-width="2"/><polygon points="538,165 531,160 531,170" fill="#334155"/><rect x="535" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><circle cx="553" cy="127" r="11" fill="#b45309"/><text x="553" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text><text x="593" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">降额与保护</text><text x="593" y="179" text-anchor="middle" font-size="9.5" fill="#475569">电容50-80%、电阻50%</text><line x1="651" y1="165" x2="664" y2="165" stroke="#334155" stroke-width="2"/><polygon points="667,165 660,160 660,170" fill="#334155"/><rect x="664" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/><circle cx="682" cy="127" r="11" fill="#059669"/><text x="682" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text><text x="722" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">打样测试</text><text x="722" y="179" text-anchor="middle" font-size="9.5" fill="#475569">指标对照、不过回炉</text><circle r="5" fill="#059669"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M29,165 H770"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M29,165 H770"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M29,165 H770"/></circle><path d="M464,105 Q399.5,80 335,105" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3"/><circle r="4.5" fill="#b45309"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M464,105 Q399.5,80 335,105"/></circle>
<text x="400" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">流程是螺旋不是直线：仿真验证不过 → 回炉改选型/降额——指标逐条对照再进下一步</text>
<text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 需求指标先行：把"好用"翻译成数字——精度 mV？带宽 Hz？功耗 mA？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 先选架构再选器件：差分还是单端？LDO 还是 DCDC？反馈还是开环？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 读 datasheet：绝对最大额定值 → 电特性表 → 典型特性曲线<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
<text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 降额设计：额定值是"会死的边界"，不是工作点——电容 50~80%、电阻 50%<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text>
</svg>
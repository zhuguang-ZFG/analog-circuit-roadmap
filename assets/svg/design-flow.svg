<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
<title>从需求到打样：六步流程</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="430" fill="url(#bgL)"/>
<rect width="800" height="430" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="430" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">从需求到打样：六步流程</text>

<text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">六步一链，粒子从头走到尾——仿真不过，沿橙色回环回炉</text>
<rect x="19" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><circle cx="37" cy="127" r="11" fill="#2563eb"/><text x="37" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text><text x="77" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">需求指标</text><text x="77" y="179" text-anchor="middle" font-size="9.5" fill="#475569">精度/带宽/功耗/温度</text><line x1="135" y1="165" x2="148" y2="165" stroke="#334155" stroke-width="2"/><polygon points="151,165 144,160 144,170" fill="#334155"/><rect x="148" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><circle cx="166" cy="127" r="11" fill="#2563eb"/><text x="166" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text><text x="206" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">拓扑选择</text><text x="206" y="179" text-anchor="middle" font-size="9.5" fill="#475569">差分/单端、LDO/DCDC</text><line x1="264" y1="165" x2="277" y2="165" stroke="#334155" stroke-width="2"/><polygon points="280,165 273,160 273,170" fill="#334155"/><rect x="277" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><circle cx="295" cy="127" r="11" fill="#7c3aed"/><text x="295" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text><text x="335" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">器件选型</text><text x="335" y="179" text-anchor="middle" font-size="9.5" fill="#475569">绝对最大额定→电特性</text><line x1="393" y1="165" x2="406" y2="165" stroke="#334155" stroke-width="2"/><polygon points="409,165 402,160 402,170" fill="#334155"/><rect x="406" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><circle cx="424" cy="127" r="11" fill="#7c3aed"/><text x="424" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text><text x="464" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">仿真验证</text><text x="464" y="179" text-anchor="middle" font-size="9.5" fill="#475569">DC/瞬态/AC/温度</text><line x1="522" y1="165" x2="535" y2="165" stroke="#334155" stroke-width="2"/><polygon points="538,165 531,160 531,170" fill="#334155"/><rect x="535" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><circle cx="553" cy="127" r="11" fill="#b45309"/><text x="553" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text><text x="593" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">降额与保护</text><text x="593" y="179" text-anchor="middle" font-size="9.5" fill="#475569">电容50-80%、电阻50%</text><line x1="651" y1="165" x2="664" y2="165" stroke="#334155" stroke-width="2"/><polygon points="667,165 660,160 660,170" fill="#334155"/><rect x="664" y="105" width="116" height="120" rx="12" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/><circle cx="682" cy="127" r="11" fill="#059669"/><text x="682" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text><text x="722" y="155" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">打样测试</text><text x="722" y="179" text-anchor="middle" font-size="9.5" fill="#475569">指标对照、不过回炉</text><g filter="url(#pglow)"><circle r="5" fill="#059669"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M29,165 H770"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M29,165 H770"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M29,165 H770"/></circle></g><path d="M464,105 Q399.5,80 335,105" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4,3"/><g filter="url(#pglow)"><circle r="4.5" fill="#b45309"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M464,105 Q399.5,80 335,105"/></circle></g>
<text x="400" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">流程是螺旋不是直线：仿真验证不过 → 回炉改选型/降额——指标逐条对照再进下一步</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/><rect x="134.4" y="316.9" width="531.2" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 需求指标先行：把"好用"翻译成数字——精度 mV？带宽 Hz？功耗 mA？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.25;0.27;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/><rect x="138.6" y="316.9" width="522.8" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 先选架构再选器件：差分还是单端？LDO 还是 DCDC？反馈还是开环？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.50;0.52;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="165.9" y="316.9" width="468.2" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 读 datasheet：绝对最大额定值 → 电特性表 → 典型特性曲线<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/><rect x="114.1" y="316.9" width="571.9" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="330" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 降额设计：额定值是"会死的边界"，不是工作点——电容 50~80%、电阻 50%<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">一只晶体管的三种人生：共射、共集、共基</text>

<text x="400" y="56" text-anchor="middle" font-size="11" fill="#64748b">信号从哪进、从哪出、哪个极做交流公共端 —— 决定它的性格</text>
<rect x="30" y="66" width="240" height="290" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/><text x="150" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">共射 CE</text><polygon points="108,116 108,184 168,150" fill="#f8fafc" stroke="#2563eb" stroke-width="2.2"/><text x="176" y="146" font-size="11" font-weight="bold" fill="#2563eb">B 进 → C 出</text><line x1="44" y1="196" x2="256" y2="196" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="218" font-size="11" fill="#475569">电压增益</text><text x="254" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">高（几十~几百）</text><text x="46" y="240" font-size="11" fill="#475569">输入阻抗</text><text x="254" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">中 ~kΩ</text><text x="46" y="262" font-size="11" fill="#475569">输出阻抗</text><text x="254" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">中 ~kΩ</text><text x="46" y="284" font-size="11" fill="#475569">相位</text><text x="254" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">反相 180°</text><line x1="44" y1="298" x2="256" y2="298" stroke="#e2e8f0" stroke-width="1"/><text x="46" y="320" font-size="11" fill="#475569">用途</text><text x="254" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">放大主力</text><rect x="283" y="66" width="240" height="290" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="1.8"/><text x="403" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">共集 CC</text><polygon points="361,116 361,184 421,150" fill="#f8fafc" stroke="#059669" stroke-width="2.2"/><text x="429" y="146" font-size="11" font-weight="bold" fill="#059669">B 进 → E 出</text><line x1="297" y1="196" x2="509" y2="196" stroke="#cbd5e1" stroke-width="1"/><text x="299" y="218" font-size="11" fill="#475569">电压增益</text><text x="507" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#059669">≈1（略小于 1）</text><text x="299" y="240" font-size="11" fill="#475569">输入阻抗</text><text x="507" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#059669">高</text><text x="299" y="262" font-size="11" fill="#475569">输出阻抗</text><text x="507" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#059669">低（Ω 级）</text><text x="299" y="284" font-size="11" fill="#475569">相位</text><text x="507" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#059669">同相</text><line x1="297" y1="298" x2="509" y2="298" stroke="#e2e8f0" stroke-width="1"/><text x="299" y="320" font-size="11" fill="#475569">用途</text><text x="507" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#059669">缓冲/阻抗变换</text><rect x="536" y="66" width="240" height="290" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.8"/><text x="656" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b45309">共基 CB</text><polygon points="614,116 614,184 674,150" fill="#f8fafc" stroke="#b45309" stroke-width="2.2"/><text x="682" y="146" font-size="11" font-weight="bold" fill="#b45309">E 进 → C 出</text><line x1="550" y1="196" x2="762" y2="196" stroke="#cbd5e1" stroke-width="1"/><text x="552" y="218" font-size="11" fill="#475569">电压增益</text><text x="760" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">高</text><text x="552" y="240" font-size="11" fill="#475569">输入阻抗</text><text x="760" y="240" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">极低（几十Ω）</text><text x="552" y="262" font-size="11" fill="#475569">输出阻抗</text><text x="760" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">中</text><text x="552" y="284" font-size="11" fill="#475569">相位</text><text x="760" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">同相</text><line x1="550" y1="298" x2="762" y2="298" stroke="#e2e8f0" stroke-width="1"/><text x="552" y="320" font-size="11" fill="#475569">用途</text><text x="760" y="320" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">高频放大</text>
<line x1="30" y1="378" x2="770" y2="378" stroke="#cbd5e1" stroke-width="1"/>
<text x="400" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">三句话记住它们</text>
<text x="60" y="436" font-size="11.5" fill="#475569">① <tspan font-weight="bold" fill="#2563eb">共射</tspan>：电压放大最强、但输入输出阻抗都平庸——「主力但不好带」</text>
<text x="60" y="460" font-size="11.5" fill="#475569">② <tspan font-weight="bold" fill="#059669">共集（射随器）</tspan>：放弃电压增益，换来「高进低出」——前级带不动？中间插一级它</text>
<text x="60" y="484" font-size="11.5" fill="#475569">③ <tspan font-weight="bold" fill="#b45309">共基</tspan>：牺牲输入阻抗换高频性能——Miller 电容不再接地，高频放大器的最爱</text>
<rect x="60" y="506" width="680" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="76" y="532" font-size="12" font-weight="bold" fill="#b45309">射随器为什么叫「跟随」</text>
<text x="76" y="554" font-size="11.5" fill="#475569">V_E = V_B − 0.7V：基极动多少、发射极跟着动多少（差一个死板的 0.7V）。它放大的不是电压而是<tspan font-weight="bold">电流</tspan>：</text>
<text x="76" y="574" font-size="11.5" fill="#475569">信号源只出 I_B，负载拿走 I_E = (1+β)·I_B —— 这就是「阻抗变换」的全部秘密</text>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" repeatCount="indefinite" path="M78,150 L136,150 L164,150" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="11s" begin="-1.1s" repeatCount="indefinite" path="M331,150 L389,150 L417,150" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#b45309"><animateMotion dur="11s" begin="-2.2s" repeatCount="indefinite" path="M584,150 L642,150 L670,150" keyPoints="0;1" keyTimes="0;1"/></circle>
<rect x="38" y="92" width="224" height="30" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="291" y="92" width="224" height="30" rx="8" fill="none" stroke="#059669" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M50,340 L246,340"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M303,340 L499,340"/></circle>
<circle cx="400" cy="552" r="5" fill="none" stroke="#b45309" stroke-width="2.2">
<animate attributeName="r" values="5;12;5" dur="2.0s" repeatCount="indefinite"/></circle>
<rect x="544" y="92" width="224" height="30" rx="8" fill="none" stroke="#b45309" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="163.0" y="591.0" width="474.0" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 共射：电压增益最高但阻抗平庸，还好反相——放大主力的代价<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="136.0" y="591.0" width="528.1" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 共集：电压增益 ≈1 却成神器——高输入阻抗 + 极低输出阻抗 = 缓冲器<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="153.0" y="591.0" width="494.0" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 共基：输入阻抗极低，但高频性能最好（没有 Miller 效应拖后腿）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="163.0" y="591.0" width="474.0" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 级联心法：共射打头阵放大、射随器垫后驱动、共基守高频前线<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
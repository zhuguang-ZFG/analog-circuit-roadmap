<text x="130" y="312" text-anchor="end" font-size="11.5" fill="#475569">C1</text>
<text x="130" y="326" text-anchor="end" font-size="10.5" fill="#475569">22 pF</text>
<text x="330" y="312" font-size="11.5" fill="#475569">C2</text>
<text x="330" y="326" font-size="10.5" fill="#475569">22 pF</text>
<rect x="432" y="76" width="332" height="286" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="598" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">为什么晶体准得离谱</text>
<line x1="448" y1="116" x2="748" y2="116" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="452" y="142" font-size="11.5" fill="#334155">· Q 值 10⁴ ~ 10⁶（LC 只有 10 ~ 100）</text>
<text x="452" y="168" font-size="11.5" fill="#334155">· 温漂 ±0.5 ppm/℃ 以内</text>
<text x="452" y="194" font-size="11.5" fill="#334155">· C_L = C₁C₂/(C₁+C₂) + C_stray</text>
<text x="452" y="220" font-size="11.5" fill="#334155">· 牵引灵敏度 ≈ 18 ppm/pF</text>
<text x="452" y="246" font-size="11.5" fill="#334155">· 判据 R_neg ≥ 5 × ESR_max</text>
<text x="452" y="272" font-size="11.5" fill="#334155">· g_m,crit = 4·ESR·ω²·(C₀+C_L)²</text>
<text x="452" y="298" font-size="11.5" fill="#334155">· 8 MHz → 0.26 mA/V</text>
<text x="452" y="324" font-size="11.5" fill="#334155">· 32.768 kHz → 1.7 µA/V</text>

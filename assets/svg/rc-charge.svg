[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">RC 充电：电容是"水桶"，电阻是"细水管"</text>

<text x="200" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">电路</text>
<line x1="60" y1="120" x2="60" y2="196" stroke="#334155" stroke-width="2.5"/>
<line x1="60" y1="222" x2="60" y2="300" stroke="#334155" stroke-width="2.5"/>
<line x1="46" y1="196" x2="74" y2="196" stroke="#334155" stroke-width="2"/>
<line x1="52" y1="222" x2="68" y2="222" stroke="#334155" stroke-width="4"/>
<text x="36" y="193" font-size="13" fill="#334155">+</text>
<text x="30" y="216" font-size="13" fill="#334155">−</text>
<text x="18" y="260" font-size="13" font-weight="bold" fill="#b45309">5V</text>
<line x1="60" y1="120" x2="100" y2="120" stroke="#334155" stroke-width="2.5"/>
<circle cx="100" cy="120" r="3.5" fill="#334155"/>
<line x1="100" y1="120" x2="132" y2="106" stroke="#334155" stroke-width="2.5"/>
<circle cx="136" cy="120" r="3.5" fill="#334155"/>
<text x="70" y="97" font-size="11.5" fill="#475569">开关</text>
<line x1="136" y1="120" x2="150" y2="120" stroke="#334155" stroke-width="2.5"/>
<rect x="150" y="108" width="70" height="24" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="185" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">R = 1kΩ</text>
<text x="185" y="124" text-anchor="middle" font-size="11" fill="#475569">水管</text>
<line x1="220" y1="120" x2="320" y2="120" stroke="#334155" stroke-width="2.5"/>
<line x1="320" y1="120" x2="320" y2="235" stroke="#334155" stroke-width="2.5"/>
<line x1="285" y1="235" x2="355" y2="235" stroke="#334155" stroke-width="3"/>
<line x1="285" y1="265" x2="355" y2="265" stroke="#334155" stroke-width="3"/>
<rect x="291" y="263" width="58" height="0" fill="#3b82f6" opacity="0.75">
  <animate attributeName="height" values="0.0;11.3;17.3;20.6;22.6;23.6" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="y" values="263.0;251.7;245.7;242.4;240.4;239.4" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="424" y="252" text-anchor="end" font-size="13" font-weight="bold" fill="#2563eb">C = 10µF</text>
<text x="372" y="270" font-size="11" fill="#475569">水位=电量</text>
<line x1="320" y1="265" x2="320" y2="300" stroke="#334155" stroke-width="2.5"/>
<line x1="320" y1="300" x2="60" y2="300" stroke="#334155" stroke-width="2.5"/>
<line x1="190" y1="286" x2="190" y2="300" stroke="#334155" stroke-width="2.5"/><line x1="174" y1="300" x2="206" y2="300" stroke="#334155" stroke-width="3"/><line x1="180" y1="306" x2="200" y2="306" stroke="#334155" stroke-width="3"/><line x1="186" y1="312" x2="194" y2="312" stroke="#334155" stroke-width="3"/>
<g filter="url(#pglow)"><circle r="5.5" fill="#f59e0b"><animateMotion dur="5s" begin="-0.50s" repeatCount="indefinite" path="M66,112 H314 V228" keyPoints="0;0.5;0.8;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle>
<circle r="5.5" fill="#f59e0b"><animateMotion dur="5s" begin="0.75s" repeatCount="indefinite" path="M66,112 H314 V228" keyPoints="0;0.5;0.8;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle>
<circle r="5.5" fill="#f59e0b"><animateMotion dur="5s" begin="2.00s" repeatCount="indefinite" path="M66,112 H314 V228" keyPoints="0;0.5;0.8;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle>
<circle r="5.5" fill="#f59e0b"><animateMotion dur="5s" begin="3.25s" repeatCount="indefinite" path="M66,112 H314 V228" keyPoints="0;0.5;0.8;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle></g>
<text x="120" y="152" font-size="11.5" fill="#b45309">电流（先快后慢）</text>

<text x="585" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">电容电压 vC(t)</text>
<line x1="430" y1="350" x2="758" y2="350" stroke="#64748b" stroke-width="2"/>
<line x1="430" y1="350" x2="430" y2="115" stroke="#64748b" stroke-width="2"/>
<text x="752" y="370" text-anchor="end" font-size="12" fill="#475569">t →</text>
<text x="420" y="120" text-anchor="end" font-size="12" fill="#475569">vC</text>
<line x1="430" y1="182" x2="755" y2="182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="425" y="186" text-anchor="end" font-size="12" fill="#475569">5V</text>
<line x1="494" y1="350" x2="494" y2="243" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" opacity="0">
 <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="5s" repeatCount="indefinite"/></line>
<line x1="430" y1="243" x2="494" y2="243" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" opacity="0">
 <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="5s" repeatCount="indefinite"/></line>
<text x="494" y="365" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309" opacity="0">τ=10ms
 <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="5s" repeatCount="indefinite"/></text>
<text x="425" y="247" text-anchor="end" font-size="12" font-weight="bold" fill="#b45309" opacity="0">63.2%
 <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.66;1" dur="5s" repeatCount="indefinite"/></text>
<path d="M430,350 L440,326 L450,305 L460,287 L470,272 L480,259 L490,248 L500,238 L510,230 L520,223 L530,217 L540,212 L550,208 L560,204 L570,201 L580,198 L590,196 L600,194 L610,192 L620,191 L630,189 L640,188 L650,187 L660,187 L670,186 L680,185 L690,185 L700,184 L710,184 L720,184 L730,184 L740,183 L750,183" fill="none" stroke="#2563eb" stroke-width="1.8" opacity="0.18"/><path d="M430,350 L440,326 L450,305 L460,287 L470,272 L480,259 L490,248 L500,238 L510,230 L520,223 L530,217 L540,212 L550,208 L560,204 L570,201 L580,198 L590,196 L600,194 L610,192 L620,191 L630,189 L640,188 L650,187 L660,187 L670,186 L680,185 L690,185 L700,184 L710,184 L720,184 L730,184 L740,183 L750,183" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700"><animate attributeName="stroke-dashoffset" values="700;700;0;0" keyTimes="0;0.85;1" dur="5s" repeatCount="indefinite"/></path>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.05;0.28;0.32;1" dur="5s" repeatCount="indefinite"/><rect x="186.0" y="386.9" width="427.9" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.32;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">第 1 拍：刚合闸，桶是空的——电流最猛（粒子最密最快）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.32;1" dur="5s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.32;0.36;0.60;0.64;1" dur="5s" repeatCount="indefinite"/><rect x="193.6" y="386.9" width="412.8" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.60;0.64;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">第 2 拍：水位上涨反顶着电流——越充越慢（指数曲线）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.60;0.64;1" dur="5s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.64;0.68;1" dur="5s" repeatCount="indefinite"/><rect x="171.9" y="386.9" width="456.2" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">第 3 拍：1τ 充到 63%，3τ 到 95%——τ 就是电路的「性格」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="5s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="5s" repeatCount="indefinite"/>
<rect x="140" y="418" width="520" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="146" y="425" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="440.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">τ = R×C：电阻大=水管细，电容大=水桶深，都让它更慢</text>
</g></svg>
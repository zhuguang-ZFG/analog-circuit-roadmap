<text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#94a3b8" opacity="0">① 低频：R 说了算——理想电阻的直线在 0.8GHz 之前都成立<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 中频：并联的 0.2pF 开始分流，曲线按 −20dB/dec 下坠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 高频：1GHz 时「1kΩ 电阻」实际只剩 643Ω——它已经变成复合元件<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">④ 再往上（15.9GHz）引线电感接管：元件又「变回电感」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="11s" repeatCount="indefinite"/>
<rect x="20" y="576" width="760" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="598" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">每个元件都有两个寄生夺权点：C 在 f₁=1/(2πRC) 开始、L 在 f₂=R/(2πL) 结束——中间才是它「当电阻」的区间</text>
</g></svg>
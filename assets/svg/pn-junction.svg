<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="ttl">
<title id="ttl">PN 结：一堵会自己调节高度的「电荷墙」</title>
<desc>PN 结：一堵会自己调节高度的「电荷墙」；节拍：① 浓度差驱动扩散：N 侧电子往 P 侧跑，P 侧空穴往 N 侧跑；② 复合掉的地方留下不能动的离子 → 变成一堵「电荷墙」（耗尽层）；③ 墙越高推力越大：扩散多一分它就厚一分——直到势均力敌；④ 二极管不是开关，是拔河：外加电压抵掉多少内建电势，电流就涨多少</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="620" fill="url(#bgL)"/>
<rect width="800" height="620" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="620" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
/* 尊重系统的「减弱动效」偏好：把"会飞"的东西关掉 —— 电流粒子、波形游标、
   扫压圆点、脉冲辉光圈，它们是前庭不适的根源。器件状态变化与节拍字幕保留：
   字幕是多路复用（同一行轮流显示），若一起显示反而互相压字、更读不了。
   选择器靠结构而非类名，所以新增动画无需额外登记；老浏览器不支持 :has()
   时整块被忽略，退化为"照常播放"，不会白屏。 */
@media (prefers-reduced-motion: reduce){
:has(> animateMotion):not(:has(text)),
:has(> animateTransform):not(:has(text)),
:has(> animate:not([attributeName="opacity"])):not(:has(text)){display:none}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">PN 结：一堵会自己调节高度的「电荷墙」</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">扩散想散开，电场往回推——平衡点就是内建电势</text>
<rect x="60" y="80" width="230" height="120" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="175" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">P 型（空穴多）</text>
<text x="175" y="128" text-anchor="middle" font-size="11" fill="#475569">受主离子带负电（固定不动）</text>
<text x="175" y="150" text-anchor="middle" font-size="11" fill="#475569">空穴 +</text>
<rect x="300" y="80" width="230" height="120" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="415" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">N 型（电子多）</text>
<text x="415" y="128" text-anchor="middle" font-size="11" fill="#475569">施主离子带正电（固定不动）</text>
<text x="415" y="150" text-anchor="middle" font-size="11" fill="#475569">电子 −</text>
<rect x="270" y="80" width="50" height="120" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="295" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">耗尽层</text>
<line x1="270" y1="130" x2="250" y2="130" stroke="#2563eb" stroke-width="2.5"/>
<line x1="320" y1="130" x2="340" y2="130" stroke="#dc2626" stroke-width="2.5"/>
<circle r="6" fill="#dc2626"><animateMotion dur="11s" repeatCount="indefinite" path="M410,150 L316,150 L306,150"/></circle>
<circle r="6" fill="#2563eb"><animateMotion dur="11s" begin="-0.8s" repeatCount="indefinite" path="M180,150 L274,150 L284,150"/></circle>
<circle r="6" fill="#dc2626"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M300,150 L340,150"/></circle>
<line x1="295" y1="230" x2="295" y2="290" stroke="#7c3aed" stroke-width="2.5"/>
<path d="M288,278 L295,292 L302,278 Z" fill="#7c3aed"/>
<text x="306" y="246" font-size="11" font-weight="bold" fill="#7c3aed">内建电场 E</text>
<text x="306" y="266" font-size="11" fill="#475569">把电子往回推</text>
<line x1="60" y1="318" x2="740" y2="318" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="348" font-size="12.5" font-weight="bold" fill="#334155">三步认识它</text>
<text x="60" y="376" font-size="11.5" fill="#475569">① <tspan font-weight="bold" fill="#dc2626">复合</tspan>：浓度差驱动扩散，交界处电子掉进空穴两两湮灭（同一滴墨水滴进清水的统计规律）</text>
<text x="60" y="402" font-size="11.5" fill="#475569">② <tspan font-weight="bold" fill="#7c3aed">建墙</tspan>：跑掉的载流子留下不能动的带电离子 → 电荷墙 → 电场把后续电子往回推</text>
<text x="60" y="428" font-size="11.5" fill="#475569">③ <tspan font-weight="bold" fill="#059669">平衡</tspan>：扩散多一分、墙厚一分、推力大一分 —— 最终恰好抵消，动态平衡</text>
<rect x="60" y="452" width="680" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="76" y="478" font-size="12" font-weight="bold" fill="#b45309">正向导通不是「过了 0.7V 突然开」</text>
<text x="76" y="502" font-size="11.5" fill="#475569">外加正压把内建电势垫高抵消一部分 → 墙变薄 → 扩散重新启动 → 电流爆发式增长。</text>
<text x="76" y="520" font-size="11.5" fill="#475569">二极管是「外加电压与内建电势的拔河」，指数曲线就是拔河的比分牌（见 2.2）。</text>
<rect x="268" y="78" width="54" height="124" rx="8" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<circle cx="295" cy="130" r="5" fill="none" stroke="#7c3aed" stroke-width="2.4">
<animate attributeName="r" values="5;13;5" dur="1.8s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="182.4" y="547.0" width="435.2" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 浓度差驱动扩散：N 侧电子往 P 侧跑，P 侧空穴往 N 侧跑<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="151.3" y="547.0" width="497.5" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 复合掉的地方留下不能动的离子 → 变成一堵「电荷墙」（耗尽层）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="178.2" y="547.0" width="443.7" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 墙越高推力越大：扩散多一分它就厚一分——直到势均力敌<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="140.3" y="547.0" width="519.4" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="560" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 二极管不是开关，是拔河：外加电压抵掉多少内建电势，电流就涨多少<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="11s" repeatCount="indefinite"/>
<rect x="40" y="576" width="720" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="46" y="583" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="598.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">Si 的内建电势约 0.7V——记住它是「平衡态的墙高」，不是「导通门槛」</text>
</g></svg>
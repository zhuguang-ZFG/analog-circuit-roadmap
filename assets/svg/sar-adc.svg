<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="ttl">
<title id="ttl">SAR ADC：四位天平，四次称出答案</title>
<desc>SAR ADC：四位天平，四次称出答案；节拍：① 拍1：先试最高位 8（半天平）——DAC=8 > 5.3，太沉，退掉这一位；② 拍2：试次高位 4——DAC=4 &lt; 5.3，太轻，留下（累计 4）；③ 拍3：试 4+2=6——6 &gt; 5.3，退；拍4：试 4+1=5——5 &lt; 5.3，留 → 0101；④ N 位只要 N 拍：12 位=12 拍——速度与精度折中里的「中」就是这么来的</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="520" fill="url(#bgL)"/>
<rect width="800" height="520" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="520" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
/* 尊重系统的「减弱动效」偏好：把"会飞"的东西关掉 —— 电流粒子、波形游标、
   扫压圆点、脉冲辉光圈，它们是前庭不适的根源。器件状态变化与节拍字幕保留：
   字幕是多路复用（同一行轮流显示），若一起显示反而互相压字、更读不了。
   选择器靠结构而非类名，所以新增动画无需额外登记；老浏览器不支持 :has()
   时整块被忽略，退化为"照常播放"，不会白屏。 */
@media (prefers-reduced-motion: reduce){
:has(> animateMotion):not(:has(text)),
:has(> animateTransform):not(:has(text)),
:has(> animate:not([attributeName="opacity"])):not(:has(text)){display:none}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">SAR ADC：四位天平，四次称出答案</text>

<text x="240" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">SAR = 二分查找的硬件版（4 位演示：满量程 16，输入 5.3）</text>
<rect x="60" y="100" width="90" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="105" y="122" text-anchor="middle" font-size="11" fill="#334155">采样保持</text>
<text x="105" y="140" text-anchor="middle" font-size="10" fill="#2563eb">5.3V 抓住</text>
<line x1="150" y1="125" x2="190" y2="125" stroke="#334155" stroke-width="2.5"/>
<polygon points="190,100 190,150 240,125" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="196" y="118" font-size="11" font-weight="bold" fill="#059669">+</text>
<text x="196" y="142" font-size="11" font-weight="bold" fill="#dc2626">−</text>
<circle r="4.5" fill="#7c3aed"><animateMotion dur="8s" begin="-0.5s" repeatCount="indefinite" path="M250,100 L242,100 L242,112"/></circle>
<circle r="4.5" fill="#7c3aed"><animateMotion dur="8s" begin="-1.3s" repeatCount="indefinite" path="M280,127 L280,188"/></circle>
<circle r="4.5" fill="#059669"><animateMotion dur="8s" begin="-2.1s" repeatCount="indefinite" path="M316,188 L316,62 L318,62"/></circle>
<rect x="270" y="190" width="90" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="315" y="210" text-anchor="middle" font-size="11" fill="#334155">SAR 逻辑</text>
<text x="315" y="226" text-anchor="middle" font-size="10" fill="#475569">留/退裁决</text>
<line x1="240" y1="125" x2="280" y2="125" stroke="#334155" stroke-width="2"/>
<line x1="280" y1="125" x2="280" y2="190" stroke="#334155" stroke-width="2"/>
<rect x="250" y="80" width="70" height="36" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="285" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">DAC</text>
<line x1="250" y1="98" x2="240" y2="98" stroke="#334155" stroke-width="2"/>
<line x1="240" y1="98" x2="240" y2="112" stroke="#334155" stroke-width="2"/>
<line x1="320" y1="80" x2="320" y2="60" stroke="#334155" stroke-width="2"/>
<line x1="320" y1="60" x2="315" y2="60" stroke="#334155" stroke-width="2"/>
<line x1="315" y1="60" x2="315" y2="190" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>
<text x="330" y="64" font-size="10" fill="#475569">试位码→</text>
<text x="380" y="222" font-size="11" font-weight="bold" fill="#2563eb">结果 0101</text>
<line x1="360" y1="212" x2="380" y2="212" stroke="#334155" stroke-width="2"/>

<text x="590" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">DAC 输出（紫阶）四拍逼近输入线（蓝）</text>
<line x1="430" y1="236" x2="750" y2="236" stroke="#2563eb" stroke-width="2.2"/>
<text x="700" y="228" font-size="10.5" fill="#2563eb">输入 5.3</text>
<path d="M430,300 V204 H510 V252 H590 V228 H670 V240 H750 " fill="none" stroke="#7c3aed" stroke-width="2.8"/>
<line x1="430" y1="300" x2="750" y2="300" stroke="#64748b" stroke-width="1.4"/>
<text x="448" y="330" font-size="10.5" fill="#475569">① 8→退</text>
<text x="528" y="330" font-size="10.5" fill="#475569">② 4→留</text>
<text x="608" y="330" font-size="10.5" fill="#475569">③ 6→退</text>
<text x="688" y="330" font-size="10.5" fill="#475569">④ 5→留</text>
<rect x="430" y="150" width="80" height="150" fill="#7c3aed" opacity="0">
<animate attributeName="opacity" values="0;0.12;0.12;0;0" keyTimes="0;0.03;0.22;0.26;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="510" y="150" width="80" height="150" fill="#7c3aed" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.27;0.3;0.47;0.51;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="590" y="150" width="80" height="150" fill="#7c3aed" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.52;0.55;0.72;0.76;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="670" y="150" width="80" height="150" fill="#7c3aed" opacity="0">
<animate attributeName="opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.77;0.8;0.95;0.98;1" dur="8s" repeatCount="indefinite"/></rect>
<circle r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2">
<animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
  keyPoints="0;0.352;0.352;0.608;0.608;0.84;0.84;1;1" keyTimes="0;0.05;0.24;0.3;0.48;0.55;0.73;0.79;1"
  path="M430,300 V204 H510 V252 H590 V228 H670 V240 H750 "/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.26;1" dur="8s" repeatCount="indefinite"/><rect x="143.0" y="446.9" width="514.0" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.26;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">① 拍1：先试最高位 8（半天平）——DAC=8 > 5.3，太沉，退掉这一位<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.26;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.28;0.33;0.45;0.51;1" dur="8s" repeatCount="indefinite"/><rect x="164.7" y="446.9" width="470.6" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.45;0.51;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 拍2：试次高位 4——DAC=4 &lt; 5.3，太轻，留下（累计 4）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.45;0.51;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.53;0.58;0.75;0.81;1" dur="8s" repeatCount="indefinite"/><rect x="95.2" y="446.9" width="609.6" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.58;0.75;0.81;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 拍3：试 4+2=6——6 &gt; 5.3，退；拍4：试 4+1=5——5 &lt; 5.3，留 → 0101<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.58;0.75;0.81;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.81;0.86;1" dur="8s" repeatCount="indefinite"/><rect x="124.8" y="446.9" width="550.3" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.81;0.86;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">④ N 位只要 N 拍：12 位=12 拍——速度与精度折中里的「中」就是这么来的<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.81;0.86;1" dur="8s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="8s" repeatCount="indefinite"/>
<rect x="55" y="470" width="690" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="61" y="477" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="492.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">比较器是天平的指针，DAC 是砝码，SAR 逻辑是记录员——每拍只问一个问题：「重了还是轻了」</text>
</g></svg>
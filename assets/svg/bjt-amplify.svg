<text x="600" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">波形对照（实测值核算）</text>
<text x="448" y="112" font-size="12" font-weight="bold" fill="#dc2626">基极：0.7V ± 10mV（小信号骑在偏置上）</text>
<line x1="440" y1="185" x2="760" y2="185" stroke="#64748b" stroke-width="1.8"/>
<line x1="440" y1="150" x2="760" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
<text x="755" y="146" text-anchor="end" font-size="10.5" fill="#475569">0.7V 偏置线</text>
<path d="M450,150 L456,152 L462,154 L469,156 L475,158 L481,159 L488,161 L494,162 L500,163 L506,164 L512,164 L519,165 L525,165 L531,165 L538,164 L544,164 L550,163 L556,162 L562,161 L569,159 L575,158 L581,156 L588,154 L594,152 L600,150 L606,148 L612,146 L619,144 L625,142 L631,141 L638,139 L644,138 L650,137 L656,136 L662,136 L669,135 L675,135 L681,135 L688,136 L694,136 L700,137 L706,138 L712,139 L719,141 L725,142 L731,144 L738,146 L744,148 L750,150" fill="none" stroke="#dc2626" stroke-width="3"/>

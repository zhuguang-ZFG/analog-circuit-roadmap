<text x="448" y="252" font-size="12" font-weight="bold" fill="#2563eb">集电极：6.2V ∓ 2V（≈200 倍 · 反相）</text>
<line x1="440" y1="400" x2="760" y2="400" stroke="#64748b" stroke-width="1.8"/>
<path d="M450,330 L456,322 L462,315 L469,308 L475,301 L481,295 L488,289 L494,284 L500,280 L506,276 L512,274 L519,272 L525,272 L531,272 L538,274 L544,276 L550,280 L556,284 L562,289 L569,295 L575,301 L581,308 L588,315 L594,322 L600,330 L606,338 L612,345 L619,352 L625,359 L631,365 L638,371 L644,376 L650,380 L656,384 L662,386 L669,388 L675,388 L681,388 L688,386 L694,384 L700,380 L706,376 L712,371 L719,365 L725,359 L731,352 L738,345 L744,338 L750,330" fill="none" stroke="#2563eb" stroke-width="3"/>

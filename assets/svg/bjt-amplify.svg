<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.04;0.18;0.22;1" dur="6s" repeatCount="indefinite"/><rect x="149.5" y="434.9" width="500.9" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">① 先偏置：R_B 从 12V 喂基流——没有偏置，信号再标准也放不出来<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.18;0.22;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.22;0.26;0.44;0.48;1" dur="6s" repeatCount="indefinite"/><rect x="62.8" y="434.9" width="674.4" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.44;0.48;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 核算：I_B=(12−0.7)÷390k≈29µA → I_C=100×29µA≈2.9mA → V_CE=12−5.8≈6.2V<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.26;0.44;0.48;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.48;0.52;0.78;0.82;1" dur="6s" repeatCount="indefinite"/><rect x="169.5" y="434.9" width="460.9" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.78;0.82;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 放大：基极 ±10mV → 集电极 ∓2V——约 200 倍，方向相反<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.52;0.78;0.82;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/><rect x="166.2" y="434.9" width="467.6" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="448" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">④ 能量全部来自 12V 电源——三极管是阀门，从不「创造」能量<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="6s" repeatCount="indefinite"/>
<rect x="80" y="462" width="640" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="86" y="469" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="484.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">2N2222 datasheet：hFE=75~300@10mA，设计时按 β=100 下限留余量</text>

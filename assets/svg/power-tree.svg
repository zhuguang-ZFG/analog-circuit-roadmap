<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<title>树状供电：输入 → 储能 → 稳压 → 去耦，逐级净化</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="500" fill="url(#bgL)"/>
<rect width="800" height="500" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="500" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">树状供电：输入 → 储能 → 稳压 → 去耦，逐级净化</text>

<text x="400" y="46" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">电源不是「一根线拉到底」：每一级都在替下一级挡脏</text>
<rect x="34" y="192" width="104" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="86" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">输入 12V</text>
<text x="86" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">适配器 / 电池</text>
<rect x="196" y="184" width="128" height="72" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="260" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">板级储能</text>
<text x="260" y="228" text-anchor="middle" font-size="10" fill="#b45309">10~100µF 大电解</text>
<text x="260" y="244" text-anchor="middle" font-size="9.5" fill="#64748b">扛大电流脉冲</text>
<line x1="138" y1="220" x2="196" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="324" y1="220" x2="360" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="360" y1="118" x2="360" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<g filter="url(#pglow)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M138,220 H196"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M138,220 H196"/></circle></g>
<g filter="url(#pglow)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M324,220 H360"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M324,220 H360"/></circle></g>
<g filter="url(#pglow)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="2.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="8.50s" repeatCount="indefinite" path="M360,118 V322"/></circle></g>

<line x1="360" y1="118" x2="430" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="92" width="104" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="482" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2563eb">LDO 3.3V</text>
<text x="482" y="132" text-anchor="middle" font-size="9.5" fill="#64748b">低噪，喂模拟</text>
<line x1="534" y1="118" x2="650" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="92" width="118" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="709" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">传感器（模拟）</text>
<text x="709" y="134" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,118 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,118 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,118 H650"/></circle></g>

<line x1="360" y1="220" x2="430" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="194" width="104" height="52" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="482" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">DCDC 5V</text>
<text x="482" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">高效，喂数字</text>
<line x1="534" y1="220" x2="650" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="194" width="118" height="52" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="709" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">MCU（数字）</text>
<text x="709" y="236" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,220 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,220 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,220 H650"/></circle></g>

<line x1="360" y1="322" x2="430" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="296" width="104" height="52" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
<text x="482" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">LDO 1.8V</text>
<text x="482" y="336" text-anchor="middle" font-size="9.5" fill="#64748b">核心电压</text>
<line x1="534" y1="322" x2="650" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="296" width="118" height="52" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
<text x="709" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">FPGA 核</text>
<text x="709" y="338" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,322 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,322 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,322 H650"/></circle></g>

<text x="400" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">逐级净化：大电解挡低频脉动 → 稳压器压掉纹波 → 100nF 兜住芯片开关瞬间的高频</text>
<text x="400" y="406" text-anchor="middle" font-size="10.5" fill="#64748b">压差小/电流小/噪声敏感 → LDO；压差大/电流大 → DCDC（效率优先）+ 后级 LDO 净化</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.82;0.88;1" dur="12s" repeatCount="indefinite"/><rect x="102.1" y="440.3" width="595.8" height="21.6" rx="10.8" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.88;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb" opacity="0">口诀：输入 → 储能 → 稳压 → 去耦，一级替一级挡脏；去耦电容就近放，走线电感挡不住高频<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.88;1" dur="12s" repeatCount="indefinite"/></text></g></svg>
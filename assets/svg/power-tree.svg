<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<title>树状供电：输入 → 储能 → 稳压 → 去耦，逐级净化</title>
<rect width="800" height="500" fill="#f8fafc"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
@media (prefers-color-scheme: dark){
rect[fill="#f8fafc"]{fill:#0f172a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#64748b}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
}
</style>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">树状供电：输入 → 储能 → 稳压 → 去耦，逐级净化</text>

<text x="400" y="46" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">电源不是「一根线拉到底」：每一级都在替下一级挡脏</text>
<rect x="34" y="192" width="104" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="86" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">输入 12V</text>
<text x="86" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">适配器 / 电池</text>
<rect x="196" y="184" width="128" height="72" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="260" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">板级储能</text>
<text x="260" y="228" text-anchor="middle" font-size="10" fill="#b45309">10~100µF 大电解</text>
<text x="260" y="244" text-anchor="middle" font-size="9.5" fill="#64748b">扛大电流脉冲</text>
<line x1="138" y1="220" x2="196" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="324" y1="220" x2="360" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<line x1="360" y1="118" x2="360" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M138,220 H196"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M138,220 H196"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M324,220 H360"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M324,220 H360"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="2.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="8.50s" repeatCount="indefinite" path="M360,118 V322"/></circle>

<line x1="360" y1="118" x2="430" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="92" width="104" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="482" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2563eb">LDO 3.3V</text>
<text x="482" y="132" text-anchor="middle" font-size="9.5" fill="#64748b">低噪，喂模拟</text>
<line x1="534" y1="118" x2="650" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="92" width="118" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="709" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">传感器（模拟）</text>
<text x="709" y="134" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,118 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,118 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,118 H650"/></circle>

<line x1="360" y1="220" x2="430" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="194" width="104" height="52" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="482" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">DCDC 5V</text>
<text x="482" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">高效，喂数字</text>
<line x1="534" y1="220" x2="650" y2="220" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="194" width="118" height="52" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
<text x="709" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">MCU（数字）</text>
<text x="709" y="236" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,220 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,220 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,220 H650"/></circle>

<line x1="360" y1="322" x2="430" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="430" y="296" width="104" height="52" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
<text x="482" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">LDO 1.8V</text>
<text x="482" y="336" text-anchor="middle" font-size="9.5" fill="#64748b">核心电压</text>
<line x1="534" y1="322" x2="650" y2="322" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="650" y="296" width="118" height="52" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
<text x="709" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">FPGA 核</text>
<text x="709" y="338" text-anchor="middle" font-size="9.5" fill="#64748b">+100nF 就近去耦</text>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M534,322 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M534,322 H650"/></circle>
<circle r="4.5" fill="#38bdf8"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M534,322 H650"/></circle>

<text x="400" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">逐级净化：大电解挡低频脉动 → 稳压器压掉纹波 → 100nF 兜住芯片开关瞬间的高频</text>
<text x="400" y="406" text-anchor="middle" font-size="10.5" fill="#64748b">压差小/电流小/噪声敏感 → LDO；压差大/电流大 → DCDC（效率优先）+ 后级 LDO 净化</text>
<text x="400" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb" opacity="0">口诀：输入 → 储能 → 稳压 → 去耦，一级替一级挡脏；去耦电容就近放，走线电感挡不住高频<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.88;1" dur="12s" repeatCount="indefinite"/></text></svg>
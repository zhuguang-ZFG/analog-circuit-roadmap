<svg xmlns="http://www.w3.org/2000/svg" width="800" height="672" viewBox="0 0 800 672" role="img" aria-labelledby="ttl">
<title id="ttl">齐纳 vs 带隙：两种基准，两套温漂账</title>
<desc>齐纳 vs 带隙：两种基准，两套温漂账；节拍：① 齐纳：靠击穿电压，简单粗暴便宜——但 5.6V 之外温漂就上去了；② 带隙：用一正一负两条温漂曲线相加，让它们互相抵消；③ 配比 K 不是魔数：它等于 2mV/℃ ÷ (0.085mV/℃ × ln8) ≈ 11.3；④ 选型口诀：粗基准看齐纳、精密基准看带隙——温漂差两个数量级</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="672" fill="url(#bgL)"/>
<rect width="800" height="672" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="672" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">齐纳 vs 带隙：两种基准，两套温漂账</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">同一个问题（要一个不动的电压），两条技术路线</text>
<rect x="34" y="76" width="350" height="240" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.8"/>
<text x="209" y="104" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b45309">齐纳基准（Zener）</text>
<line x1="60" y1="150" x2="100" y2="150" stroke="#334155" stroke-width="2.5"/>
<line x1="100" y1="126" x2="100" y2="174" stroke="#334155" stroke-width="2.5"/>
<path d="M88,132 L100,122 L112,132 Z" fill="#334155"/>
<path d="M88,168 L100,178 L112,168 Z" fill="#334155"/>
<line x1="100" y1="150" x2="140" y2="150" stroke="#334155" stroke-width="2.5"/>
<rect x="140" y="138" width="46" height="24" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="163" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">R_s</text>
<line x1="186" y1="150" x2="230" y2="150" stroke="#334155" stroke-width="2.5"/>
<line x1="230" y1="150" x2="230" y2="186" stroke="#334155" stroke-width="2.5"/>
<path d="M216,186 L244,186 L230,208 Z" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="216" y1="208" x2="244" y2="208" stroke="#334155" stroke-width="3.5"/>
<line x1="230" y1="208" x2="230" y2="238" stroke="#334155" stroke-width="2.5"/>
<line x1="230" y1="238" x2="230" y2="252" stroke="#334155" stroke-width="2.5"/><line x1="214" y1="252" x2="246" y2="252" stroke="#334155" stroke-width="3"/><line x1="220" y1="258" x2="240" y2="258" stroke="#334155" stroke-width="3"/><line x1="226" y1="264" x2="234" y2="264" stroke="#334155" stroke-width="3"/>
<line x1="230" y1="150" x2="300" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="300" cy="150" r="4.5" fill="#334155"/>
<text x="306" y="146" font-size="11.5" font-weight="bold" fill="#059669">V_REF</text>
<text x="60" y="290" font-size="11.5" font-weight="bold" fill="#b45309">5.6V 附近温漂最小</text>
<text x="230" y="290" font-size="11.5" font-weight="bold" fill="#dc2626">但噪声大、精度差</text>
<text x="60" y="310" font-size="11" fill="#475569">（齐纳击穿负温漂 ≈ 雪崩正温漂，互相抵消）</text>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M62,150 L98,150"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.9s" repeatCount="indefinite" path="M188,150 L298,150"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-1.5s" repeatCount="indefinite" path="M230,210 L230,250"/></circle>
<rect x="416" y="76" width="350" height="240" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
<text x="591" y="104" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2563eb">带隙基准（Bandgap）</text>
<text x="440" y="140" font-size="12" font-weight="bold" fill="#dc2626">V_BE</text>
<text x="440" y="160" font-size="10.5" fill="#475569">随温度下降</text>
<text x="440" y="180" font-size="11.5" font-weight="bold" fill="#dc2626">−2mV/℃</text>
<text x="560" y="140" font-size="12" font-weight="bold" fill="#059669">+ K·ΔV_BE</text>
<text x="560" y="160" font-size="10.5" fill="#475569">随温度上升</text>
<text x="560" y="180" font-size="11.5" font-weight="bold" fill="#059669">+0.177mV/℃×K</text>
<line x1="440" y1="196" x2="740" y2="196" stroke="#cbd5e1" stroke-width="1"/>
<text x="440" y="220" font-size="12" font-weight="bold" fill="#7c3aed">合成：K=2/0.177≈11.3</text>
<text x="440" y="242" font-size="11.5" fill="#475569">V_REF = V_BE + K·V_T·ln8 ≈ 1.26V</text>
<text x="440" y="264" font-size="11.5" font-weight="bold" fill="#2563eb">≈ 硅的带隙电压 → 名字由来</text>
<text x="440" y="292" font-size="11.5" font-weight="bold" fill="#b45309">配比全部来自「两只管子 + 两个比值」</text>
<text x="440" y="310" font-size="11" fill="#475569">版图面积比 8 好做好准，电阻比可激光修调</text>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M592,196 L700,196"/></circle>
<circle cx="591" cy="196" r="5" fill="none" stroke="#2563eb" stroke-width="2.4">
<animate attributeName="r" values="5;12;5" dur="1.8s" repeatCount="indefinite"/></circle>
<line x1="400" y1="336" x2="400" y2="484" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,5"/>
<text x="30" y="360" font-size="12" font-weight="bold" fill="#334155">温漂：同一条温度轴上比</text>
<line x1="60" y1="470" x2="740" y2="470" stroke="#64748b" stroke-width="1.4"/>
<line x1="60" y1="380" x2="60" y2="470" stroke="#64748b" stroke-width="1.4"/>
<text x="52" y="490" text-anchor="end" font-size="10.5" fill="#475569">−40℃</text>
<text x="734" y="490" text-anchor="end" font-size="10.5" fill="#475569">+125℃</text>
<path d="M70,414 Q210,392 300,416 Q340,428 360,442" fill="none" stroke="#b45309" stroke-width="3"/>
<text x="150" y="404" font-size="11" font-weight="bold" fill="#b45309">齐纳：抛物线，5.6V 处才触底</text>
<path d="M70,430 L360,430" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="150" y="450" font-size="11" font-weight="bold" fill="#2563eb">带隙：修调后能压到 3ppm/℃</text>
<text x="60" y="508" font-size="12" font-weight="bold" fill="#334155">怎么选</text>
<text x="90" y="534" font-size="11.5" fill="#475569">粗基准、成本敏感、要高压 → 齐纳（5.6V 附近选型）</text>
<text x="90" y="556" font-size="11.5" fill="#475569">精密基准、ADC 参考 → 带隙（现代基准芯片清一色）</text>
<rect x="34" y="74" width="352" height="244" rx="10" fill="none" stroke="#b45309" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="156.3" y="579.0" width="487.3" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">① 齐纳：靠击穿电压，简单粗暴便宜——但 5.6V 之外温漂就上去了<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="193.3" y="579.0" width="413.4" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 带隙：用一正一负两条温漂曲线相加，让它们互相抵消<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="151.0" y="579.0" width="498.1" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 配比 K 不是魔数：它等于 2mV/℃ ÷ (0.085mV/℃ × ln8) ≈ 11.3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="155.4" y="579.0" width="489.1" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">④ 选型口诀：粗基准看齐纳、精密基准看带隙——温漂差两个数量级<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="11s" repeatCount="indefinite"/>
<rect x="30" y="620" width="740" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="627" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="642.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">带隙能赢不是因为「更复杂」，而是因为它把温漂做成了「两个比值之比」——IC 里比值天生好匹配</text>
</g></svg>
<path d="M430,330 L434,326 L438,321 L442,317 L446,313 L450,309 L454,306 L458,302 L462,299 L466,296 L470,292 L474,289 L478,287 L482,284 L486,281 L490,278 L494,276 L498,273 L502,271 L506,269 L510,267 L514,265 L518,263 L522,261 L526,259 L530,257 L534,255 L538,254 L542,252 L546,250 L550,249 L554,248 L558,246 L562,245 L566,244 L570,242 L574,241 L578,240 L582,239 L586,238 L590,237 L594,236 L598,235 L602,234 L606,233 L610,232 L614,231 L618,231 L622,230 L626,229 L630,228 L634,228 L638,227 L642,226 L646,226 L650,225 L654,225 L658,224 L662,224 L666,223 L670,223 L674,222 L678,222 L682,221 L686,221 L690,220 L694,220 L698,220 L702,219 L706,219 L710,219 L714,218 L718,218 L722,218 L726,217 L730,217 L734,217 L738,217 L742,216 L746,216 L750,216" fill="none" stroke="#2563eb" stroke-width="2.8"/>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
<title>戴维南与诺顿：任何线性网络，都能压成两个元件</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="640" fill="url(#bgL)"/>
<rect width="800" height="640" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="640" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">戴维南与诺顿：任何线性网络，都能压成两个元件</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">看着复杂，其实只需知道「开路电压」与「内阻」</text>
<text x="140" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2563eb">原网络</text>
<line x1="60" y1="120" x2="220" y2="120" stroke="#334155" stroke-width="2.5"/>
<circle cx="140" cy="120" r="4.5" fill="#334155"/>
<text x="126" y="112" font-size="11" font-weight="bold" fill="#b45309">12V</text>
<line x1="140" y1="120" x2="140" y2="146" stroke="#334155" stroke-width="2.5"/>
<line x1="140" y1="126" x2="140" y2="146" stroke="#334155" stroke-width="2.5"/>
<rect x="129" y="146" width="22" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="140" y1="186" x2="140" y2="206" stroke="#334155" stroke-width="2.5"/>
<text x="160" y="170.0" font-size="12.5" font-weight="bold" fill="#b45309">R1 10k</text>
<circle cx="140" cy="206" r="4.5" fill="#334155"/>
<line x1="140" y1="206" x2="140" y2="230" stroke="#334155" stroke-width="2.5"/>
<line x1="140" y1="210" x2="140" y2="230" stroke="#334155" stroke-width="2.5"/>
<rect x="129" y="230" width="22" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="140" y1="270" x2="140" y2="290" stroke="#334155" stroke-width="2.5"/>
<text x="160" y="254.0" font-size="12.5" font-weight="bold" fill="#b45309">R2 10k</text>
<line x1="140" y1="290" x2="140" y2="310" stroke="#334155" stroke-width="2.5"/>
<line x1="140" y1="310" x2="140" y2="324" stroke="#334155" stroke-width="2.5"/><line x1="124" y1="324" x2="156" y2="324" stroke="#334155" stroke-width="3"/><line x1="130" y1="330" x2="150" y2="330" stroke="#334155" stroke-width="3"/><line x1="136" y1="336" x2="144" y2="336" stroke="#334155" stroke-width="3"/>
<line x1="140" y1="206" x2="240" y2="206" stroke="#334155" stroke-width="2.5"/>
<circle cx="240" cy="206" r="4.5" fill="#334155"/>
<circle cx="240" cy="290" r="4.5" fill="#334155"/>
<line x1="240" y1="206" x2="240" y2="290" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="252" y="200" font-size="10.5" fill="#475569">输出端</text>
<text x="252" y="322" font-size="10.5" fill="#475569">输出端（看进去）</text>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M60,120 L200,120 L140,122 L140,144"/></circle>
<circle r="4.5" fill="#059669"><animateMotion dur="11s" begin="-0.9s" repeatCount="indefinite" path="M450,110 L450,240"/></circle>
<circle r="4.5" fill="#7c3aed"><animateMotion dur="3.6s" repeatCount="indefinite" path="M580,180 m-17,0 a17,17 0 1,0 34,0 a17,17 0 1,0 -34,0"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="11s" begin="-2.2s" repeatCount="indefinite" path="M142,208 L236,208 L236,286"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="11s" begin="-1.1s" repeatCount="indefinite" path="M142,208 L142,228"/></circle>
<text x="400" y="200" text-anchor="middle" font-size="26" font-weight="bold" fill="#94a3b8">⇒</text>
<text x="400" y="228" text-anchor="middle" font-size="11" fill="#64748b">只看这两个数</text>
<line x1="286" y1="140" x2="286" y2="256" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,5"/>
<text x="480" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">戴维南 = 电压源 + 串电阻</text>
<line x1="430" y1="150" x2="470" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="450" cy="150" r="4.5" fill="#334155"/>
<line x1="450" y1="120" x2="450" y2="150" stroke="#334155" stroke-width="2.5"/>
<line x1="436" y1="120" x2="464" y2="120" stroke="#059669" stroke-width="3.2"/>
<line x1="436" y1="132" x2="464" y2="132" stroke="#059669" stroke-width="3.2"/>
<line x1="450" y1="132" x2="450" y2="108" stroke="#334155" stroke-width="2.5"/>
<line x1="450" y1="150" x2="450" y2="176" stroke="#334155" stroke-width="2.5"/>
<rect x="432" y="176" width="36" height="26" rx="4" fill="#f8fafc" stroke="#2563eb" stroke-width="2.2"/>
<text x="450" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2563eb">5k</text>
<line x1="450" y1="202" x2="450" y2="240" stroke="#334155" stroke-width="2.5"/>
<text x="470" y="122" font-size="12" font-weight="bold" fill="#059669">V_th = 6V<animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/></text>
<text x="470" y="192" font-size="12" font-weight="bold" fill="#2563eb">R_th = 5kΩ<animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/></text>
<text x="680" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">诺顿 = 电流源 + 并电阻</text>
<line x1="620" y1="120" x2="620" y2="240" stroke="#334155" stroke-width="2.5"/>
<circle cx="620" cy="120" r="4.5" fill="#334155"/>
<circle cx="620" cy="240" r="4.5" fill="#334155"/>
<circle cx="580" cy="180" r="15" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
<line x1="580" y1="172" x2="580" y2="192" stroke="#7c3aed" stroke-width="2.4"/>
<path d="M584,176 L584,184 M578,180 L580,180 M592,180 L620,180" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
<line x1="580" y1="180" x2="574" y2="180" stroke="#7c3aed" stroke-width="2.2"/>
<line x1="620" y1="180" x2="620" y2="240" stroke="#334155" stroke-width="2.5"/>
<text x="640" y="150" font-size="12" font-weight="bold" fill="#7c3aed">I_N = 1.2mA<animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/></text>
<text x="640" y="222" font-size="12" font-weight="bold" fill="#2563eb">R_N = 5kΩ</text>
<text x="400" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">两个等效互换：R_th = R_N = V_th / I_N</text>
<text x="400" y="302" text-anchor="middle" font-size="11.5" fill="#475569">6V ÷ 1.2mA = 5kΩ（I_N 就是输出短路电流）</text>
<line x1="40" y1="330" x2="760" y2="330" stroke="#cbd5e1" stroke-width="1"/>
<text x="400" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">怎么求：两条判据，一步到位</text>
<text x="60" y="384" font-size="11.5" fill="#475569">① <tspan font-weight="bold" fill="#059669">开路电压 V_th</tspan>：把负载拿掉，量输出端电压 → 这里 12V × 10k/(10k+10k) = <tspan font-weight="bold">6V</tspan></text>
<text x="60" y="408" font-size="11.5" fill="#475569">② <tspan font-weight="bold" fill="#7c3aed">短路电流 I_N</tspan>：输出端短路，算流过电流 → 12V / 10k = <tspan font-weight="bold">1.2mA</tspan>（R2 被短路）</text>
<text x="60" y="432" font-size="11.5" fill="#475569">③ <tspan font-weight="bold" fill="#2563eb">R_th = V_th / I_N</tspan>：把独立源「置零」再求等效电阻也行（电压源短路 → R1∥R2 = 5kΩ）</text>
<rect x="60" y="452" width="340" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="76" y="476" font-size="12" font-weight="bold" fill="#2563eb">等效之后，带载误差一眼看出</text>
<text x="76" y="500" font-size="11" fill="#475569">V_out = V_th × R_L/(R_th+R_L)</text>
<text x="76" y="520" font-size="11" fill="#475569">R_L = R_th 时 → 只剩一半（3V）</text>
<text x="76" y="540" font-size="11" fill="#475569">R_L = 1MΩ 时 → 5.97V（只差 0.5%）</text>
<rect x="420" y="452" width="340" height="96" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="436" y="476" font-size="12" font-weight="bold" fill="#b45309">为什么它是「万能钥匙」</text>
<text x="436" y="500" font-size="11" fill="#475569">不管原网络有 5 个还是 50 个元件，从任意两个</text>
<text x="436" y="520" font-size="11" fill="#475569">端子看进去都只剩「一个源 + 一个电阻」——</text>
<text x="436" y="540" font-size="11.5" font-weight="bold" fill="#dc2626">所以「带不动」永远只需比 R_th 与 R_L</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="185.7" y="599.0" width="428.5" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 开路电压、短路电流，两个数就定下整个网络的对外性格<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="170.6" y="599.0" width="458.8" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 戴维南与诺顿是对偶：一个电压源串电阻，一个电流源并电阻<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="167.5" y="599.0" width="465.0" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 换算只需一个式子：R_th = V_th / I_N = 6V / 1.2mA = 5kΩ<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="93.0" y="599.0" width="614.0" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="612" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 用途：判断「带不带得动」只需比 R_th 与 R_L —— 回溯 0.3 分压器与 0.6 恒压源<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
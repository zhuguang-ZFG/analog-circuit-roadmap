<text x="491" y="278" text-anchor="middle" font-size="10" fill="#475569">V_DS：20→0.15V · V_GS：≈2.9V</text>
<rect x="596" y="70" width="174" height="214" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="1.8"/>

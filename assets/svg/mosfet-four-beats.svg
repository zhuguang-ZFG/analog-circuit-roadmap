<text x="683" y="278" text-anchor="middle" font-size="10" fill="#475569">V_DS：0.15V · V_GS：2.9→5V</text>
<text x="425" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">同一次开通：四条波形共用一条时间轴</text>

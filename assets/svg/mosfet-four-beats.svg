<text x="353" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">② 上升</text>
<text x="549" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c3aed">③ 平台</text>
<text x="693" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">④ 增强</text>
<text x="28" y="360" font-size="11" font-weight="bold" fill="#2563eb">V_GS</text>

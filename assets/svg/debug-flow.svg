<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
<title>排故五步法：把「玄学」拆成实验</title>
<rect width="800" height="480" fill="#f8fafc"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
@media (prefers-color-scheme: dark){
rect[fill="#f8fafc"]{fill:#0f172a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#64748b}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
}
</style>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">排故五步法：把「玄学」拆成实验</text>

<rect x="80" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="172" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">① 症状确认</text>
<text x="172" y="198" text-anchor="middle" font-size="10.5" fill="#475569">先问后拆：偶发？温度？</text>
<rect x="296" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="388" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">② 二分定位</text>
<text x="388" y="198" text-anchor="middle" font-size="10.5" fill="#475569">对半分：log₂n 次测量</text>
<rect x="512" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="604" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">③ 单变量实验</text>
<text x="604" y="198" text-anchor="middle" font-size="10.5" fill="#475569">一次只改一个变量</text>
<rect x="512" y="276" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="604" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">④ 修根因</text>
<text x="604" y="328" text-anchor="middle" font-size="10.5" fill="#475569">别「再换一颗试试」</text>
<rect x="296" y="276" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="388" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">⑤ 回归验证</text>
<text x="388" y="328" text-anchor="middle" font-size="10.5" fill="#475569">全温全程全工况＋日志</text>
<line x1="264" y1="179" x2="293" y2="179" stroke="#334155" stroke-width="2.5"/>
<polygon points="296,179 284,173 284,185" fill="#334155"/>
<line x1="480" y1="179" x2="509" y2="179" stroke="#334155" stroke-width="2.5"/>
<polygon points="512,179 500,173 500,185" fill="#334155"/>
<line x1="604" y1="212" x2="604" y2="273" stroke="#334155" stroke-width="2.5"/>
<polygon points="604,276 598,264 610,264" fill="#334155"/>
<line x1="512" y1="309" x2="483" y2="309" stroke="#334155" stroke-width="2.5"/>
<polygon points="480,309 492,303 492,315" fill="#334155"/>
<rect x="74" y="140" width="196" height="78" rx="12" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.9">
<animate attributeName="x" values="74;290;506;506;290;74" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="y" values="140;140;140;270;270;140" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/>
</rect>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="-0.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="1.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="3.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="5.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="7.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 症状确认：先问五个问题——一直坏还是偶发？温度相关？最近改过什么？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="10s" repeatCount="indefinite"/></text>
<text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 二分定位：中线一测去一半——64 个节点最多 6 次测量锁定<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="10s" repeatCount="indefinite"/></text>
<text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 单变量实验：一次只改一个变量——「再换一颗试试」是排故头号时间杀手<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="10s" repeatCount="indefinite"/></text>
<text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 修根因不修症状：保险丝烧了，先问「为什么烧」再换<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></text>
<text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">⑤ 回归验证：全温、全程、全工况跑过才算修好；写日志给团队攒资产<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></text>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="10s" repeatCount="indefinite"/>
<rect x="70" y="428" width="660" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">五步都带「防自欺」设计：先问后拆 / 对数收敛 / 单变量 / 修根因 / 回归——排故不靠灵感，靠流程。</text>
</g></svg>
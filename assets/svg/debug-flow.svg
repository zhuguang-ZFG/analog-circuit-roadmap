<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">排故五步法：把「玄学」拆成实验</text>

<rect x="80" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="172" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">① 症状确认</text>
<text x="172" y="198" text-anchor="middle" font-size="10.5" fill="#475569">先问后拆：偶发？温度？</text>
<rect x="296" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="388" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">② 二分定位</text>
<text x="388" y="198" text-anchor="middle" font-size="10.5" fill="#475569">对半分：log₂n 次测量</text>
<rect x="512" y="146" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="604" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">③ 单变量实验</text>
<text x="604" y="198" text-anchor="middle" font-size="10.5" fill="#475569">一次只改一个变量</text>
<rect x="512" y="276" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="604" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">④ 修根因</text>
<text x="604" y="328" text-anchor="middle" font-size="10.5" fill="#475569">别「再换一颗试试」</text>
<rect x="296" y="276" width="184" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="388" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">⑤ 回归验证</text>
<text x="388" y="328" text-anchor="middle" font-size="10.5" fill="#475569">全温全程全工况＋日志</text>
<line x1="264" y1="179" x2="293" y2="179" stroke="#334155" stroke-width="2.5"/>
<polygon points="296,179 284,173 284,185" fill="#334155"/>
<line x1="480" y1="179" x2="509" y2="179" stroke="#334155" stroke-width="2.5"/>
<polygon points="512,179 500,173 500,185" fill="#334155"/>
<line x1="604" y1="212" x2="604" y2="273" stroke="#334155" stroke-width="2.5"/>
<polygon points="604,276 598,264 610,264" fill="#334155"/>
<line x1="512" y1="309" x2="483" y2="309" stroke="#334155" stroke-width="2.5"/>
<polygon points="480,309 492,303 492,315" fill="#334155"/>
<rect x="74" y="140" width="196" height="78" rx="12" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.9">
<animate attributeName="x" values="74;290;506;506;290;74" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/>
<animate attributeName="y" values="140;140;140;270;270;140" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/>
</rect>
<g filter="url(#pglow)"><circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="-0.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="1.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="3.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="5.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="10s" begin="7.50s" repeatCount="indefinite" path="M120,179 H604 V309 H380"/></circle></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="10s" repeatCount="indefinite"/><rect x="125.1" y="404.9" width="549.7" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 症状确认：先问五个问题——一直坏还是偶发？温度相关？最近改过什么？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="10s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="10s" repeatCount="indefinite"/><rect x="171.5" y="404.9" width="457.0" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 二分定位：中线一测去一半——64 个节点最多 6 次测量锁定<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="10s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="10s" repeatCount="indefinite"/><rect x="125.1" y="404.9" width="549.7" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ 单变量实验：一次只改一个变量——「再换一颗试试」是排故头号时间杀手<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="10s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="10s" repeatCount="indefinite"/><rect x="193.3" y="404.9" width="413.4" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 修根因不修症状：保险丝烧了，先问「为什么烧」再换<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.80;0.82;1" dur="10s" repeatCount="indefinite"/><rect x="147.9" y="404.9" width="504.3" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">⑤ 回归验证：全温、全程、全工况跑过才算修好；写日志给团队攒资产<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="10s" repeatCount="indefinite"/></text></g>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="10s" repeatCount="indefinite"/>
<rect x="70" y="428" width="660" height="52.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="76" y="435" width="3" height="38.0" rx="1.5" fill="#059669"/><text x="400" y="450.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">五步都带「防自欺」设计：先问后拆 / 对数收敛 / </text><text x="400" y="468.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">单变量 / 修根因 / 回归——排故不靠灵感，靠流程。</text>
</g></svg>
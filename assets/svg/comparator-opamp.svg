<text x="60" y="290" font-size="11.5" font-weight="bold" fill="#2563eb">运放：有补偿</text>
<text x="60" y="308" font-size="11.5" font-weight="bold" fill="#2563eb">SR 限速</text>
<text x="60" y="334" font-size="11" fill="#475569">2V ÷ 0.5V/µs</text>
<text x="60" y="352" font-size="11" fill="#475569">= 4µs 爬坡</text>
<text x="60" y="382" font-size="11.5" font-weight="bold" fill="#059669">比较器：无补偿</text>
<text x="60" y="400" font-size="11.5" font-weight="bold" fill="#059669">1.3µs 后直接跳</text>
<line x1="430" y1="296" x2="764" y2="296" stroke="#64748b" stroke-width="1.6"/>
<line x1="430" y1="132" x2="430" y2="296" stroke="#64748b" stroke-width="1.6"/>
<text x="764" y="334" text-anchor="end" font-size="11" fill="#475569">时间 →</text>
<text x="514" y="318" text-anchor="middle" font-size="10" fill="#475569">2µs</text>
<text x="597" y="318" text-anchor="middle" font-size="10" fill="#475569">4µs</text>
<text x="764" y="318" text-anchor="middle" font-size="10" fill="#475569">8µs</text>
<text x="424" y="136" text-anchor="end" font-size="10.5" fill="#475569">5V</text>
<text x="424" y="234" text-anchor="end" font-size="10.5" fill="#475569">2V</text>
<text x="603" y="222" font-size="10.5" font-weight="bold" fill="#2563eb">4µs 才爬到 2V</text>
<text x="486" y="151" font-size="10.5" font-weight="bold" fill="#059669">1.3µs 就跳到 4.9V</text>

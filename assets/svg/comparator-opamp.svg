<text x="400" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">真正的坑不在速度，在输出级</text>
<text x="400" y="414" text-anchor="middle" font-size="11" fill="#475569">LM393 是开漏：输出只能「拉低」，上电沿要靠外部上拉电阻</text>
<rect x="60" y="436" width="300" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="74" y="460" font-size="11.5" font-weight="bold" fill="#b91c1c">开漏 + 大电容 = 慢到离谱</text>
<text x="74" y="482" font-size="11" fill="#475569">10k 上拉带 100nF：τ = 1ms</text>
<text x="74" y="502" font-size="11" fill="#475569">上升沿 ≈ 2.2τ = 2.2ms——</text>
<text x="74" y="518" font-size="11" fill="#475569">判决再快也被电容拖住</text>
<path d="M400,470 L400,510" stroke="#2563eb" stroke-width="2.5"/>
<path d="M393,503 L400,514 L407,503 Z" fill="#2563eb"/>
<text x="430" y="470" font-size="11.5" font-weight="bold" fill="#2563eb">推挽运放直接驱动电容</text>
<text x="430" y="490" font-size="11" fill="#475569">靠输出级电流「灌」进负载，</text>
<text x="430" y="510" font-size="11" fill="#475569">不受上拉电阻的 RC 拖累</text>
<text x="430" y="536" font-size="11" font-weight="bold" fill="#b45309">所以：判决用比较器，驱动用运放</text>
<text x="400" y="584" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 速度差：运放被压摆率限死（4µs 爬 2V），比较器 1.3µs 直接跳<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="584" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 但快不等于能驱动：开漏输出的上电沿是 RC，不是 MOS 管<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="584" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 用运放当比较器：翻转慢、饱和恢复拖尾、相位裕度不够还会自激<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="584" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 用比较器当放大器：开漏 + 饱和恢复慢，线性增益根本稳不住<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></text></svg>
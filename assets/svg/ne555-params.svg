<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">555 参数与三个坑：5 脚不能悬空</text>

<text x="400" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">双极版 vs CMOS 版 —— 同一功能，两套代价</text>
<rect x="60" y="76" width="330" height="150" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="225" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">双极版 NE555</text>
<text x="76" y="130" font-size="11.5" fill="#475569">电源</text>
<text x="374" y="130" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2563eb">4.5 ~ 16V</text>
<text x="76" y="156" font-size="11.5" fill="#475569">输出电流</text>
<text x="374" y="156" text-anchor="end" font-size="11.5" font-weight="bold" fill="#059669">200mA（可直接驱动继电器）</text>
<text x="76" y="182" font-size="11.5" fill="#475569">静态功耗</text>
<text x="374" y="182" text-anchor="end" font-size="11.5" font-weight="bold" fill="#dc2626">大（mA 级）</text>
<text x="76" y="208" font-size="11.5" fill="#475569">输出摆幅</text>
<text x="374" y="208" text-anchor="end" font-size="11.5" font-weight="bold" fill="#dc2626">非轨到轨（约 Vcc−1.7V）</text>
<rect x="410" y="76" width="330" height="150" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="575" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">CMOS 版 TLC555/LMC555</text>
<text x="426" y="130" font-size="11.5" fill="#475569">电源</text>
<text x="724" y="130" text-anchor="end" font-size="11.5" font-weight="bold" fill="#059669">2 ~ 15V</text>
<text x="426" y="156" font-size="11.5" fill="#475569">输出电流</text>
<text x="724" y="156" text-anchor="end" font-size="11.5" font-weight="bold" fill="#dc2626">小（驱动能力弱）</text>
<text x="426" y="182" font-size="11.5" fill="#475569">静态功耗</text>
<text x="724" y="182" text-anchor="end" font-size="11.5" font-weight="bold" fill="#059669">极低（µA 级）</text>
<text x="426" y="208" font-size="11.5" fill="#475569">输出摆幅</text>
<text x="724" y="208" text-anchor="end" font-size="11.5" font-weight="bold" fill="#059669">接近轨到轨</text>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" repeatCount="indefinite" path="M75,140 L370,140" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="11s" begin="-1.4s" repeatCount="indefinite" path="M425,140 L720,140" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="400" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">选型一句话</text>
<text x="400" y="276" text-anchor="middle" font-size="11.5" fill="#475569">要直接驱动（继电器/蜂鸣器）→ 双极版；要低功耗/电池供电 → CMOS 版</text>
<line x1="40" y1="296" x2="760" y2="296" stroke="#cbd5e1" stroke-width="1"/>
<text x="400" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">三个坑</text>
<rect x="40" y="344" width="720" height="76" rx="9" fill="#f8fafc" stroke="#dc2626" stroke-width="1.6"/><text x="58" y="370" font-size="12.5" font-weight="bold" fill="#dc2626">① 5 脚（CTRL）悬空 → 频率漂移</text><text x="58" y="392" font-size="11" fill="#475569">根因：CTRL 直接接到内部 2/3Vcc 分压点，悬空等于天线，拾取的干扰直接改变阈值</text><text x="58" y="412" font-size="11" font-weight="bold" fill="#334155">解法：标准做法：5 脚接 10nF 到地（这是所有 555 datasheet 的推荐电路）</text><rect x="40" y="428" width="720" height="76" rx="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.6"/><text x="58" y="454" font-size="12.5" font-weight="bold" fill="#7c3aed">② 输出驱动容性负载 → 振荡</text><text x="58" y="476" font-size="11" fill="#475569">根因：输出级推挽 + 电容负载 = 相位裕度被破坏（同类问题见 6.6 运放自激）</text><text x="58" y="496" font-size="11" font-weight="bold" fill="#334155">解法：串 10~100Ω 隔离电阻；或减小负载电容</text><rect x="40" y="512" width="720" height="76" rx="9" fill="#f8fafc" stroke="#b45309" stroke-width="1.6"/><text x="58" y="538" font-size="12.5" font-weight="bold" fill="#b45309">③ 双极版电源毛刺 → 误触发</text><text x="58" y="560" font-size="11" fill="#475569">根因：输出翻转瞬间 200mA 级电流冲击电源，毛刺经电源耦合回内部比较器</text><text x="58" y="580" font-size="11" font-weight="bold" fill="#334155">解法：电源就近加 100nF 陶瓷 + 10µF 电解；5 脚那个 10nF 也顺带滤波</text>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M52,380 L748,380" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-1.8s" repeatCount="indefinite" path="M52,464 L748,464" keyPoints="0;1" keyTimes="0;1"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-3.0s" repeatCount="indefinite" path="M52,548 L748,548" keyPoints="0;1" keyTimes="0;1"/></circle>
<rect x="38" y="426" width="724" height="76" rx="10" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="38" y="510" width="724" height="76" rx="10" fill="none" stroke="#b45309" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="38" y="342" width="724" height="80" rx="10" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="180.4" y="591.0" width="439.1" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 5 脚悬空是 555 最常见的翻车——标准做法接 10nF 到地<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="151.4" y="591.0" width="497.2" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 输出带容性负载会振荡：串 10~100Ω —— 与运放自激同一套机理<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="167.7" y="591.0" width="464.6" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 双极版 200mA 翻转会打电源：就近 100nF + 10µF 是必需品<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="128.6" y="591.0" width="542.8" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="604" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">④ 选型：要驱动能力选双极、要低功耗选 CMOS —— 参数表第二页就有答案<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
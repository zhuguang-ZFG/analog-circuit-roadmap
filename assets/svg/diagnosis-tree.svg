<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="12s" repeatCount="indefinite"/><rect x="132.7" y="517.0" width="534.6" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 上电无反应：别急着拆——先分清是「没电」「没复位」还是「没时钟」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.20;0.22;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="12s" repeatCount="indefinite"/><rect x="112.0" y="517.0" width="576.1" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 输入电压在不在：电源线 / 保险 / 极性 / 连接器——30 秒排除最常见的 17.1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.22;0.40;0.42;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="12s" repeatCount="indefinite"/><rect x="151.3" y="517.0" width="497.5" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 关键电源轨都对吗：带载跌落、纹波、使能脚——静态对 ≠ 动态对<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.60;0.62;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="12s" repeatCount="indefinite"/><rect x="123.2" y="517.0" width="553.7" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 复位与时钟正常吗：复位 IC、晶振起振、上电时序——数字电路的「心跳」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.62;0.80;0.82;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.80;0.82;1" dur="12s" repeatCount="indefinite"/><rect x="90.7" y="517.0" width="618.5" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="530" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">⑤ 有电有复位却功能异常：按表现分流——不动 / 读数错 / 时好时坏 / 发热，各归其表<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.80;0.82;1" dur="12s" repeatCount="indefinite"/></text></g>

<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">排故决策树：从「上电无反应」到具体表项</text>

<text x="400" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">先定方向、再查细节——每一「否」都直接落到一张速查表，别在细节里迷路</text>
<rect x="40" y="71" width="270" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="175" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">① 上电无反应？</text>
<rect x="40" y="139" width="270" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="175" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">② 输入电压在不在？</text>
<rect x="40" y="207" width="270" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="175" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">③ 关键电源轨都对吗？</text>
<rect x="40" y="275" width="270" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="175" y="301" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">④ 复位 / 时钟正常吗？</text>
<rect x="40" y="343" width="270" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><text x="175" y="369" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">⑤ 有电有复位 → 看表现</text>
<line x1="175" y1="113" x2="175" y2="136" stroke="#334155" stroke-width="2.2"/><polygon points="175,139 170,132 180,132" fill="#334155"/><text x="189" y="130" font-size="11" font-weight="bold" fill="#059669">是</text>
<line x1="175" y1="181" x2="175" y2="204" stroke="#334155" stroke-width="2.2"/><polygon points="175,207 170,200 180,200" fill="#334155"/><text x="189" y="198" font-size="11" font-weight="bold" fill="#059669">是</text>
<line x1="175" y1="249" x2="175" y2="272" stroke="#334155" stroke-width="2.2"/><polygon points="175,275 170,268 180,268" fill="#334155"/><text x="189" y="266" font-size="11" font-weight="bold" fill="#059669">是</text>
<line x1="175" y1="317" x2="175" y2="340" stroke="#334155" stroke-width="2.2"/><polygon points="175,343 170,336 180,336" fill="#334155"/><text x="189" y="334" font-size="11" font-weight="bold" fill="#059669">是</text>
<line x1="310" y1="160" x2="447" y2="160" stroke="#2563eb" stroke-width="2.2"/><polygon points="450,160 442,155 442,165" fill="#2563eb"/><text x="326" y="151" font-size="11" font-weight="bold" fill="#dc2626">否</text>
<rect x="450" y="139" width="280" height="42" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/><text x="590" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">→ 17.1 电源类：保险 / 极性 / 连接</text>
<line x1="310" y1="228" x2="447" y2="228" stroke="#dc2626" stroke-width="2.2"/><polygon points="450,228 442,223 442,233" fill="#dc2626"/><text x="326" y="219" font-size="11" font-weight="bold" fill="#dc2626">否</text>
<rect x="450" y="207" width="280" height="42" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="590" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">→ 17.1：带载跌落 / 纹波 / 使能</text>
<line x1="310" y1="296" x2="447" y2="296" stroke="#b45309" stroke-width="2.2"/><polygon points="450,296 442,291 442,301" fill="#b45309"/><text x="326" y="287" font-size="11" font-weight="bold" fill="#dc2626">否</text>
<rect x="450" y="275" width="280" height="42" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><text x="590" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">→ 17.3：复位 IC / 晶振 / 时序</text>
<line x1="175" y1="385" x2="175" y2="410" stroke="#334155" stroke-width="2.2"/><line x1="117" y1="410" x2="672" y2="410" stroke="#334155" stroke-width="2.2"/><line x1="117" y1="410" x2="117" y2="435" stroke="#7c3aed" stroke-width="2.2"/><polygon points="117,438 112,431 122,431" fill="#7c3aed"/><rect x="30" y="438" width="175" height="56" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/><text x="117" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">完全不动</text><text x="117" y="483" text-anchor="middle" font-size="9.5" fill="#475569">17.3 接口 / 固件 / 挂死</text>
<line x1="302" y1="410" x2="302" y2="435" stroke="#059669" stroke-width="2.2"/><polygon points="302,438 297,431 307,431" fill="#059669"/><rect x="215" y="438" width="175" height="56" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2.5"/><text x="302" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#059669">读数不对</text><text x="302" y="483" text-anchor="middle" font-size="9.5" fill="#475569">17.2 反馈 / 校准 / 噪声</text>
<line x1="487" y1="410" x2="487" y2="435" stroke="#dc2626" stroke-width="2.2"/><polygon points="487,438 482,431 492,431" fill="#dc2626"/><rect x="400" y="438" width="175" height="56" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/><text x="487" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">时好时坏</text><text x="487" y="483" text-anchor="middle" font-size="9.5" fill="#475569">17.6 焊接连接 → 再查 17.4</text>
<line x1="672" y1="410" x2="672" y2="435" stroke="#b45309" stroke-width="2.2"/><polygon points="672,438 667,431 677,431" fill="#b45309"/><rect x="585" y="438" width="175" height="56" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="2.5"/><text x="672" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">发热异常</text><text x="672" y="483" text-anchor="middle" font-size="9.5" fill="#475569">17.5 功耗 / 短路 / 散热</text>

<text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 输入创「新高」：运放顶开二极管，C_hold 瞬间充到峰顶——只许上<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.26;1" dur="7s" repeatCount="indefinite"/></text><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 输入回落：二极管反偏关断，电容孤立守住峰值——不许下<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.55;0.61;1" dur="7s" repeatCount="indefinite"/></text><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 泄放电阻决定遗忘速度：τ=R·C——表头要稳（τ≈1s），AGC 要快（τ≈10ms）<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.61;0.67;1" dur="7s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="7s" repeatCount="indefinite"/>
<rect x="40" y="450" width="720" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="472" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">峰值表、振幅测量、音频 AGC、包络检波——全是「单向记忆」；二极管压降？运放已按 12.6 精密整流把它除掉了</text>

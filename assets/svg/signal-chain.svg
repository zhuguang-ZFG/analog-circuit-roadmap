<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="ttl">
<title id="ttl">信号链设计实例：PT100 温度采集全链复盘</title>
<desc>信号链设计实例：PT100 温度采集全链复盘；节拍：① 反推增益：满量程 2.048V 留 25% 余量 → 目标 1.54V；1.54V ÷ 38.5mV = ×40；② 选前端：仪表放大器先扛共模、给高阻；低通 fc=10Hz 再把工频按到 −28dB；③ 逐级验算：每加一级都要回头看「信号还在不在 噪声有没有追上来」；④ 收尾：12 位 LSB 折算回输入 = 0.032℃/码，远细于 0.1℃ 的目标分辨率</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="600" fill="url(#bgL)"/>
<rect width="800" height="600" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="600" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">信号链设计实例：PT100 温度采集全链复盘</text>

<circle cx="100" cy="82" r="16" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4,4">
<animateTransform attributeName="transform" type="rotate" values="0 100 82;360 100 82" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="100" cy="82" r="5.5" fill="#2563eb"/>
<text x="100" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2563eb">PT100</text>
<text x="100" y="130" text-anchor="middle" font-size="10.5" fill="#475569">1mA 激励 → 385µV/℃</text>
<line x1="130" y1="82" x2="186" y2="82" stroke="#334155" stroke-width="2.5"/>
<circle r="5" fill="#059669">
<animateMotion dur="9s" repeatCount="indefinite" path="M110,82 H186" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="158" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">385µV</text>
<rect x="190" y="52" width="150" height="80" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="265" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">仪表放大器</text>
<text x="265" y="100" text-anchor="middle" font-size="10.5" fill="#475569">INA333 · G=40</text>
<text x="265" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">共模 100mV → 差模 1µV</text>
<line x1="340" y1="82" x2="446" y2="82" stroke="#334155" stroke-width="2.5"/>
<circle r="5" fill="#059669">
<animateMotion dur="9s" repeatCount="indefinite" path="M346,82 H446" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="392" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">15.4mV/℃</text>
<rect x="450" y="52" width="130" height="80" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="515" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Sallen-Key 低通</text>
<text x="515" y="100" text-anchor="middle" font-size="10.5" fill="#475569">fc=10Hz · Q=0.707</text>
<text x="515" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">50Hz 工频 −28dB</text>
<line x1="580" y1="82" x2="686" y2="82" stroke="#334155" stroke-width="2.5"/>
<circle r="5" fill="#059669">
<animateMotion dur="9s" repeatCount="indefinite" path="M586,82 H686" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="632" y="46" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#059669">1.54V</text>
<rect x="690" y="52" width="86" height="80" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="2.5"/>
<text x="733" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c3aed">ADC</text>
<text x="733" y="102" text-anchor="middle" font-size="10.5" fill="#475569">12 位</text>
<text x="733" y="120" text-anchor="middle" font-size="10.5" fill="#475569">LSB 500µV</text>

<line x1="30" y1="190" x2="30" y2="418" stroke="#94a3b8" stroke-width="1.4"/>
<line x1="30" y1="418" x2="790" y2="418" stroke="#64748b" stroke-width="1.6"/>
<line x1="30" y1="196" x2="37" y2="196" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="30" y1="307" x2="37" y2="307" stroke="#94a3b8" stroke-width="1.2"/>
<text x="42" y="430" font-size="11" fill="#475569">0</text>
<text x="42" y="311" font-size="11" fill="#475569">1.024V</text>
<text x="42" y="200" font-size="11" fill="#475569">2.048V</text>
<text x="96" y="190" font-size="11" font-weight="bold" fill="#475569">ADC 满量程 2.048V（12 位 = 4096 码）</text>
<line x1="340" y1="196" x2="340" y2="418" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="580" y1="196" x2="580" y2="418" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="90" y1="364" x2="760" y2="364" stroke="#0ea5e9" stroke-width="3.5"/>
<circle r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="2">
<animateMotion dur="9s" repeatCount="indefinite" path="M90,364 H760" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="96" y="352" font-size="11.5" font-weight="bold" fill="#0ea5e9">放大后 1.54V（100℃ 满量）＝ 75% 满量程</text>
<line x1="90" y1="417" x2="340" y2="417" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="96" y="404" font-size="11.5" font-weight="bold" fill="#dc2626">未放大 38.5mV：真实位置离地 4px，贴地</text>
<text x="96" y="386" font-size="11" fill="#475569">不放大只剩 77 码（≈6.3 位）</text>
<text x="760" y="344" text-anchor="end" font-size="11.5" font-weight="bold" fill="#7c3aed">12.5µV/码 ≈ 0.032℃</text>
<text x="90" y="436" font-size="10.5" font-weight="bold" fill="#475569">PT100 385µV/℃</text>
<text x="340" y="436" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#475569">INA333 ×40</text>
<text x="580" y="436" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#475569">低通 fc=10Hz</text>
<text x="760" y="436" text-anchor="end" font-size="10.5" font-weight="bold" fill="#475569">ADC</text>
<circle r="5" fill="#f59e0b"><animateMotion dur="9s" begin="-0.7s" repeatCount="indefinite" path="M348,82 L444,82"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="9s" begin="-1.5s" repeatCount="indefinite" path="M92,417 L336,417"/></circle>
<circle r="5" fill="#7c3aed"><animateMotion dur="9s" begin="-2.3s" repeatCount="indefinite" path="M588,82 L684,82"/></circle>
<rect x="688" y="50" width="90" height="84" rx="8" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/></rect>
<rect x="446" y="500" width="340" height="60" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="462" y="524" font-size="11.5" font-weight="bold" fill="#b45309">不做前端处理会怎样？</text>
<text x="462" y="548" font-size="11" fill="#475569">不放大：77 码 ≈ 6.3 位　放大后：3080 码 ≈ 11.6 位有效</text>
<text x="452" y="578" font-size="11.5" font-weight="bold" fill="#059669">放大不只是「变大」：把信号顶到接近满量程，才叫没浪费 ADC</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="9s" repeatCount="indefinite"/><rect x="95.2" y="476.9" width="609.6" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="9s" repeatCount="indefinite"/></rect><text x="400" y="490" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 反推增益：满量程 2.048V 留 25% 余量 → 目标 1.54V；1.54V ÷ 38.5mV = ×40<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="9s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="9s" repeatCount="indefinite"/><rect x="115.0" y="476.9" width="570.0" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="9s" repeatCount="indefinite"/></rect><text x="400" y="490" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 选前端：仪表放大器先扛共模、给高阻；低通 fc=10Hz 再把工频按到 −28dB<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="9s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="9s" repeatCount="indefinite"/><rect x="145.6" y="476.9" width="508.8" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="9s" repeatCount="indefinite"/></rect><text x="400" y="490" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 逐级验算：每加一级都要回头看「信号还在不在 噪声有没有追上来」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="9s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/><rect x="130.6" y="476.9" width="538.8" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/></rect><text x="400" y="490" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 收尾：12 位 LSB 折算回输入 = 0.032℃/码，远细于 0.1℃ 的目标分辨率<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/></text></g></svg>
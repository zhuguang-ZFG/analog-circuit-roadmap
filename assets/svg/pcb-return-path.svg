<text x="640" y="200" font-size="10.5" font-weight="bold" fill="#dc2626">辐射 EMI</text>
</g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.3;0.36;1" dur="5s" repeatCount="indefinite"/><rect x="94.8" y="406.9" width="610.3" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.3;0.36;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="420" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 高频回流不走「几何最短」，走「电感最小」——永远贴着信号正下方（镜像电流）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.3;0.36;1" dur="5s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.38;0.44;0.62;0.68;1" dur="5s" repeatCount="indefinite"/><rect x="148.5" y="406.9" width="502.9" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.62;0.68;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="420" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 地平面一开槽：回流被断桥逼得绕大圈，环路面积从≈0 暴增几十倍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.62;0.68;1" dur="5s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.68;0.74;1" dur="5s" repeatCount="indefinite"/><rect x="152.6" y="406.9" width="494.9" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.74;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="420" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 环路=环形天线：向外辐射 EMI 认证翻车，向内拾取干扰=莫名串扰<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.74;1" dur="5s" repeatCount="indefinite"/></text></g><g opacity="0">

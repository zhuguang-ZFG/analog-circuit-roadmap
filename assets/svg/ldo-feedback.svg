<text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">① 分压器 R1/R2 把 VOUT 采样回误差放大器，与 1.25V 基准比<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.24;0.28;1" dur="5s" repeatCount="indefinite"/></text><text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 负载突然加重 → VOUT 一跌 → 采样低于基准 → 误差放大器喊「不够！」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.55;0.6;1" dur="5s" repeatCount="indefinite"/></text><text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 调整管立刻「调小自己的电阻」→ VOUT 拉回 5V——全自动，无需人管<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="5s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.73;1" dur="5s" repeatCount="indefinite"/>
<rect x="60" y="428" width="680" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">VOUT = 1.25×(1+R1/R2) · 发热 = (VIN−VOUT)×I 全变成热——LDO 效率低的根因</text>
</g></svg>
<text x="540" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#475569">t = 1.1·RC ≈ 1.1s</text>
<text x="462" y="372" font-size="10" fill="#64748b">触发↓（按下瞬间）</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.6;0.66;1" dur="7s" repeatCount="indefinite"/><circle r="4" fill="#059669"><animateMotion dur="7s" begin="-0.50s" repeatCount="indefinite" path="M285,88 V192"/></circle>
<circle r="4" fill="#059669"><animateMotion dur="7s" begin="1.25s" repeatCount="indefinite" path="M285,88 V192"/></circle>
<circle r="4" fill="#059669"><animateMotion dur="7s" begin="3.00s" repeatCount="indefinite" path="M285,88 V192"/></circle>
<circle r="4" fill="#059669"><animateMotion dur="7s" begin="4.75s" repeatCount="indefinite" path="M285,88 V192"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.8;0.94;1" dur="7s" repeatCount="indefinite"/><circle r="4" fill="#dc2626"><animateMotion dur="7s" begin="-0.50s" repeatCount="indefinite" path="M285,212 V244"/></circle>
<circle r="4" fill="#dc2626"><animateMotion dur="7s" begin="1.83s" repeatCount="indefinite" path="M285,212 V244"/></circle>
<circle r="4" fill="#dc2626"><animateMotion dur="7s" begin="4.17s" repeatCount="indefinite" path="M285,212 V244"/></circle></g><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#475569" opacity="0">① 稳态：OUT=低，放电管导通，C 被钉在 0V——它就这么睡着<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.28;1" dur="7s" repeatCount="indefinite"/></text><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 触发！2 脚 &lt; Vcc/3 → RS 翻转：OUT=高，放电管断开，C 开始充电<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.3;0.6;0.66;1" dur="7s" repeatCount="indefinite"/></text><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 充电全程 OUT 保持高——Vc 沿指数爬升，t = 1.1·RA·C ≈ 1.1s<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.4;0.7;0.76;1" dur="7s" repeatCount="indefinite"/></text><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ Vc ≥ 2Vcc/3：RS 复位，OUT=低，放电管瞬间把 C 放空——回稳态<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.82;1" dur="7s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="7s" repeatCount="indefinite"/>
<rect x="60" y="428" width="680" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">「单稳」= 只有一个稳态。触发多宽都行，输出脉冲宽度只认 RA·C——定时器的本质：RC 定时，芯片在两个阈值之间当裁判。（5 脚接 0.01µF 去耦，别省）</text>
</g></svg>
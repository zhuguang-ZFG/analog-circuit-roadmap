<text x="766" y="262" text-anchor="end" font-size="10" fill="#7c3aed">Vcc/3</text>
<path d="M480,340.0 L485,330.1 L490,320.7 L495,311.7 L500,303.1 L505,294.9 L510,287.1 L515,279.6 L520,272.5 L525,265.6 L530,259.1 L535,252.9 L540,246.9 L545,241.2 L550,235.8 L555,230.6 L560,225.7 L565,220.9 L570,216.4 L575,212.1 L580,208.0 L585,204.0 L590,200.3 L595,196.7 L600,193.2" fill="none" stroke="#0891b2" stroke-width="2.8"/>

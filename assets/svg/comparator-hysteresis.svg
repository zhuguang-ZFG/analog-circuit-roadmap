e"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 输出高时阈值被压到 2V：输入必须跌破 2V 才翻回<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.58;0.78;0.82;1" dur="5s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.82;0.86;1" dur="5s" repeatCount="indefinite"/><rect x="231.8" y="386.9" width="336.4" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="5s" repeatCount="indefinite"/></rect><text x="400" y="400" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">④ 噪声在 1V 窗口里随便闹——输出纹丝不动<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="5s" repeatCount="indefinite"/></text></g><g opacity="0">

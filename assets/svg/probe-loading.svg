<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
<title>探头是负载：测量的动作本身就会改电路</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="640" fill="url(#bgL)"/>
<rect width="800" height="640" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="640" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
rect[fill="#f8fafc"]{fill:#0f172a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#64748b}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">探头是负载：测量的动作本身就会改电路</text>

<text x="270" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">① 探头一碰上去，电路就变了</text>
<line x1="60" y1="150" x2="120" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="120" cy="150" r="4" fill="#334155"/>
<text x="44" y="146" font-size="11" fill="#475569">源</text>
<line x1="120" y1="150" x2="150" y2="150" stroke="#334155" stroke-width="2.5"/>
<rect x="150" y="138" width="50" height="24" rx="3" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="175" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">100k</text>
<line x1="200" y1="150" x2="250" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="250" cy="150" r="4" fill="#334155"/>
<line x1="250" y1="150" x2="250" y2="166" stroke="#334155" stroke-width="2.5"/>
<line x1="222" y1="166" x2="318" y2="166" stroke="#334155" stroke-width="2.5"/>
<line x1="222" y1="166" x2="222" y2="178" stroke="#334155" stroke-width="2.5"/>
<line x1="210" y1="178" x2="234" y2="178" stroke="#dc2626" stroke-width="3.5"/>
<line x1="210" y1="190" x2="234" y2="190" stroke="#dc2626" stroke-width="3.5"/>
<line x1="222" y1="190" x2="222" y2="244" stroke="#334155" stroke-width="2.5"/>
<line x1="318" y1="166" x2="318" y2="178" stroke="#334155" stroke-width="2.5"/>
<rect x="300" y="178" width="36" height="24" rx="3" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
<line x1="318" y1="202" x2="318" y2="244" stroke="#334155" stroke-width="2.5"/>
<line x1="222" y1="244" x2="318" y2="244" stroke="#334155" stroke-width="2.5"/>
<line x1="270" y1="244" x2="270" y2="258" stroke="#334155" stroke-width="2.5"/>
<line x1="270" y1="258" x2="270" y2="272" stroke="#334155" stroke-width="2.5"/><line x1="254" y1="272" x2="286" y2="272" stroke="#334155" stroke-width="3"/><line x1="260" y1="278" x2="280" y2="278" stroke="#334155" stroke-width="3"/><line x1="266" y1="284" x2="274" y2="284" stroke="#334155" stroke-width="3"/>
<text x="204" y="184" text-anchor="end" font-size="11" font-weight="bold" fill="#dc2626">100pF</text>
<text x="344" y="196" font-size="11" font-weight="bold" fill="#dc2626">1MΩ</text>
<text x="352" y="222" font-size="11" font-weight="bold" fill="#b45309">探头</text>
<text x="300" y="140" text-anchor="end" font-size="11" font-weight="bold" fill="#2563eb">读到 V×0.91</text>
<rect x="40" y="296" width="380" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="320" font-size="11.5" font-weight="bold" fill="#b91c1c">×1 档：误差 9%，还想测什么？</text>
<text x="54" y="342" font-size="11" fill="#475569">100kΩ 源阻 + 1MΩ 探头 = 分压到 0.909</text>
<text x="54" y="362" font-size="11" fill="#475569">而且 100k×100pF = 10µs → fc 只剩 16kHz</text>
<text x="54" y="376" font-size="11" font-weight="bold" fill="#dc2626">高频信号直接被探头削圆</text>
<text x="440" y="320" font-size="11.5" font-weight="bold" fill="#059669">×10 档：10MΩ‖10pF</text>
<text x="440" y="342" font-size="11" fill="#475569">分压系数 0.990（误差 1%）</text>
<text x="440" y="362" font-size="11" fill="#475569">时间常数 1µs → fc 提到 159kHz</text>
<text x="440" y="382" font-size="11" font-weight="bold" fill="#059669">代价：探头电容被「等效缩小」10 倍</text>
<text x="270" y="426" text-anchor="middle" font-size="11" fill="#475569">Jim Williams：先问「这个测量会不会改电路」，再按下探头</text>
<line x1="60" y1="470" x2="500" y2="470" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6,5"/>
<text x="270" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">② 另外两个「一按就出事」的动作</text>
<circle cx="90" cy="540" r="26" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="90" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">A</text>
<text x="90" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">表</text>
<text x="132" y="534" font-size="11.5" font-weight="bold" fill="#b91c1c">电流档 = 短路</text>
<text x="132" y="554" font-size="11" fill="#475569">万用表电流档内阻≈0，并到电源上就是放炮</text>
<text x="132" y="574" font-size="11" font-weight="bold" fill="#dc2626">测完立刻把表笔插回电压孔</text>
<text x="420" y="536" font-size="11.5" font-weight="bold" fill="#dc2626">探头地夹 = 市电地</text>
<text x="420" y="556" font-size="11" fill="#475569">示波器地夹与市电共地</text>
<text x="420" y="574" font-size="11" font-weight="bold" fill="#dc2626">隔离变压器 或 差分探头，二选一</text>
<text x="270" y="604" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">上电第一次：串限流灯泡 / 恒流 50mA —— 冒烟的是灯泡，不是芯片</text>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M70,150 L148,150"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.8s" repeatCount="indefinite" path="M202,150 L248,150"/></circle>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-1.3s" repeatCount="indefinite" path="M250,152 L250,166 L222,166 L222,180"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" begin="-1.8s" repeatCount="indefinite" path="M318,202 L318,244 L270,244 L270,258"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M224,166 L316,166"/></circle>
<circle r="4.5" fill="#dc2626"><animateMotion dur="11s" begin="-1.1s" repeatCount="indefinite" path="M318,168 L318,200"/></circle>
<circle r="4.5" fill="#059669"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M270,246 L270,262"/></circle>
<rect x="216" y="126" width="90" height="22" rx="6" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/></rect>
<rect x="52" y="500" width="96" height="78" rx="12" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" repeatCount="indefinite"/></rect>
<rect x="52" y="296" width="300" height="86" rx="10" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="400" y="512" width="380" height="74" rx="10" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/></rect>
<circle r="5" fill="#dc2626"><animateMotion dur="11s" begin="-0.5s" repeatCount="indefinite" path="M90,514 L90,566 L90,514"/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="129.2" y="615.0" width="541.7" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="628" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 探头不是「接上去看看」——它是 1MΩ‖100pF 的负载，会分压也会滤波<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="116.9" y="615.0" width="566.2" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="628" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 测模拟节点一律 ×10 档：误差从 9% 降到 1%，带宽从 16kHz 提到 159kHz<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="107.3" y="615.0" width="585.5" height="24.1" rx="12.0" fill="#b91c1c" fill-opacity="0.09" stroke="#b91c1c" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="628" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b91c1c" opacity="0">③ 电流档并联 = 短路；示波器地夹接市电节点 = 短路——两个都是「一按就出事」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="216.0" y="615.0" width="367.9" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="628" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 新板第一次上电先限流：让最便宜的元件先冒烟<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
<text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 栅压 0V：沟道不存在，LED 灭——漏源之间是「断开的开关」<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.44;0.5;1" dur="4s" repeatCount="indefinite"/></text><text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 栅压 3.3V > 阈值 1.45V：沟道形成，LED 亮，I_D=(5−2)÷150≈20mA<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.58;1" dur="4s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="4s" repeatCount="indefinite"/>

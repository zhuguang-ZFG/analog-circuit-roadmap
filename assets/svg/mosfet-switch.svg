<text x="400" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">栅极只取 nA 级漏电——电压控制零功耗 · MCU 驱动必须选「逻辑电平」MOS（2N7000 在 3.3V 下不可靠）</text>

<text x="546" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">MOSFET 拐角 1kHz</text>
<text x="653" y="201" font-size="10.5" fill="#475569">白噪声地板（平坦）</text>
<text x="406" y="156" font-size="10.5" fill="#475569">1/f 段：−20dB/dec</text>
<circle r="5" fill="#dc2626">

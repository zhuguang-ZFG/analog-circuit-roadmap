<text x="457" y="148" font-size="10.5" font-weight="bold" fill="#059669">BJT：1/f 拐角在百 Hz</text>
<text x="580" y="164" font-size="10.5" font-weight="bold" fill="#dc2626">MOSFET：拐角晚一个量级，嘶声更重</text>
<text x="640" y="226" font-size="10.5" fill="#475569">白噪声段（∝1/√f）</text>
<circle r="5" fill="#dc2626">
<animateMotion dur="10s" repeatCount="indefinite" path="M400,130 L764,265" keyPoints="0;1" keyTimes="0;1"/></circle>
<text x="400" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">降噪的正确顺序：先压带宽 → 再降源阻 → 最后才换贵管子</text>
<text x="400" y="496" text-anchor="middle" font-size="11" fill="#475569">后级的噪声会被前级增益「除回去」：整机噪声几乎只看第一级（Friis）</text>
<text x="400" y="518" text-anchor="middle" font-size="11" fill="#475569">方向反了 = 先买低噪声运放、不管带宽源阻 → 钱花两倍，噪声只降一半</text>
<text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 白噪声只随 √B 和 √R 增长——所以带宽是性价比最高的旋钮<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 1/f 靠「换器件」解决：低频端要安静，BJT 的拐角比 MOSFET 低一个量级<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 散粒噪声只跟电流走 √I——大电流工作点不是噪声问题，是功耗问题<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 降温也是降噪：射电望远镜用液氦泡放大器，不是玄学<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="10s" repeatCount="indefinite"/>
<rect x="25" y="576" width="750" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="598" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">1kΩ·1MHz·300K → 4.1µV；×1000 后 4.1mV —— 噪声是乘法游戏的必然结果，先算账再选管</text>
</g></svg>
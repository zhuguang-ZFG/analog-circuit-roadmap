<text x="400" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">降噪的正确顺序：先压带宽 → 再降源阻 → 最后才换贵管子</text>
<text x="400" y="496" text-anchor="middle" font-size="11" fill="#475569">后级的噪声会被前级增益「除回去」：整机噪声几乎只看第一级（Friis）</text>
<text x="400" y="518" text-anchor="middle" font-size="11" fill="#475569">方向反了 = 先买低噪声运放、不管带宽源阻 → 钱花两倍，噪声只降一半</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/><rect x="167.4" y="549.0" width="465.2" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 白噪声只随 √B 和 √R 增长——所以带宽是性价比最高的旋钮<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/><rect x="117.9" y="549.0" width="564.3" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 1/f 靠「换器件」解决：低频端要安静，BJT 的拐角比 MOSFET 低一个量级<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/><rect x="143.7" y="549.0" width="512.6" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 散粒噪声只跟电流走 √I——大电流工作点不是噪声问题，是功耗问题<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/><rect x="193.3" y="549.0" width="413.4" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="562" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 降温也是降噪：射电望远镜用液氦泡放大器，不是玄学<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="10s" repeatCount="indefinite"/>

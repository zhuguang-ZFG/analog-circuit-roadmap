<line x1="190" y1="318" x2="190" y2="332" stroke="#334155" stroke-width="2.5"/><line x1="174" y1="332" x2="206" y2="332" stroke="#334155" stroke-width="3"/><line x1="180" y1="338" x2="200" y2="338" stroke="#334155" stroke-width="3"/><line x1="186" y1="344" x2="194" y2="344" stroke="#334155" stroke-width="3"/>
<rect x="48" y="176" width="46" height="40" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

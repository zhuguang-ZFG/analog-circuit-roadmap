<text x="590" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">I-V 特性：电压横扫，电流平躺</text>
<line x1="430" y1="210" x2="750" y2="210" stroke="#059669" stroke-width="3"/>

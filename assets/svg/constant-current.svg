<text x="240" y="140" font-size="10.5" fill="#dc2626" opacity="0">V_CE 随负载怎么变
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.4;0.46;1" dur="6s" repeatCount="indefinite"/></text>
<text x="240" y="280" font-size="10.5" fill="#059669" opacity="0">I 被 R_E 钉死：纹丝不动
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/></text>
<g filter="url(#pglow)"><circle r="5" fill="#059669"><animateMotion dur="2.0s" begin="-0.50s" repeatCount="indefinite" path="M194,76 V116 M190,141 V160 V226 V297"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="2.0s" begin="-0.10s" repeatCount="indefinite" path="M194,76 V116 M190,141 V160 V226 V297"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="2.0s" begin="0.30s" repeatCount="indefinite" path="M194,76 V116 M190,141 V160 V226 V297"/></circle>
<circle r="5" fill="#059669"><animateMotion dur="2.0s" begin="0.70s" repeatCount="indefinite" path="M194,76 V116 M190,141 V160 V226 V297"/></circle>

<text x="400" y="544" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 低端：NMOS 的 V_GS 最足 → 20Ω；此时 PMOS 的 V_SG 反而最弱<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="544" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 高端：NMOS 的 V_GS→0，Ron→∞ 彻底罢工——这就是「N 管传高电平会掉一个 V_T」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="544" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 两只并联：低端 N 扛、高端 P 扛、中间一起扛 → Ron 全程 20~27Ω<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></text><text x="400" y="544" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 代价只是多一只管子和一个反相控制——所以模拟开关内部永远是「传输门」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="10s" repeatCount="indefinite"/>
<rect x="25" y="560" width="750" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="582" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">单管传的是「有盲区」的电压；传输门传的是「全程达标」的电阻——信号完整性从第一只开关就开始算</text>
</g></svg>
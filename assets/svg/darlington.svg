<circle cx="208" cy="176" r="5" fill="none" stroke="#2563eb" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="208" cy="302" r="5" fill="none" stroke="#059669" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="200" r="5" fill="none" stroke="#dc2626" stroke-width="2.2"><animate attributeName="r" values="5;13;5" dur="2.2s" begin="-0.5s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="132.3" y="579.0" width="535.3" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① β 相乘的机理：前一级的发射极电流就是后一级的基极电流——串联放大<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="136.5" y="579.0" width="527.0" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">② 代价一：V_BE 翻倍到 1.4V —— 3.3V 系统里这 1.4V 的损失不可忽略<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="131.1" y="579.0" width="537.8" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 代价二：V_CE(sat) 升到 0.9V（Q2 无法深度饱和）→ 大电流时白烧热<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="104.5" y="579.0" width="591.1" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="592" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">④ 用武之地：μA 级驱动 A 级负载；ULN2003 把 7 路达林顿+续流管做进一颗芯片<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
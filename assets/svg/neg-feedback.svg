<circle cx="330" cy="180" r="4" fill="#334155"/>
<line x1="330" y1="180" x2="480" y2="180" stroke="#334155" stroke-width="2.5"/>
<line x1="330" y1="140" x2="40" y2="140" stroke="#334155" stroke-width="2.5"/>
<line x1="40" y1="140" x2="40" y2="160" stroke="#334155" stroke-width="2.5"/>
<rect x="29" y="160" width="22" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="40" y1="210" x2="40" y2="230" stroke="#334155" stroke-width="2.5"/>
<line x1="40" y1="230" x2="40" y2="244" stroke="#334155" stroke-width="2.5"/><line x1="24" y1="244" x2="56" y2="244" stroke="#334155" stroke-width="3"/><line x1="30" y1="250" x2="50" y2="250" stroke="#334155" stroke-width="3"/><line x1="36" y1="256" x2="44" y2="256" stroke="#334155" stroke-width="3"/>
<text x="64" y="166" font-size="10" font-weight="bold" fill="#b45309">R1 1kΩ</text>
<circle cx="330" cy="180" r="9" fill="none" stroke="#dc2626" stroke-width="2.5">
<animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="322" y="170" text-anchor="end" font-size="11.5" font-weight="bold" fill="#dc2626">v− ≈ v+</text>
<line x1="566" y1="200" x2="630" y2="200" stroke="#334155" stroke-width="2.5"/>
<text x="640" y="205" font-size="13" font-weight="bold" fill="#dc2626">vout</text>
<line x1="60" y1="320" x2="392" y2="320" stroke="#64748b" stroke-width="1.6"/>
<path d="M60,320 L67,322 L74,323 L81,325 L88,326 L94,327 L101,328 L108,330 L115,330 L122,331 L129,332 L136,332 L142,332 L149,332 L156,332 L163,331 L170,330 L177,330 L184,328 L191,327 L198,326 L204,325 L211,323 L218,322 L225,320 L232,318 L239,317 L246,315 L252,314 L259,313 L266,312 L273,310 L280,310 L287,309 L294,308 L301,308 L308,308 L314,308 L321,308 L328,309 L335,310 L342,310 L349,312 L356,313 L362,314 L369,315 L376,317 L383,318 L390,320" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="64" y="288" font-size="10" font-weight="bold" fill="#2563eb">输入 ±0.5V</text>
<circle r="5.5" fill="#fff" stroke="#2563eb" stroke-width="3"><animateMotion dur="2.5s" repeatCount="indefinite" path="M60,320 L67,322 L74,323 L81,325 L88,326 L94,327 L101,328 L108,330 L115,330 L122,331 L129,332 L136,332 L142,332 L149,332 L156,332 L163,331 L170,330 L177,330 L184,328 L191,327 L198,326 L204,325 L211,323 L218,322 L225,320 L232,318 L239,317 L246,315 L252,314 L259,313 L266,312 L273,310 L280,310 L287,309 L294,308 L301,308 L308,308 L314,308 L321,308 L328,309 L335,310 L342,310 L349,312 L356,313 L362,314 L369,315 L376,317 L383,318 L390,320"/></circle>
<line x1="430" y1="320" x2="772" y2="320" stroke="#64748b" stroke-width="1.6"/>
<path d="M430,320 L437,329 L444,339 L451,348 L458,356 L466,364 L473,371 L480,377 L487,382 L494,387 L501,390 L508,391 L516,392 L523,391 L530,390 L537,387 L544,382 L551,377 L558,371 L565,364 L572,356 L580,348 L587,339 L594,329 L601,320 L608,311 L615,301 L622,292 L630,284 L637,276 L644,269 L651,263 L658,258 L665,253 L672,250 L679,249 L686,248 L694,249 L701,250 L708,253 L715,258 L722,263 L729,269 L736,276 L744,284 L751,292 L758,301 L765,311 L772,320" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="434" y="290" font-size="10" font-weight="bold" fill="#dc2626">输出 ±3V（同相 ×6）</text>
<circle r="5.5" fill="#fff" stroke="#dc2626" stroke-width="3"><animateMotion dur="2.5s" repeatCount="indefinite" path="M430,320 L437,329 L444,339 L451,348 L458,356 L466,364 L473,371 L480,377 L487,382 L494,387 L501,390 L508,391 L516,392 L523,391 L530,390 L537,387 L544,382 L551,377 L558,371 L565,364 L572,356 L580,348 L587,339 L594,329 L601,320 L608,311 L615,301 L622,292 L630,284 L637,276 L644,269 L651,263 L658,258 L665,253 L672,250 L679,249 L686,248 L694,249 L701,250 L708,253 L715,258 L722,263 L729,269 L736,276 L744,284 L751,292 L758,301 L765,311 L772,320"/></circle>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#2563eb"><animateMotion dur="6s" begin="-0.50s" repeatCount="indefinite" path="M115,224 H476"/></circle>
<circle r="4" fill="#2563eb"><animateMotion dur="6s" begin="1.00s" repeatCount="indefinite" path="M115,224 H476"/></circle>
<circle r="4" fill="#2563eb"><animateMotion dur="6s" begin="2.50s" repeatCount="indefinite" path="M115,224 H476"/></circle>
<circle r="4" fill="#2563eb"><animateMotion dur="6s" begin="4.00s" repeatCount="indefinite" path="M115,224 H476"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.78;0.84;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#b45309"><animateMotion dur="6s" begin="-0.50s" repeatCount="indefinite" path="M562,196 V144 H334 V176"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="0.70s" repeatCount="indefinite" path="M562,196 V144 H334 V176"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="1.90s" repeatCount="indefinite" path="M562,196 V144 H334 V176"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="3.10s" repeatCount="indefinite" path="M562,196 V144 H334 V176"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="4.30s" repeatCount="indefinite" path="M562,196 V144 H334 V176"/></circle></g><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 开环蛮力：放大 10 万倍——输入刚抬 0.1V，输出瞬间撞上电源轨<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">② 反馈线：把输出按 R1:(R1+R2) 切下 1/6，送回反相端 v−<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 运放继续调 vout，直到 v− = v+——残余误差只有 µV 级<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.56;0.78;0.84;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 增益 = 1 + R2/R1 = 6：蛮力被驯成电阻的规矩——增益不靠芯片靠电阻<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/>
<rect x="50" y="438" width="700" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="460" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">负反馈的魔法：运放出十万倍的蛮力盯误差，电阻定结果——「增益不靠芯片靠电阻，误差不到调不停」。12.1 的两条公理，全部从这里来。</text>
</g></svg>
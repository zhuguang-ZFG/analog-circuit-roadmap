<line x1="430" y1="350" x2="772" y2="350" stroke="#64748b" stroke-width="1.6"/>
<path d="M430,315 L435,319 L441,324 L446,328 L451,332 L457,337 L462,341 L467,346 L473,350 L478,354 L483,359 L489,363 L494,368 L499,372 L505,376 L510,381 L516,385 L521,381 L526,376 L532,372 L537,368 L542,363 L548,359 L553,354 L558,350 L564,346 L569,341 L574,337 L580,332 L585,328 L590,324 L596,319 L601,315 L606,319 L612,324 L617,328 L622,332 L628,337 L633,341 L638,346 L644,350 L649,354 L654,359 L660,363 L665,368 L670,372 L676,376 L681,381 L686,385 L692,381 L697,376 L703,372 L708,368 L713,363 L719,359 L724,354 L729,350 L735,346 L740,341 L745,337 L751,332 L756,328 L761,324 L767,319 L772,315" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="434" y="290" font-size="10" font-weight="bold" fill="#dc2626">输出：匀速斜坡 → 三角波</text>
<circle r="5.5" fill="#fff" stroke="#dc2626" stroke-width="3"><animateMotion dur="2.5s" repeatCount="indefinite" path="M430,315 L435,319 L441,324 L446,328 L451,332 L457,337 L462,341 L467,346 L473,350 L478,354 L483,359 L489,363 L494,368 L499,372 L505,376 L510,381 L516,385 L521,381 L526,376 L532,372 L537,368 L542,363 L548,359 L553,354 L558,350 L564,346 L569,341 L574,337 L580,332 L585,328 L590,324 L596,319 L601,315 L606,319 L612,324 L617,328 L622,332 L628,337 L633,341 L638,346 L644,350 L649,354 L654,359 L660,363 L665,368 L670,372 L676,376 L681,381 L686,385 L692,381 L697,376 L703,372 L708,368 L713,363 L719,359 L724,354 L729,350 L735,346 L740,341 L745,337 L751,332 L756,328 L761,324 L767,319 L772,315"/></circle>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#dc2626"><animateMotion dur="6s" begin="-0.50s" repeatCount="indefinite" path="M115,176 H326 V136 H376"/></circle>
<circle r="4" fill="#dc2626"><animateMotion dur="6s" begin="1.00s" repeatCount="indefinite" path="M115,176 H326 V136 H376"/></circle>

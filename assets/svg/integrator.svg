<circle r="4" fill="#dc2626"><animateMotion dur="6s" begin="4.00s" repeatCount="indefinite" path="M115,176 H326 V136 H376"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/><circle r="4" fill="#b45309"><animateMotion dur="6s" begin="-0.50s" repeatCount="indefinite" path="M376,136 H334 V184 H115"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="1.00s" repeatCount="indefinite" path="M376,136 H334 V184 H115"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="2.50s" repeatCount="indefinite" path="M376,136 H334 V184 H115"/></circle>
<circle r="4" fill="#b45309"><animateMotion dur="6s" begin="4.00s" repeatCount="indefinite" path="M376,136 H334 V184 H115"/></circle></g><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">① 方波 +1V：恒流 i = Vin/Rin 给 C 充电——vout 匀速下滑（斜坡就是「积累」）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.26;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">② 方波翻到 −1V：电流反向，电容匀速放电——vout 匀速上爬<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.5;0.56;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 一下一上接成三角波：积分器把「方块的快慢」变成「斜坡的高低」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.56;0.78;0.84;1" dur="6s" repeatCount="indefinite"/></text><text x="400" y="418" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 增益变成斜率 dVout/dt = −Vin/RC：不是放大倍数，是时间整形<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="6s" repeatCount="indefinite"/>
<rect x="50" y="438" width="700" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="460" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">积分器的灵魂：恒流充电容 = 匀速斜坡。实战必记：并在 C 上一只 10MΩ 泄放 V_OS，否则输出慢慢爬向电源轨（漂移饱和）；微分器相反——高频增益无限上升 = 噪声放大器，输入串 R、反馈并 C 摁住它。</text>
</g></svg>
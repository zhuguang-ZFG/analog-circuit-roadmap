<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
<title>BJT 三个工作区：看两个 PN 结的脸色</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="560" fill="url(#bgL)"/>
<rect width="800" height="560" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="560" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
rect[fill="#f8fafc"]{fill:#0f172a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#64748b}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">BJT 三个工作区：看两个 PN 结的脸色</text>

<text x="210" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">判据看两个结，不看心情</text>
<g stroke="#334155" fill="none" stroke-width="2.5">
<circle cx="118" cy="190" r="34" stroke-width="1.8"/>
<line x1="95" y1="170" x2="95" y2="210" stroke-width="3.5"/>
<line x1="95" y1="182" x2="130" y2="155"/>
<line x1="95" y1="198" x2="130" y2="225"/>
<line x1="130" y1="155" x2="130" y2="135"/>
<line x1="130" y1="225" x2="130" y2="245"/>
<line x1="45" y1="190" x2="95" y2="190"/>
<polygon points="130,225 117.5,221.6 123.5,213.8" fill="#334155" stroke="none"/>
</g>
<text x="37" y="182" font-size="12.5" font-weight="bold" fill="#dc2626">B</text>
<text x="139" y="142" font-size="12.5" font-weight="bold" fill="#2563eb">C</text>
<text x="139" y="250" font-size="12.5" font-weight="bold" fill="#059669">E</text>
<line x1="105" y1="140" x2="105" y2="170" stroke="#334155" stroke-width="2.5"/>
<text x="30" y="134" font-size="11.5" font-weight="bold" fill="#b45309">+12V</text>
<line x1="105" y1="120" x2="105" y2="140" stroke="#334155" stroke-width="2.5"/>
<rect x="94" y="140" width="22" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="105" y1="180" x2="105" y2="200" stroke="#334155" stroke-width="2.5"/>
<text x="168" y="161" font-size="12.5" font-weight="bold" fill="#b45309">R_C 2k</text>
<line x1="130" y1="135" x2="130" y2="170" stroke="#334155" stroke-width="2.5"/>
<line x1="50" y1="190" x2="95" y2="190" stroke="#334155" stroke-width="2.5"/>
<line x1="70" y1="170" x2="70" y2="190" stroke="#334155" stroke-width="2.5"/>
<rect x="59" y="190" width="22" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="70" y1="230" x2="70" y2="250" stroke="#334155" stroke-width="2.5"/>
<text x="70" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">R_B 300k</text>
<line x1="70" y1="110" x2="70" y2="170" stroke="#334155" stroke-width="2.5"/>
<line x1="70" y1="110" x2="105" y2="110" stroke="#334155" stroke-width="2.5"/>
<text x="18" y="106" font-size="11.5" font-weight="bold" fill="#b45309">+12V</text>
<line x1="130" y1="245" x2="130" y2="285" stroke="#334155" stroke-width="2.5"/>
<line x1="130" y1="265" x2="130" y2="285" stroke="#334155" stroke-width="2.5"/>
<rect x="119" y="285" width="22" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="130" y1="325" x2="130" y2="345" stroke="#334155" stroke-width="2.5"/>
<text x="150" y="310" font-size="11" font-weight="bold" fill="#475569">R_E 100</text>
<line x1="130" y1="325" x2="130" y2="350" stroke="#334155" stroke-width="2.5"/>
<line x1="130" y1="350" x2="130" y2="364" stroke="#334155" stroke-width="2.5"/><line x1="114" y1="364" x2="146" y2="364" stroke="#334155" stroke-width="3"/><line x1="120" y1="370" x2="140" y2="370" stroke="#334155" stroke-width="3"/><line x1="126" y1="376" x2="134" y2="376" stroke="#334155" stroke-width="3"/>
<text x="140" y="232" font-size="11" fill="#475569">I_B=(12−0.7)/300k</text>
<text x="140" y="268" font-size="11" fill="#dc2626">≈38µA → I_C ≈ 3.8mA</text>
<line x1="286" y1="76" x2="286" y2="388" stroke="#cbd5e1" stroke-width="1"/>
<text x="300" y="88" font-size="12.5" font-weight="bold" fill="#334155">三个工作区</text>
<text x="306" y="122" font-size="12" fill="#475569">发射结</text>
<text x="394" y="122" font-size="12" fill="#475569">集电结</text>
<text x="300" y="152" font-size="12.5" font-weight="bold" fill="#64748b">截止</text>
<text x="306" y="178" font-size="11.5" fill="#dc2626">反偏</text>
<text x="394" y="178" font-size="11.5" fill="#dc2626">反偏</text>
<text x="300" y="208" font-size="12.5" font-weight="bold" fill="#2563eb">放大</text>
<text x="306" y="234" font-size="11.5" fill="#059669">正偏</text>
<text x="394" y="234" font-size="11.5" fill="#dc2626">反偏</text>
<text x="300" y="264" font-size="12.5" font-weight="bold" fill="#dc2626">饱和</text>
<text x="306" y="290" font-size="11.5" fill="#059669">正偏</text>
<text x="394" y="290" font-size="11.5" fill="#059669">正偏</text>
<text x="300" y="332" font-size="12" font-weight="bold" fill="#64748b">≈ 断路（开关打开）</text>
<text x="300" y="356" font-size="12" font-weight="bold" fill="#2563eb">I_C = β·I_B</text>
<text x="300" y="380" font-size="12" font-weight="bold" fill="#dc2626">≈ 闭合开关（β 失效）</text>
<text x="470" y="60" font-size="12.5" font-weight="bold" fill="#334155">输出特性：负载线切过哪里，就是哪个区</text>
<line x1="450" y1="332" x2="790" y2="332" stroke="#64748b" stroke-width="1.6"/>
<line x1="450" y1="332" x2="450" y2="92" stroke="#64748b" stroke-width="1.6"/>
<text x="442" y="86" text-anchor="end" font-size="11" fill="#475569">I_C</text>
<text x="444" y="336" text-anchor="end" font-size="10.5" fill="#475569">0</text>
<text x="444" y="296" text-anchor="end" font-size="10.5" fill="#475569">2mA</text>
<text x="444" y="256" text-anchor="end" font-size="10.5" fill="#475569">4mA</text>
<text x="444" y="218" text-anchor="end" font-size="10.5" font-weight="bold" fill="#dc2626">6mA 饱和</text>
<line x1="450" y1="260" x2="588" y2="260" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="588" y1="260" x2="588" y2="332" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="450" y="214" width="138" height="118" fill="#dc2626" opacity="0.10"/>
<text x="790" y="352" text-anchor="end" font-size="10.5" font-weight="bold" fill="#64748b">12V 截止</text>
<text x="588" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c3aed">4.4V</text>
<text x="476" y="352" font-size="10.5" fill="#475569">0.2V</text>
<text x="470" y="140" font-size="11" font-weight="bold" fill="#dc2626">饱和区</text>
<text x="470" y="158" font-size="10.5" fill="#475569">负载线压在曲线上方</text>
<text x="470" y="180" font-size="10.5" fill="#475569">膝点：V_CE=0.2V，I_C≈5.9mA</text>
<path d="M456,214 L460,224 L464,236 L470,250 L476,260 L507,260 L620,260 L700,260 L790,259" fill="none" stroke="#0ea5e9" stroke-width="2.4"/>
<text x="676" y="214" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0ea5e9">放大区：I_C=βI_B 拉平在 3.8mA</text>
<text x="760" y="140" text-anchor="end" font-size="10.5" font-weight="bold" fill="#7c3aed">负载线 I_C=(12−V_CE)/2k</text>
<line x1="456" y1="214" x2="790" y2="332" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
<circle r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2">
<animateMotion dur="8s" repeatCount="indefinite" path="M456,214 L790,332" keyPoints="0;1;0" keyTimes="0;0.5;1"/></circle>
<text x="600" y="254" font-size="11" font-weight="bold" fill="#7c3aed">Q（工作点）</text>
<text x="612" y="374" text-anchor="middle" font-size="10.5" fill="#475569">蓝线=输出特性　紫虚线=负载线　圆点沿负载线来回扫：左端饱和、右端截止</text>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="8s" begin="-0.2s" repeatCount="indefinite" path="M105,112 L105,138"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="8s" begin="-0.9s" repeatCount="indefinite" path="M70,112 L70,168"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="8s" begin="-1.6s" repeatCount="indefinite" path="M52,190 L93,190"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="8s" begin="-2.3s" repeatCount="indefinite" path="M130,247 L130,282"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="8s" begin="-3.0s" repeatCount="indefinite" path="M130,137 L130,168"/></circle>
<rect x="452" y="130" width="116" height="96" rx="8" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.0s" repeatCount="indefinite"/></rect>
<rect x="534" y="242" width="30" height="30" rx="6" fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.6s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="8s" repeatCount="indefinite"/><rect x="179.9" y="392.9" width="440.2" height="24.1" rx="12.0" fill="#64748b" fill-opacity="0.09" stroke="#64748b" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#64748b" opacity="0">① 截止区：两个结都反偏——CE 之间像断了的开关，I_C≈0<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="8s" repeatCount="indefinite"/><rect x="155.5" y="392.9" width="489.0" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 放大区：发射结正偏、集电结反偏——I_C=β·I_B，是放大器的家<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.78;0.83;1" dur="8s" repeatCount="indefinite"/><rect x="141.5" y="392.9" width="517.0" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.78;0.83;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 饱和区：两个结都正偏——V_CE≈0.2V，像合上的开关，β 说了不算<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.78;0.83;1" dur="8s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.83;0.88;1" dur="8s" repeatCount="indefinite"/><rect x="147.9" y="392.9" width="504.3" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.88;1" dur="8s" repeatCount="indefinite"/></rect><text x="400" y="406" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 常青坑：设计时不先把「放大区」用负载线框死——信号一摆就削顶<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.83;0.88;1" dur="8s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.94;1" dur="8s" repeatCount="indefinite"/>
<rect x="30" y="460" width="740" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="36" y="467" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="482.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">口诀：放大靠「发正集反」；开关要「深饱和」（I_B 按 1/10 I_C 给，别按 β 算）</text>
</g></svg>
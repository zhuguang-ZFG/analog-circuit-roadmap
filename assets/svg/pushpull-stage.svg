<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620">
<title>推挽输出：两个方向都能驱动，但绝不能同时开</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="620" fill="url(#bgL)"/>
<rect width="800" height="620" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="620" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">推挽输出：两个方向都能驱动，但绝不能同时开</text>

<text x="200" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">图腾柱：上管推高、下管拉低</text>
<text x="88" y="86" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b45309">VDD 5V</text>
<line x1="150" y1="92" x2="150" y2="120" stroke="#334155" stroke-width="2.5"/>
<line x1="96" y1="92" x2="150" y2="92" stroke="#334155" stroke-width="2.5"/>
<rect x="112" y="120" width="76" height="46" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="150" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2563eb">上管 PMOS</text>
<text x="150" y="158" text-anchor="middle" font-size="10.5" fill="#475569">ON = 推高</text>
<line x1="150" y1="166" x2="150" y2="196" stroke="#334155" stroke-width="2.5"/>
<circle cx="150" cy="196" r="4.5" fill="#334155"/>
<line x1="150" y1="196" x2="290" y2="196" stroke="#334155" stroke-width="2.5"/>
<text x="296" y="192" font-size="12" font-weight="bold" fill="#059669">OUT</text>
<line x1="150" y1="196" x2="150" y2="226" stroke="#334155" stroke-width="2.5"/>
<rect x="112" y="226" width="76" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="150" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">下管 NMOS</text>
<text x="150" y="264" text-anchor="middle" font-size="10.5" fill="#475569">ON = 拉低</text>
<line x1="150" y1="272" x2="150" y2="300" stroke="#334155" stroke-width="2.5"/>
<line x1="150" y1="300" x2="150" y2="314" stroke="#334155" stroke-width="2.5"/><line x1="134" y1="314" x2="166" y2="314" stroke="#334155" stroke-width="3"/><line x1="140" y1="320" x2="160" y2="320" stroke="#334155" stroke-width="3"/><line x1="146" y1="326" x2="154" y2="326" stroke="#334155" stroke-width="3"/>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M150,92 L150,118"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="11s" begin="-0.3s" repeatCount="indefinite" path="M152,168 L152,194 L288,196"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="11s" begin="-1.2s" repeatCount="indefinite" path="M288,200 L152,200 L152,274 L150,298"/></circle>
<circle r="4" fill="#f59e0b"><animateMotion dur="11s" begin="-2.0s" repeatCount="indefinite" path="M150,116 L150,270 L150,116"/></circle>
<text x="330" y="120" font-size="11.5" font-weight="bold" fill="#2563eb">输出高：上管供流</text>
<text x="330" y="138" font-size="11" fill="#475569">（source current）</text>
<text x="330" y="170" font-size="11.5" font-weight="bold" fill="#dc2626">输出低：下管吸流</text>
<text x="330" y="188" font-size="11" fill="#475569">（sink current）</text>
<text x="330" y="220" font-size="11.5" font-weight="bold" fill="#059669">两个方向都主动驱动</text>
<text x="330" y="238" font-size="11" fill="#475569">——比开漏快得多</text>
<rect x="40" y="340" width="330" height="130" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="56" y="366" font-size="12" font-weight="bold" fill="#b91c1c">⚠ 两个推挽直连 = 短路</text>
<text x="56" y="390" font-size="11" fill="#475569">一只推高、一只推低，电流只受管阻限制：</text>
<text x="56" y="410" font-size="11" font-weight="bold" fill="#dc2626">I = 5V / (25Ω+25Ω) = 100mA</text>
<text x="56" y="432" font-size="11" fill="#475569">够烧 IO；所以共享总线绝不能用推挽</text>
<text x="56" y="454" font-size="11" fill="#475569">（要用开漏 / 三态，见 5.2、5.4）</text>
<text x="420" y="340" font-size="12" font-weight="bold" fill="#b45309">切换瞬间：直通电流（shoot-through）</text>
<text x="420" y="362" font-size="11" fill="#475569">上下管换班的几 ns 里两个都半开，</text>
<text x="420" y="382" font-size="11" fill="#475569">VDD 到 GND 被短暂打通 → 电源毛刺 +</text>
<text x="420" y="402" font-size="11" fill="#475569">动态功耗的元凶。芯片靠「死区时间」</text>
<text x="420" y="422" font-size="11" fill="#475569">（先关后开）把它压掉。</text>
<text x="420" y="452" font-size="11.5" font-weight="bold" fill="#7c3aed">音频乙类推挽还要防交越失真（见 11.4）</text>
<line x1="40" y1="490" x2="760" y2="490" stroke="#cbd5e1" stroke-width="1"/>
<text x="400" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">三兄弟对比：推挽 vs 开漏 vs 三态</text>
<text x="400" y="542" text-anchor="middle" font-size="11.5" fill="#475569">推挽：两个方向都主动驱动，但**不能共享总线**　·　开漏：只能拉低，靠上拉出高，**可以线与**　·　三态：加了「隐身」态，**可以共享总线**</text>
<text x="400" y="566" text-anchor="middle" font-size="11" fill="#64748b">选哪种，先问一句：这根线上会不会有第二个驱动器？</text>
<circle r="5" fill="#f59e0b"><animateMotion dur="11s" begin="-0.6s" repeatCount="indefinite" path="M98,92 L148,92"/></circle>
<circle r="5" fill="#7c3aed"><animateMotion dur="11s" begin="-1.6s" repeatCount="indefinite" path="M150,304 L150,312"/></circle>
<circle r="4.5" fill="#2563eb"><animateMotion dur="11s" begin="-2.4s" repeatCount="indefinite" path="M154,196 L286,196"/></circle>
<rect x="290" y="176" width="70" height="24" rx="6" fill="none" stroke="#059669" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="40" y="338" width="330" height="134" rx="10" fill="none" stroke="#b91c1c" stroke-width="2.5" opacity="0" filter="url(#pglow)"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/><rect x="137.6" y="587.0" width="524.9" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 上管导通 = 主动推高；下管导通 = 主动拉低——两个方向都有低阻通路<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/><rect x="152.1" y="587.0" width="495.8" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">② 所以推挽输出上升/下降沿都快、驱动强——MCU GPIO 默认就是它<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/><rect x="151.5" y="587.0" width="497.0" height="24.1" rx="12.0" fill="#b91c1c" fill-opacity="0.09" stroke="#b91c1c" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b91c1c" opacity="0">③ 代价一：两个推挽直连就是短路，电流只受管阻限制（100mA 级）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="11s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/><rect x="166.4" y="587.0" width="467.1" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></rect><text x="400" y="600" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 代价二：换班瞬间有直通电流 → 电源毛刺；要靠死区时间压掉<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="11s" repeatCount="indefinite"/></text></g></svg>
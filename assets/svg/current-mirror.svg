<line x1="440" y1="255" x2="440" y2="285" stroke="#334155" stroke-width="2.5"/>
<line x1="440" y1="285" x2="440" y2="299" stroke="#334155" stroke-width="2.5"/><line x1="424" y1="299" x2="456" y2="299" stroke="#334155" stroke-width="3"/><line x1="430" y1="305" x2="450" y2="305" stroke="#334155" stroke-width="3"/><line x1="436" y1="311" x2="444" y2="311" stroke="#334155" stroke-width="3"/>

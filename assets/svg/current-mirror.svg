<circle r="5" fill="#059669"><animateMotion dur="2.0s" begin="1.17s" repeatCount="indefinite" path="M64,66 H140 V160 V235 V281"/></circle></g></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/><g filter="url(#pglow)"><circle r="5" fill="#2563eb"><animateMotion dur="2.0s" begin="-0.50s" repeatCount="indefinite" path="M556,66 V116 H505 M444,124 V160 V235 V281"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="2.0s" begin="-0.10s" repeatCount="indefinite" path="M556,66 V116 H505 M444,124 V160 V235 V281"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="2.0s" begin="0.30s" repeatCount="indefinite" path="M556,66 V116 H505 M444,124 V160 V235 V281"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="2.0s" begin="0.70s" repeatCount="indefinite" path="M556,66 V116 H505 M444,124 V160 V235 V281"/></circle>
<circle r="5" fill="#2563eb"><animateMotion dur="2.0s" begin="1.10s" repeatCount="indefinite" path="M556,66 V116 H505 M444,124 V160 V235 V281"/></circle></g></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/><rect x="105.0" y="416.9" width="590.0" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① R_SET 注入 I_REF——Q1 二极管接法让 V_BE 自动停在「恰好流过 1mA」的值<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/><rect x="98.8" y="416.9" width="602.5" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">② 同一根基极线把这只 V_BE 同时喂给 Q2——V_BE 相同，I_C 就相同：电流被复印<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/><rect x="150.7" y="416.9" width="498.5" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">③ Q2 集电极电压随负载怎么变，电流纹丝不动——这就是「电流源」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.79;1" dur="6s" repeatCount="indefinite"/>
<rect x="50" y="450" width="700" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="56" y="457" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="472.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">误差源头：两只基流都从 I_REF 里扣（β 有限）——Wilson 镜再加一管，把误差再压一个数量级</text>
</g></svg>
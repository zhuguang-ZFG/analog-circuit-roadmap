definite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 动态电阻不是常数：1mA 处 26Ω，越小电流越「大」<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="10s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/><rect x="200.9" y="535.0" width="398.2" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></rect><text x="400" y="548" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 所以二极管当不了精密基准——它的曲线只听温度的<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="10s" repeatCount="indefinite"/></text></g><g opacity="0">

<text x="577" y="193" font-size="10.5" font-weight="bold" fill="#dc2626">25℃ 时 1mA 在 0.36V</text>
<text x="577" y="179" font-size="10.5" font-weight="bold" fill="#2563eb">60℃ 时同一电流只要 0.29V</text>
<text x="560" y="158" font-size="10.5" font-weight="bold" fill="#2563eb">60℃ 曲线：整条左移 70mV（−2mV/℃×35℃）</text>
<text x="596" y="216" font-size="10.5" fill="#475569">↑ 每上升 60mV，电流爬一个十倍</text>
<text x="596" y="252" font-size="10.5" fill="#475569">↑ 指数不是「快」，是「没有拐点」</text>

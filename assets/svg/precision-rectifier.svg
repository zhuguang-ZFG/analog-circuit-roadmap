<text x="590" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">普通二极管整流：0.7V 死区 → 输出=0</text>
<path d="M430,280 L750,280" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
<text x="590" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">精密整流输出：干净半波（基线=0V）</text>
<path d="M430,280 L434,273 L439,266 L443,260 L448,254 L452,249 L457,245 L461,242 L466,241 L470,240 L474,241 L479,242 L483,245 L488,249 L492,254 L497,260 L501,266 L506,273 L510,280 L514,280 L519,280 L523,280 L528,280 L532,280 L537,280 L541,280 L546,280 L550,280 L554,280 L559,280 L563,280 L568,280 L572,280 L577,280 L581,280 L586,280 L590,280 L594,273 L599,266 L603,260 L608,254 L612,249 L617,245 L621,242 L626,241 L630,240 L634,241 L639,242 L643,245 L648,249 L652,254 L657,260 L661,266 L666,273 L670,280 L674,280 L679,280 L683,280 L688,280 L692,280 L697,280 L701,280 L706,280 L710,280 L714,280 L719,280 L723,280 L728,280 L732,280 L737,280 L741,280 L746,280 L750,280" fill="none" stroke="#059669" stroke-width="2.5" transform="translate(0,80)"/>
<line x1="430" y1="360" x2="750" y2="360" stroke="#64748b" stroke-width="1.2"/>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/><rect x="102.4" y="426.9" width="595.2" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 正半周：运放开环增益 10 万倍——输出只需多抬 0.7V，折算回输入仅 7µV 误差<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/><rect x="172.1" y="426.9" width="455.8" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 负半周：二极管截止、运放饱和也无妨——输出被 Rf 锚在 0<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/><rect x="99.7" y="426.9" width="600.6" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="440" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 对比：普通二极管对 100mV 信号输出为零；精密整流分毫毕现——mV 级信号救星<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.79;1" dur="6s" repeatCount="indefinite"/>
<rect x="60" y="462" width="680" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="66" y="469" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="484.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">0.7V ÷ 开环增益 = 等效死区 7µV——把非线性元件塞进反馈环，让增益替你买单</text>
</g></svg>
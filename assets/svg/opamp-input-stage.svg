<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="ttl">
<title id="ttl">运放输入级选型：源阻抗决定一切</title>
<desc>运放输入级选型：源阻抗决定一切；节拍：① 三种输入级：先看 I_b、e_n、i_n 三个数，别看"低噪声"三个字；② 低源阻抗：热噪声 12.9 nV/√Hz 是地板，比的是 e_n → BJT 赢 1.7 倍；③ 高源阻抗 1 MΩ：BJT 的 I_b·R_s = 20 mV，CMOS 只有 1 µV —— 差四个数量级；④ RRIO 的代价：互补输入对在中点 g_m 凹陷 → 交越失真 + 失调台阶</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="590" fill="url(#bgL)"/>
<rect width="800" height="590" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="590" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">运放输入级选型：源阻抗决定一切</text>
<text x="400" y="53" text-anchor="middle" font-size="12" fill="#475569">判据只有一条：V_err = I_b × R_s —— 低阻比 e_n，高阻比 I_b</text>
<rect x="40" y="80" width="234" height="220" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
<text x="157" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">BJT 输入级</text>
<line x1="56" y1="121" x2="258" y2="121" stroke="#dc2626" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="56" y="148" font-size="11.5" fill="#475569">偏置电流 I_b</text>
<text x="258" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">10 nA ~ 1 µA</text>
<text x="56" y="174" font-size="11.5" fill="#475569">电压噪声 e_n</text>
<text x="258" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">3 ~ 10 nV/√Hz</text>
<text x="56" y="200" font-size="11.5" fill="#475569">电流噪声 i_n</text>
<text x="258" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">较高</text>
<line x1="56" y1="226" x2="258" y2="226" stroke="#dc2626" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="56" y="248" font-size="11.5" fill="#475569">最佳区间</text>
<text x="56" y="270" font-size="13" font-weight="bold" fill="#dc2626">Rs &lt; 30 kΩ</text>
<text x="56" y="290" font-size="11" fill="#475569">低阻下 e_n 主导</text>
<rect x="283" y="80" width="234" height="220" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
<text x="400" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">CMOS 输入级</text>
<line x1="299" y1="121" x2="501" y2="121" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="299" y="148" font-size="11.5" fill="#475569">偏置电流 I_b</text>
<text x="501" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">1 pA ~ 1 nA</text>
<text x="299" y="174" font-size="11.5" fill="#475569">电压噪声 e_n</text>
<text x="501" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">10 ~ 30 nV/√Hz</text>
<text x="299" y="200" font-size="11.5" fill="#475569">电流噪声 i_n</text>
<text x="501" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">极低</text>
<line x1="299" y1="226" x2="501" y2="226" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="299" y="248" font-size="11.5" fill="#475569">最佳区间</text>
<text x="299" y="270" font-size="13" font-weight="bold" fill="#2563eb">Rs &gt; 300 kΩ</text>
<text x="299" y="290" font-size="11" fill="#475569">I_b·R_s 几乎为零</text>
<rect x="526" y="80" width="234" height="220" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
<text x="643" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">JFET 输入级</text>
<line x1="542" y1="121" x2="744" y2="121" stroke="#059669" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="542" y="148" font-size="11.5" fill="#475569">偏置电流 I_b</text>
<text x="744" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">1 pA ~ 30 pA</text>
<text x="542" y="174" font-size="11.5" fill="#475569">电压噪声 e_n</text>
<text x="744" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">10 ~ 20 nV/√Hz</text>
<text x="542" y="200" font-size="11.5" fill="#475569">电流噪声 i_n</text>
<text x="744" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#1e293b">极低</text>
<line x1="542" y1="226" x2="744" y2="226" stroke="#059669" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="542" y="248" font-size="11.5" fill="#475569">最佳区间</text>
<text x="542" y="270" font-size="13" font-weight="bold" fill="#059669">30 kΩ ~ 300 kΩ</text>
<text x="542" y="290" font-size="11" fill="#475569">e_n 与 I_b 都低</text>
<rect x="40" y="320" width="720" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="400" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">按源阻抗选输入级（横轴为对数刻度）</text>
<line x1="70" y1="396" x2="730" y2="396" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="70" y1="396" x2="314" y2="396" stroke="#dc2626" stroke-width="9"/>
<text x="192" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">BJT 最佳</text>
<line x1="314" y1="396" x2="479" y2="396" stroke="#059669" stroke-width="9"/>
<text x="396" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">JFET 过渡区</text>
<line x1="479" y1="396" x2="730" y2="396" stroke="#2563eb" stroke-width="9"/>
<text x="604" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2563eb">CMOS 最佳</text>
<text x="70" y="418" text-anchor="middle" font-size="10.5" fill="#475569">1 kΩ</text>
<text x="314" y="418" text-anchor="middle" font-size="10.5" fill="#475569">30 kΩ</text>
<text x="479" y="418" text-anchor="middle" font-size="10.5" fill="#475569">300 kΩ</text>
<text x="730" y="418" text-anchor="middle" font-size="10.5" fill="#475569">10 MΩ</text>
<circle r="6" fill="#b45309" filter="url(#pglow)"><animateMotion dur="12s" begin="-3s" repeatCount="indefinite" path="M70,396 L730,396"/></circle>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="60" y="446" width="680" height="52.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="66" y="453" width="3" height="38.0" rx="1.5" fill="#059669"/><text x="400" y="468.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">低阻源看 e_n（BJT 胜），高阻源看 I_b（CMOS / JFET 胜）：1 MΩ</text><text x="400" y="486.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669"> 配 20 nA 就是 20 mV 直流误差，比运放自身的 V_os 大两个数量级。</text>
</g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="159.8" y="542.0" width="480.3" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 三种输入级：先看 I_b、e_n、i_n 三个数，别看"低噪声"三个字<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="130.6" y="542.0" width="538.8" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 低源阻抗：热噪声 12.9 nV/√Hz 是地板，比的是 e_n → BJT 赢 1.7 倍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="101.0" y="542.0" width="598.1" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 高源阻抗 1 MΩ：BJT 的 I_b·R_s = 20 mV，CMOS 只有 1 µV —— 差四个数量级<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="150.5" y="542.0" width="499.0" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="555" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ RRIO 的代价：互补输入对在中点 g_m 凹陷 → 交越失真 + 失调台阶<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
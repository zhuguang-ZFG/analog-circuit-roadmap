<text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#64748b" opacity="0">① 阶跃瞬间 V_+−V_−=1V：差分对彻底失衡，放大功能直接「宕机」<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.25;1" dur="9s" repeatCount="indefinite"/></text><text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 补偿电容被恒定电流充电 → 输出以 SR=0.5V/µs 直线上升（2µs 爬 1V）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.3;0.5;0.55;1" dur="9s" repeatCount="indefinite"/></text><text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">③ 退出饱和后按 GBW 走指数收尾：τ≈0.16µs，可能带过冲振铃<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.8;0.85;1" dur="9s" repeatCount="indefinite"/></text><text x="400" y="572" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">④ 大信号看 SR、小信号看 GBW：两条曲线谁慢，就决定建立时间<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/></text></svg>
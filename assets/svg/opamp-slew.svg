<text x="649" y="318" text-anchor="end" font-size="10.5" fill="#64748b">若只有 GBW=1MHz 的小信号速度</text>
<text x="659" y="294" font-size="11.5" font-weight="bold" fill="#dc2626">2µs 直线爬坡</text>
<text x="447" y="372" font-size="11" fill="#475569">斜率 = 0.5V/µs（SR）</text>
<text x="704" y="198" font-size="11" fill="#475569">指数收尾 τ≈0.16µs</text>
<text x="583" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">建立时间≈2.6µs</text>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<title>米勒效应：小电容被增益放大 (1+A) 倍</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="500" fill="url(#bgL)"/>
<rect width="800" height="500" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="500" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">米勒效应：小电容被增益放大 (1+A) 倍</text>

<text x="220" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">跨接在增益级输入输出之间的电容 C</text>
<text x="20" y="145" font-size="11" fill="#475569">输入源</text>
<line x1="40" y1="150" x2="60" y2="150" stroke="#334155" stroke-width="2.5"/>
<rect x="60" y="139" width="40" height="22" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="100" y1="150" x2="120" y2="150" stroke="#334155" stroke-width="2.5"/>
<text x="80.0" y="133" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">R_sig</text>
<circle cx="190" cy="150" r="4" fill="#334155"/>
<text x="182" y="172" font-size="11" font-weight="bold" fill="#2563eb">IN</text>
<rect x="230" y="120" width="90" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="275" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">增益级</text>
<text x="275" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">−A = −100</text>
<line x1="190" y1="150" x2="230" y2="150" stroke="#334155" stroke-width="2.5"/>
<line x1="320" y1="150" x2="360" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="360" cy="150" r="4" fill="#334155"/>
<text x="352" y="172" font-size="11" font-weight="bold" fill="#dc2626">OUT</text>
<line x1="190" y1="150" x2="190" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="190" y1="90" x2="216" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="216" y1="76" x2="216" y2="104" stroke="#7c3aed" stroke-width="3"/>
<line x1="228" y1="76" x2="228" y2="104" stroke="#7c3aed" stroke-width="3"/>
<text x="238" y="82" font-size="11" font-weight="bold" fill="#7c3aed">C=10pF</text>
<line x1="228" y1="90" x2="360" y2="90" stroke="#334155" stroke-width="2"/>
<line x1="360" y1="90" x2="360" y2="150" stroke="#334155" stroke-width="2"/>
<circle r="4" fill="#7c3aed"><animateMotion dur="6s" begin="-0.3s" repeatCount="indefinite" path="M190,150 L190,90 L216,90"/></circle>
<circle r="4" fill="#7c3aed"><animateMotion dur="6s" begin="-0.3s" repeatCount="indefinite" path="M228,90 L360,90 L360,150"/></circle>
<circle r="4" fill="#7c3aed"><animateMotion dur="6s" begin="-0.8s" repeatCount="indefinite" path="M190,150 L190,90 L216,90"/></circle>
<circle r="4" fill="#7c3aed"><animateMotion dur="6s" begin="-0.8s" repeatCount="indefinite" path="M228,90 L360,90 L360,150"/></circle>
<text x="60" y="220" font-size="11" fill="#2563eb" opacity="0">IN 摆 1mV
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.4;0.46;1" dur="6s" repeatCount="indefinite"/></text>
<text x="300" y="220" font-size="11" fill="#dc2626" opacity="0">OUT 反相摆 −100mV
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.4;0.46;1" dur="6s" repeatCount="indefinite"/></text>
<text x="150" y="290" font-size="11.5" font-weight="bold" fill="#7c3aed" opacity="0">C 两端电压差摆了 101mV——充电电流是「预期」的 101 倍！
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.9;0.96;1" dur="6s" repeatCount="indefinite"/></text>
<text x="60" y="330" font-size="12" fill="#334155" opacity="0">⇒ 从输入端看：等效电容 C_eff = (1+A)×C = 101×10pF ≈ <tspan font-weight="bold" fill="#dc2626">1nF</tspan>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.6;0.92;0.98;1" dur="6s" repeatCount="indefinite"/></text>

<rect x="480" y="90" width="270" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="615" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">输入端看到的「等效世界」</text>
<line x1="500" y1="150" x2="560" y2="150" stroke="#334155" stroke-width="2.5"/>
<line x1="560" y1="150" x2="560" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="546" y1="170" x2="574" y2="170" stroke="#7c3aed" stroke-width="3"/>
<line x1="546" y1="182" x2="574" y2="182" stroke="#7c3aed" stroke-width="3"/>
<line x1="560" y1="182" x2="560" y2="196" stroke="#334155" stroke-width="2"/>
<text x="586" y="180" font-size="11" font-weight="bold" fill="#dc2626">1nF 到地</text>
<text x="615" y="212" text-anchor="middle" font-size="10.5" fill="#475569">10pF 变身 1nF——高频信号全被它拖慢</text>
<text x="440" y="242" font-size="11" font-weight="bold" fill="#2563eb">IN：±1mV 小摆幅</text>
<path d="M440,268 L445,269 L449,269 L454,270 L459,271 L463,271 L468,272 L473,272 L478,273 L482,273 L487,274 L492,274 L496,274 L501,275 L506,275 L510,275 L515,275 L520,275 L524,275 L529,275 L534,274 L538,274 L543,274 L548,273 L552,273 L557,272 L562,272 L567,271 L571,271 L576,270 L581,269 L585,269 L590,268 L595,267 L599,267 L604,266 L609,265 L613,265 L618,264 L623,264 L628,263 L632,263 L637,262 L642,262 L646,262 L651,261 L656,261 L660,261 L665,261 L670,261 L674,261 L679,261 L684,262 L688,262 L693,262 L698,263 L702,263 L707,264 L712,264 L717,265 L721,265 L726,266 L731,267 L735,267 L740,268" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<line x1="440" y1="268" x2="740" y2="268" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="440" y="312" font-size="11" font-weight="bold" fill="#dc2626">OUT：∓100mV 大摆幅（反相）</text>
<path d="M440,352 L445,348 L449,345 L454,341 L459,337 L463,334 L468,331 L473,328 L478,325 L482,323 L487,320 L492,318 L496,317 L501,316 L506,315 L510,314 L515,314 L520,314 L524,315 L529,316 L534,317 L538,318 L543,320 L548,323 L552,325 L557,328 L562,331 L567,334 L571,337 L576,341 L581,345 L585,348 L590,352 L595,356 L599,359 L604,363 L609,367 L613,370 L618,373 L623,376 L628,379 L632,381 L637,384 L642,386 L646,387 L651,388 L656,389 L660,390 L665,390 L670,390 L674,389 L679,388 L684,387 L688,386 L693,384 L698,381 L702,379 L707,376 L712,373 L717,370 L721,367 L726,363 L731,359 L735,356 L740,352" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<line x1="440" y1="352" x2="740" y2="352" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/><rect x="127.7" y="416.9" width="544.6" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① IN 只摆 1mV，OUT 反相摆 −100mV——电容两端实际承受 101mV 的摆幅<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.28;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/><rect x="133.2" y="416.9" width="533.7" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">② 充同一份电荷，输入源要供 101 倍电流——仿佛对着 1nF 而不是 10pF<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.35;0.58;0.64;1" dur="6s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/><rect x="132.7" y="416.9" width="534.6" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></rect><text x="400" y="430" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">③ 坏事变好事：运放人为跨接小补偿电容——用米勒效应低成本获得大电容<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.7;1" dur="6s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.79;1" dur="6s" repeatCount="indefinite"/>
<rect x="45" y="450" width="710" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="51" y="457" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="472.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">C_eff=(1+A)·C：它是放大器高频滚降的元凶（C_bc 只有几 pF），也是密勒补偿的原理</text>
</g></svg>
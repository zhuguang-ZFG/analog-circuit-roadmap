<text x="590" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">开漏：只有下管，靠电阻回高</text>
<text x="446" y="76" font-size="12.5" font-weight="bold" fill="#b45309">VDD</text>
<line x1="480" y1="70" x2="560" y2="70" stroke="#334155" stroke-width="2.5"/>
<line x1="560" y1="70" x2="560" y2="90" stroke="#334155" stroke-width="2.5"/>
<rect x="549" y="90" width="22" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<line x1="560" y1="140" x2="560" y2="160" stroke="#334155" stroke-width="2.5"/>
<text x="580" y="119.0" font-size="12.5" font-weight="bold" fill="#b45309">上拉 Rp</text>
<line x1="560" y1="140" x2="560" y2="150" stroke="#334155" stroke-width="2.5"/>
<circle cx="560" cy="150" r="4" fill="#334155"/>
<line x1="560" y1="150" x2="700" y2="150" stroke="#334155" stroke-width="2.5"/>
<text x="706" y="146" font-size="12" font-weight="bold" fill="#2563eb">OUT</text>
<line x1="560" y1="150" x2="560" y2="174" stroke="#334155" stroke-width="2.5"/>
<circle cx="560" cy="174" r="3.5" fill="#334155"/>
<line x1="560" y1="174" x2="586" y2="200" stroke="#dc2626" stroke-width="3">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.28;0.7;0.74;1" dur="4s" repeatCount="indefinite"/></line>
<circle cx="560" cy="204" r="3.5" fill="#334155"/>
<text x="592" y="196" font-size="11" font-weight="bold" fill="#dc2626">下管（唯一开关）</text>
<line x1="560" y1="204" x2="560" y2="230" stroke="#334155" stroke-width="2.5"/>
<line x1="560" y1="230" x2="560" y2="244" stroke="#334155" stroke-width="2.5"/><line x1="544" y1="244" x2="576" y2="244" stroke="#334155" stroke-width="3"/><line x1="550" y1="250" x2="570" y2="250" stroke="#334155" stroke-width="3"/><line x1="556" y1="256" x2="564" y2="256" stroke="#334155" stroke-width="3"/>
<text x="480" y="270" font-size="11" fill="#475569">下管断开时：Rp 慢慢把总线「充」回高电平</text>
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.26;1" dur="4s" repeatCount="indefinite"/><circle r="5" fill="#b45309"><animateMotion dur="2.0s" begin="-0.50s" repeatCount="indefinite" path="M484,66 H556 V146 H696" keyPoints="0;0.55;0.82;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle>
<circle r="5" fill="#b45309"><animateMotion dur="2.0s" begin="0.17s" repeatCount="indefinite" path="M484,66 H556 V146 H696" keyPoints="0;0.55;0.82;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle>
<circle r="5" fill="#b45309"><animateMotion dur="2.0s" begin="0.83s" repeatCount="indefinite" path="M484,66 H556 V146 H696" keyPoints="0;0.55;0.82;1" keyTimes="0;0.2;0.5;1" calcMode="linear"/></circle></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.3;0.68;0.72;1" dur="4s" repeatCount="indefinite"/><circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="-0.50s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="-0.33s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="-0.17s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="0.17s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle>
<circle r="5" fill="#dc2626"><animateMotion dur="1.0s" begin="0.33s" repeatCount="indefinite" path="M696,146 H564 V236"/></circle></g>
<text x="64" y="316" font-size="11.5" font-weight="bold" fill="#059669">推挽沿：陡（ns 级）</text>
<path d="M80,380 V330 H180 V380" fill="none" stroke="#059669" stroke-width="3"/>
<line x1="80" y1="380" x2="270" y2="380" stroke="#64748b" stroke-width="1.5"/>
<text x="360" y="316" font-size="11.5" font-weight="bold" fill="#b45309">开漏沿：RC 缓升（上拉×总线电容）</text>
<path d="M380,380 L384,376 L389,373 L394,370 L398,367 L402,364 L407,362 L412,360 L416,357 L420,355 L425,354 L430,352 L434,350 L438,349 L443,347 L448,346 L452,345 L456,344 L461,343 L466,342 L470,341 L474,340 L479,340 L484,339 L488,338 L492,338 L497,337 L502,337 L506,336 L510,336 L515,335 L520,335 L524,335 L528,334 L533,334 L538,334 L542,333 L546,333 L551,333 L556,333 L560,332" fill="none" stroke="#b45309" stroke-width="3"/>
<line x1="380" y1="380" x2="580" y2="380" stroke="#64748b" stroke-width="1.5"/>
<text x="600" y="355" font-size="11" fill="#475569">I2C 上拉 2.2~4.7kΩ：阻小快但费电</text>
<text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 推挽输出高：上管合上，VDD 直推——又快又有劲（粒子密集）<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.24;1" dur="4s" repeatCount="indefinite"/></text><text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">② 开漏输出高：只能靠上拉电阻慢慢充电——沿是 RC 曲线（粒子稀疏）<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.28;0.46;0.5;1" dur="4s" repeatCount="indefinite"/></text><text x="400" y="410" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ 那为什么 I2C 还选开漏？——多设备共享总线时，两个推挽互怼=短路烧IO！<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="4s" repeatCount="indefinite"/></text><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="4s" repeatCount="indefinite"/>
<rect x="50" y="424" width="700" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="400" y="446" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">开漏+上拉=「线与」：任何一个设备都能拉低总线——仲裁、中断共享、电平转换全靠它</text>
</g></svg>
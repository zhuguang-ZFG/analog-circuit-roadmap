<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<title>光耦与隔离：CTR 是设计变量，不是常数</title>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="500" fill="url(#bgL)"/>
<rect width="800" height="500" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="500" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">光耦与隔离：CTR 是设计变量，不是常数</text>
<text x="400" y="53" text-anchor="middle" font-size="12" fill="#475569">信号能过，电流不能过：I_C = CTR × I_F</text>
<rect x="36" y="76" width="400" height="268" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<rect x="52" y="96" width="150" height="204" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="210" y="96" width="52" height="204" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="270" y="96" width="150" height="204" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="127" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#dc2626">输入侧</text>
<text x="345" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2563eb">输出侧</text>
<line x1="127" y1="142" x2="127" y2="166" stroke="#dc2626" stroke-width="2.5"/>
<polygon points="115,166 139,166 127,190" fill="#dc2626"/>
<line x1="115" y1="194" x2="139" y2="194" stroke="#dc2626" stroke-width="3.5"/>
<line x1="127" y1="194" x2="127" y2="216" stroke="#dc2626" stroke-width="2.5"/>
<text x="127" y="240" text-anchor="middle" font-size="11.5" fill="#334155">I_F = 4.5 mA</text>
<text x="127" y="260" text-anchor="middle" font-size="11" fill="#475569">V_F ≈ 1.2 V</text>
<text x="236" y="196" text-anchor="middle" font-size="11.5" fill="#1d4ed8">隔离栅</text>
<text x="236" y="216" text-anchor="middle" font-size="10" fill="#2563eb">kV 级</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M146,180 L300,180"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="2.50s" repeatCount="indefinite" path="M146,180 L300,180"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M146,180 L300,180"/></circle>
<circle r="4.5" fill="#f59e0b"><animateMotion dur="12s" begin="8.50s" repeatCount="indefinite" path="M146,180 L300,180"/></circle></g>
<rect x="311" y="146" width="68" height="52" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
<text x="345" y="170" text-anchor="middle" font-size="11.5" fill="#2563eb">光敏</text>
<text x="345" y="188" text-anchor="middle" font-size="11.5" fill="#2563eb">三极管</text>
<text x="345" y="234" text-anchor="middle" font-size="11.5" fill="#334155">I_C = CTR × I_F</text>
<text x="345" y="256" text-anchor="middle" font-size="11" fill="#475569">CTR 50% ~ 600%</text>
<text x="236" y="322" text-anchor="middle" font-size="11" fill="#334155">两个地之间没有欧姆通路：信号能过，电流不能过</text>
<rect x="452" y="76" width="312" height="268" rx="10" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.5" stroke-width="1.5"/>
<text x="608" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">CTR 的三个坑</text>
<line x1="468" y1="116" x2="748" y2="116" stroke="#b45309" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="468" y="144" font-size="11.5" fill="#334155">① 同一型号分档：50% ~ 600%</text>
<text x="468" y="170" font-size="11.5" fill="#334155">   设计按该档最小值算</text>
<text x="468" y="196" font-size="11.5" fill="#334155">② 随温度与时间衰减</text>
<text x="468" y="222" font-size="11.5" fill="#334155">   100℃ / 20mA 十年可能掉一半</text>
<text x="468" y="248" font-size="11.5" fill="#334155">③ I_F &lt; 1mA 时 CTR 明显下降</text>
<text x="468" y="274" font-size="11.5" fill="#334155">结论：最小值 × 2 倍老化余量</text>
<text x="468" y="300" font-size="11.5" fill="#334155">R_in 470Ω → I_F = 4.5 mA</text>
<g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
<rect x="70" y="366" width="660" height="34.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="76" y="373" width="3" height="20.0" rx="1.5" fill="#059669"/><text x="400" y="388.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">隔离侧电源必须来自隔离侧——借原边的地，隔离就白做了。</text>
</g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/><rect x="155.4" y="446.9" width="489.1" height="24.1" rx="12.0" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2563eb" opacity="0">① 隔离的本质：信号能过，电流不能过——两个地之间没有欧姆通路<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/><rect x="214.7" y="446.9" width="370.6" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">② 光耦 = LED + 光敏三极管，中间隔着 kV 级绝缘<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/><rect x="180.9" y="446.9" width="438.2" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">③ CTR 按档位最小值算：50% 与 600% 是同一型号的两个档<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/><rect x="132.1" y="446.9" width="535.8" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">④ 老化后 CTR 掉一半：R_in 从 1kΩ 改 470Ω，I_F 由 2.1mA 提到 4.5mA<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text></g>
</svg>
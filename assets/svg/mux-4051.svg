<text x="600" y="502" font-size="11.5" font-weight="bold" fill="#475569">选中的通道</text>
<text x="450" y="526" font-size="11" fill="#475569">0 0 0</text><text x="600" y="526" font-size="11" font-weight="bold" fill="#475569">Y0</text><text x="450" y="546" font-size="11" fill="#475569">0 0 1</text><text x="600" y="546" font-size="11" font-weight="bold" fill="#475569">Y1</text><text x="450" y="566" font-size="11" fill="#475569">0 1 0</text><text x="600" y="566" font-size="11" font-weight="bold" fill="#475569">Y2</text><text x="450" y="586" font-size="11" fill="#475569">0 1 1</text><text x="600" y="586" font-size="11" font-weight="bold" fill="#475569">Y3</text><text x="450" y="606" font-size="11" fill="#475569">1 0 0</text><text x="600" y="606" font-size="11" font-weight="bold" fill="#475569">Y4</text><text x="450" y="626" font-size="11" fill="#059669">1 0 1</text><text x="600" y="626" font-size="11" font-weight="bold" fill="#059669">Y5</text><text x="640" y="626" font-size="10.5" fill="#059669">← 本例选中（接热敏电阻）</text><text x="450" y="646" font-size="11" fill="#475569">1 1 0</text><text x="600" y="646" font-size="11" font-weight="bold" fill="#475569">Y6</text><text x="450" y="666" font-size="11" fill="#475569">1 1 1</text><text x="600" y="666" font-size="11" font-weight="bold" fill="#475569">Y7</text>

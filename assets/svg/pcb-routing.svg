<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="ttl">
<title id="ttl">PCB 布线四招：每一条规则背后都有物理</title>
<desc>PCB 布线四招：每一条规则背后都有物理；节拍：口诀：45° 拐角、少打过孔、差分等长紧邻、敏感线包地——四条都源自「电感与耦合」</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f8"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#141d30"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.065"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#2563eb" stop-opacity="0.030"/>
<stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#60a5fa" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.040"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1.5" cy="1.5" r="1.05" fill="#cbd5e1"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.6" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.17"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="2.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="800" height="560" fill="url(#bgL)"/>
<rect width="800" height="560" fill="url(#dots)" opacity="0.40"/>
<rect class="page-vig" width="800" height="560" fill="url(#vig)"/>
<rect class="page-hdr" width="800" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.page-bg{fill:url(#bgL)}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
rect[fill="#f8fafc"],rect[fill="#eff6ff"],rect[fill="#ecfdf5"],rect[fill="#fffbeb"],rect[fill="#fef2f2"],rect[fill="#dbeafe"]{filter:url(#soft)}
/* 浅色下的「弱化色」文字偏淡（#94a3b8 在白底只有 2.6:1）→ 只压暗文字，不动同色的线/粒子 */
@media (prefers-color-scheme: light){
text[fill="#94a3b8"],tspan[fill="#94a3b8"]{fill:#64748b}
text[fill="#0ea5e9"],tspan[fill="#0ea5e9"]{fill:#0284c7}
text[fill="#f59e0b"],tspan[fill="#f59e0b"]{fill:#b45309}
}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-vig{opacity:0.45}
.page-hdr{fill:url(#hdrD)}
[fill="#f8fafc"]{fill:#0f172a}
[fill="#f1f5f9"]{fill:#1e293b}[fill="#e0f2fe"]{fill:#082f49}[fill="#fff7ed"]{fill:#431407}
[fill="#d1fae5"]{fill:#022c22}[fill="#fee2e2"]{fill:#450a0a}
[fill="#1e293b"]{fill:#f1f5f9}[stroke="#1e293b"]{stroke:#f1f5f9}
[fill="#334155"]{fill:#e2e8f0}[stroke="#334155"]{stroke:#e2e8f0}
[fill="#475569"]{fill:#cbd5e1}[stroke="#475569"]{stroke:#cbd5e1}
[fill="#64748b"]{fill:#94a3b8}[stroke="#64748b"]{stroke:#94a3b8}
[fill="#dbeafe"]{fill:#1e3a8a}[fill="#eff6ff"]{fill:#172554}
[fill="#1d4ed8"]{fill:#60a5fa}[fill="#2563eb"]{fill:#60a5fa}[fill="#3b82f6"]{fill:#60a5fa}
[fill="#ecfdf5"]{fill:#022c22}[fill="#059669"]{fill:#34d399}[fill="#065f46"]{fill:#6ee7b7}[fill="#10b981"]{fill:#34d399}
[fill="#34d399"]{fill:#065f46}
[fill="#fffbeb"]{fill:#451a03}[fill="#b45309"]{fill:#fcd34d}[fill="#92400e"]{fill:#fcd34d}[fill="#f59e0b"]{fill:#fbbf24}
[fill="#fef2f2"]{fill:#450a0a}[fill="#dc2626"]{fill:#f87171}[fill="#991b1b"]{fill:#fca5a5}
[fill="#cbd5e1"]{fill:#334155}[stroke="#cbd5e1"]{stroke:#475569}
[fill="#ffffff"]{fill:#0f172a}[fill="#94a3b8"]{fill:#8497ad}[stroke="#94a3b8"]{stroke:#64748b}
[fill="#7c3aed"]{fill:#a78bfa}[stroke="#7c3aed"]{stroke:#a78bfa}
[fill="#b91c1c"]{fill:#f87171}[stroke="#b91c1c"]{stroke:#f87171}
[fill="#0369a1"]{fill:#7dd3fc}[stroke="#0369a1"]{stroke:#7dd3fc}
[fill="#0284c7"]{fill:#7dd3fc}[stroke="#0284c7"]{stroke:#7dd3fc}
text[fill="#fff"]{fill:#0f172a}
}
</style>
<text x="400" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">PCB 布线四招：每一条规则背后都有物理</text>

<text x="400" y="46" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">同样的网络，画法不同，高频行为就不同</text>
<!-- 1: 45 度拐角 -->
<text x="210" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">① 拐角：用 45°，不用 90°</text>
<path d="M70,150 H160 V220" fill="none" stroke="#dc2626" stroke-width="7" stroke-linejoin="miter"/>
<text x="70" y="140" font-size="10.5" font-weight="bold" fill="#dc2626">90° 尖角</text>
<text x="120" y="244" font-size="10" fill="#475569">蚀刻不均、高频反射</text>
<path d="M250,150 H320 L370,200 V240" fill="none" stroke="#059669" stroke-width="7" stroke-linejoin="round"/>
<text x="250" y="140" font-size="10.5" font-weight="bold" fill="#059669">45° 折角</text>
<text x="300" y="264" font-size="10" fill="#475569">线宽连续、阻抗平顺</text>
<!-- 2: 过孔寄生 -->
<text x="610" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">② 过孔：1nH + 0.5pF / 个</text>
<line x1="500" y1="140" x2="700" y2="140" stroke="#2563eb" stroke-width="7"/>
<circle cx="600" cy="140" r="11" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<circle cx="600" cy="140" r="5" fill="#94a3b8"/>
<line x1="500" y1="220" x2="700" y2="220" stroke="#059669" stroke-width="7"/>
<line x1="600" y1="151" x2="600" y2="220" stroke="#334155" stroke-width="2.5" stroke-dasharray="5,4"/>
<text x="616" y="188" font-size="11" font-weight="bold" fill="#dc2626">L≈1nH · C≈0.5pF</text>
<text x="600" y="250" text-anchor="middle" font-size="10" fill="#475569">高速/大电流少打孔；电源过孔打多个并联</text>
<!-- 3: 差分对 -->
<text x="210" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">③ 差分对：等长 · 等距 · 紧邻</text>
<path d="M70,370 H200 L250,420 H350" fill="none" stroke="#7c3aed" stroke-width="5"/>
<path d="M70,398 H200 L250,448 H350" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="230" y="360" font-size="10" fill="#475569">间距恒定 → 差分阻抗恒定</text>
<text x="210" y="480" text-anchor="middle" font-size="10" fill="#475569">等长保证两线同时到达；紧邻让共模干扰同相抵消</text>
<!-- 4: 敏感线包地 -->
<text x="610" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">④ 敏感线：远离时钟，必要时包地</text>
<path d="M470,358 H540 L560,378 H700" fill="none" stroke="#dc2626" stroke-width="5"/>
<text x="470" y="348" font-size="10" font-weight="bold" fill="#dc2626">时钟 / 开关节点</text>
<path d="M470,396 H700" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
<path d="M470,440 H700" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4"/>
<path d="M470,418 H700" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="470" y="412" font-size="10" font-weight="bold" fill="#2563eb">敏感模拟线（两侧包地）</text>
<text x="610" y="490" text-anchor="middle" font-size="10" fill="#475569">平行走线越长、越近，串扰越大——包地是「屏蔽墙」</text>
<g filter="url(#pglow)"><circle r="4.5" fill="#dc2626"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M472,358 H538 L558,378 H698"/></circle>
<circle r="4.5" fill="#dc2626"><animateMotion dur="12s" begin="3.50s" repeatCount="indefinite" path="M472,358 H538 L558,378 H698"/></circle>
<circle r="4.5" fill="#dc2626"><animateMotion dur="12s" begin="7.50s" repeatCount="indefinite" path="M472,358 H538 L558,378 H698"/></circle></g>
<g filter="url(#pglow)"><circle r="4.5" fill="#2563eb"><animateMotion dur="12s" begin="-0.50s" repeatCount="indefinite" path="M472,418 H698"/></circle>
<circle r="4.5" fill="#2563eb"><animateMotion dur="12s" begin="2.50s" repeatCount="indefinite" path="M472,418 H698"/></circle>
<circle r="4.5" fill="#2563eb"><animateMotion dur="12s" begin="5.50s" repeatCount="indefinite" path="M472,418 H698"/></circle>
<circle r="4.5" fill="#2563eb"><animateMotion dur="12s" begin="8.50s" repeatCount="indefinite" path="M472,418 H698"/></circle></g>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.8;0.86;1" dur="12s" repeatCount="indefinite"/><rect x="116.2" y="522.3" width="567.6" height="21.6" rx="10.8" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb" opacity="0">口诀：45° 拐角、少打过孔、差分等长紧邻、敏感线包地——四条都源自「电感与耦合」<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="12s" repeatCount="indefinite"/></text></g></svg>
</circle><circle cx="0" cy="430.000" r="4.2" fill="#7c3aed">
<animate attributeName="cy" values="430.000;430.000;452.000;452.000" keyTimes="0.000000000;0.400000000;0.400000000;1.000000000" calcMode="linear" dur="12s" repeatCount="indefinite"/>
</circle></g><text class="waveform-phase" x="400" y="501" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669" opacity="1">采样：EN 高，V_C 跟随输入；竖游标上的两点是同一时刻
<animate attributeName="opacity" values="1;0;0" keyTimes="0.000000000;0.400000000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text><text class="waveform-phase" x="400" y="501" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626" opacity="0">保持：EN 变低时注入 10mV 台阶，之后缓慢下垂（未补偿）
<animate attributeName="opacity" values="0;1;1" keyTimes="0.000000000;0.400000000;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<rect x="22" y="515" width="756" height="87" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="540" font-size="12" font-weight="bold" fill="#2563eb">🧮 四拍账本：精度与速度，在模拟开关这一级就定死了</text>
<text x="40" y="563" font-size="11" fill="#475569">Q_ch = C_ox·W·L·(V_GS−V_TH) ≈ 0.2pC（随信号电压变化）；ΔV = Q_ch/2C_h = 0.2pC/(2×10pF) = 10mV</text>
<text x="40" y="585" font-size="11" fill="#475569">12 位 / 2.048V：1 LSB = 500µV → 10mV = 20 个 LSB！加大 C_h 到 100pF 使 ΔV→1mV，代价 τ=R_on·C_h 长 10 倍</text>
<text x="40" y="597" font-size="10.5" font-weight="bold" fill="#dc2626">对策：dummy 半尺寸管反向注入 / 加大 C_h 摊薄 / 差分结构两侧等量相消</text>
<g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.84;0.89;1" dur="12s" repeatCount="indefinite"/><rect x="150.7" y="638.1" width="498.6" height="21.9" rx="11.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.89;1" dur="12s" repeatCount="indefinite"/></rect><text x="400" y="650" text-anchor="middle" font-size="13.2" font-weight="bold" fill="#7c3aed" opacity="0">四拍因果链：栅极驱动开启 → 沟道存电荷 → 关断注入 C_h → dummy 管抵消<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.89;1" dur="12s" repeatCount="indefinite"/></text></g></svg>
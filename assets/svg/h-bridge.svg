<circle r="5" fill="#7c3aed"><animateMotion dur="7s" begin="3.00s" repeatCount="indefinite" path="M378,210 H422"/></circle></g></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.02;0.3;0.36;1" dur="7s" repeatCount="indefinite"/><rect x="123.5" y="410.9" width="552.9" height="24.1" rx="12.0" fill="#059669" fill-opacity="0.09" stroke="#059669" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.3;0.36;1" dur="7s" repeatCount="indefinite"/></rect><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#059669" opacity="0">① 正转：A=1 → Q1+Q4 导通，电流 +12V→Q1→电机→Q4→GND——M 右转<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.3;0.36;1" dur="7s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.36;0.42;0.68;0.74;1" dur="7s" repeatCount="indefinite"/><rect x="140.5" y="410.9" width="519.0" height="24.1" rx="12.0" fill="#dc2626" fill-opacity="0.09" stroke="#dc2626" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.68;0.74;1" dur="7s" repeatCount="indefinite"/></rect><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#dc2626" opacity="0">② 反转：B=1 → Q2+Q3 导通，电流整体掉头——换电机两根线就这么干<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.68;0.74;1" dur="7s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0;0 6.0;0 6.0" keyTimes="0;0.54;0.6;0.78;0.84;1" dur="7s" repeatCount="indefinite"/><rect x="112.4" y="410.9" width="575.2" height="24.1" rx="12.0" fill="#b45309" fill-opacity="0.09" stroke="#b45309" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.6;0.78;0.84;1" dur="7s" repeatCount="indefinite"/></rect><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b45309" opacity="0">③ 致命错误：同臂齐开 = +12V 直通 GND，毫秒级烧管——换向必须死区 1~2µs<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.6;0.78;0.84;1" dur="7s" repeatCount="indefinite"/></text></g><g><animateTransform attributeName="transform" type="translate" values="0 6.0;0 6.0;0 0.0;0 0.0" keyTimes="0;0.84;0.9;1" dur="7s" repeatCount="indefinite"/><rect x="110.0" y="410.9" width="580.0" height="24.1" rx="12.0" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed" stroke-opacity="0.38" stroke-width="1.3" filter="url(#soft)" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="7s" repeatCount="indefinite"/></rect><text x="400" y="424" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7c3aed" opacity="0">④ 全关滑行：电感电流没处去，体二极管搭桥流回电源——动能回收，这就是刹车<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.84;0.9;1" dur="7s" repeatCount="indefinite"/></text></g><g opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="7s" repeatCount="indefinite"/>
<rect x="50" y="428" width="700" height="52.0" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#soft)"/><rect x="56" y="435" width="3" height="38.0" rx="1.5" fill="#059669"/><text x="400" y="450.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">四个开关两个状态位——这就是 H 桥。驱动芯片（DRV8833/L298）把死区、自举、</text><text x="400" y="468.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#059669">过流保护全打包；高侧管源极悬在电机电压上，要靠自举电容「举」着栅极才开得动。</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="1000" height="700" fill="url(#bgL)"/>
<rect class="page-grain" width="1000" height="700" fill="url(#dots)"/>
<rect class="page-vig" width="1000" height="700" fill="url(#vig)"/>
<rect class="page-hdr" width="1000" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">LDO 的稳定区，写在一段 ESR 窗口里</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">老式 NPN 准 LDO 要 0.3–22 Ω；全贴 MLCC 的 5 mΩ 反而振荡。</text>
<path d="M80 410 Q500.00 410.59 920 410" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<rect x="300" y="285" width="350" height="120" rx="10" fill="#e2ebe0" stroke="#3d6b4a" stroke-width="2"/>
<text x="475" y="332" font-size="26" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">稳定区 0.3–22 Ω</text>
<text x="475" y="366" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">ESR 造出环路零点</text>
<text x="190" y="332" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">5 mΩ MLCC</text>
<text x="190" y="366" font-size="22" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">零点太远 → 振荡</text>
<text x="790" y="332" font-size="24" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">&gt;22 Ω</text>
<text x="790" y="366" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">零点太近 → 响应慢</text>
<rect x="50" y="430" width="430" height="120" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="74" y="472" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">10 µF 钽电容</text>
<text x="74" y="506" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">是补偿的一部分，不是随便换</text>
<rect x="520" y="430" width="430" height="120" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="544" y="472" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">10 µF MLCC</text>
<text x="544" y="506" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">换之前先查手册的 ESR 窗口</text>
<rect x="50" y="570" width="900" height="60" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="74" y="610" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">容量一样，不等于环路还稳；ESR 才是藏起来的参数。</text>
</svg>

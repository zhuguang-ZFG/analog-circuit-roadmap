<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">10pF 跨在增益两端，变成 1nF</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">Ceff = (1+A)Cbc；A=100 时 10pF 变 1.01nF，10kΩ 源阻抗把带宽压到 15.8kHz。</text>
<rect x="50" y="150" width="430" height="270" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="74" y="192" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">跨接电容被增益撬动</text>
<path d="M100 250 Q166.00 250.13 232 250" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M258 250 Q339.00 249.85 420 250" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M238 220 Q238.13 250.00 238 280" fill="none" stroke="#1f5d7a" stroke-width="4"/>
<path d="M252 220 Q252.19 250.00 252 280" fill="none" stroke="#1f5d7a" stroke-width="4"/>
<text x="350" y="215" font-size="22" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">Cbc 10pF</text>
<text x="100" y="290" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">输入</text>
<text x="420" y="290" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">输出</text>
<text x="245" y="330" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">A = 100</text>
<text x="245" y="378" font-size="38" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">× (1+A)</text>
<text x="245" y="410" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">10pF → 1.01nF</text>
<rect x="520" y="150" width="430" height="270" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="544" y="192" font-size="24" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">带宽收据</text>
<path d="M570 380 Q745.00 381.40 920 380" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M570 380 Q569.39 295.00 570 210" fill="none" stroke="#37424e" stroke-width="2.5"/>
<path d="M580,220 L700,224 C760,226 780,250 810,300 C830,334 850,355 900,366" fill="none" stroke="#3d6b4a" stroke-width="4"/>
<path d="M790 380 Q790.04 327.50 790 275" fill="none" stroke="#a4630f" stroke-width="2" stroke-dasharray="6,5"/>
<text x="790" y="405" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">15.8kHz</text>
<text x="700" y="245" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">−3dB</text>
<text x="544" y="410" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">10kΩ × 1.01nF</text>
<rect x="50" y="450" width="900" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="76" y="490" font-size="24" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">你以为能放到 MHz；16kHz 就开始滚降。</text>
<text x="76" y="524" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">共基把 Cbc 一端接地，拆掉米勒桥；代价是输入阻抗只剩 re。</text>
<text x="500" y="620" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">增益越高，米勒电容越大；带宽是借来的，要还。</text>
</svg>

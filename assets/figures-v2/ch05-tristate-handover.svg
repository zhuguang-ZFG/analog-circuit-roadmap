<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" data-composition="python-handraw-v1" role="img" aria-labelledby="title desc">
<title id="title">三态总线的交接时序</title><desc id="desc">手绘三段时间轴：驱动器 A 释放进入高阻，空档 tDIS 为 10 到 30 纳秒，驱动器 B 使能开始驱动；下方写重叠 10 纳秒会让两个驱动器同时开口，产生微秒级电流尖峰。底部写先撤销 OE 再转身后开口。</desc>
<defs>
<linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f6eedb"/>
</linearGradient>
<linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#141310"/><stop offset="1" stop-color="#1d1a14"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.78">
<stop offset="0.55" stop-color="#16202b" stop-opacity="0"/>
<stop offset="1" stop-color="#16202b" stop-opacity="0.055"/>
</radialGradient>
<linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a4630f" stop-opacity="0.10"/>
<stop offset="0.55" stop-color="#a4630f" stop-opacity="0.028"/>
<stop offset="1" stop-color="#a4630f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="hdrD" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dcab63" stop-opacity="0.13"/>
<stop offset="0.55" stop-color="#dcab63" stop-opacity="0.04"/>
<stop offset="1" stop-color="#dcab63" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="2.5" cy="3.5" r="0.9" fill="#c9bb9d"/>
<circle cx="19" cy="11" r="0.55" fill="#c9bb9d" opacity="0.7"/>
<circle cx="11.5" cy="22" r="0.6" fill="#c9bb9d" opacity="0.55"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="1.4" stdDeviation="2" flood-color="#16202b" flood-opacity="0.13"/>
</filter>
<filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="1.7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect class="page-bg" width="1000" height="700" fill="url(#bgL)"/>
<rect class="page-grain" width="1000" height="700" fill="url(#dots)"/>
<rect class="page-vig" width="1000" height="700" fill="url(#vig)"/>
<rect class="page-hdr" width="1000" height="72" fill="url(#hdr)"/>
<style>
text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",sans-serif;}
line,path,polyline,polygon{stroke-linecap:round;stroke-linejoin:round}
.page-bg{fill:url(#bgL)}
.page-grain{opacity:.5}
.page-vig{opacity:1}
.page-hdr{fill:url(#hdr)}
@media (prefers-color-scheme: dark){
.page-bg{fill:url(#bgD)}
.page-grain{opacity:.34}
.page-vig{opacity:.5}
.page-hdr{fill:url(#hdrD)}
[fill="#fdf8ea"]{fill:#141310}
[stroke="#fdf8ea"]{stroke:#141310}
[fill="#f6eedb"]{fill:#1d1a14}
[stroke="#f6eedb"]{stroke:#1d1a14}
[fill="#e0d3b8"]{fill:#3b3529}
[stroke="#e0d3b8"]{stroke:#3b3529}
[fill="#c9bb9d"]{fill:#4a4436}
[stroke="#c9bb9d"]{stroke:#4a4436}
[fill="#16202b"]{fill:#ece4d3}
[stroke="#16202b"]{stroke:#ece4d3}
[fill="#37424e"]{fill:#cfc6b4}
[stroke="#37424e"]{stroke:#cfc6b4}
[fill="#5b666f"]{fill:#a79e8b}
[stroke="#5b666f"]{stroke:#a79e8b}
[fill="#8b8272"]{fill:#857c6c}
[stroke="#8b8272"]{stroke:#857c6c}
text[fill="#fdf8ea"]{fill:#f9f3e3}
[fill="#e6eff3"]{fill:#17262e}
[fill="#e4f1f3"]{fill:#15262a}
[fill="#e8efe6"]{fill:#182418}
[fill="#f6e7e1"]{fill:#281a16}
[fill="#f7eedb"]{fill:#292114}
[fill="#efe8ee"]{fill:#241c22}
text[fill="#1f5d7a"]{fill:#7fb7cf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#1f5d7a"]{fill:#2b4d5f}
[stroke="#1f5d7a"]{stroke:#6fa3b9}
text[fill="#2f7f96"]{fill:#8ac9d8}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#2f7f96"]{fill:#2b5660}
[stroke="#2f7f96"]{stroke:#77b2c1}
text[fill="#3d6b4a"]{fill:#98c096}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#3d6b4a"]{fill:#2f4a33}
[stroke="#3d6b4a"]{stroke:#7aa87c}
text[fill="#a8321f"]{fill:#e0907a}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a8321f"]{fill:#55231b}
[stroke="#a8321f"]{stroke:#c07a63}
text[fill="#a4630f"]{fill:#dcab63}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#a4630f"]{fill:#553a17}
[stroke="#a4630f"]{stroke:#c08a45}
text[fill="#6b3f63"]{fill:#c4a2bf}
:is(rect,circle,path,line,polygon,polyline,ellipse,g)[fill="#6b3f63"]{fill:#452c40}
[stroke="#6b3f63"]{stroke:#a17c9b}
}
</style>

<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">三态交接：先闭嘴，再转身，后开口</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">释放到高阻要 tDIS，使能要 tEN；窗口重叠 10 ns 就是一次微型对撞。</text>
<rect x="60" y="220" width="260" height="110" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="80" y="264" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">驱动器 A</text>
<text x="80" y="300" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">释放 / 进入高阻</text>
<rect x="340" y="220" width="300" height="110" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="360" y="264" font-size="23" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">空档：tDIS 10–30 ns</text>
<text x="360" y="300" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">没人驱动，总线靠电容保持</text>
<rect x="660" y="220" width="280" height="110" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="680" y="264" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">驱动器 B</text>
<text x="680" y="300" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">使能 / 开始驱动</text>
<line x1="324" y1="275" x2="336" y2="275" stroke="#37424e" stroke-width="2.5" stroke-linecap="round"/><polygon points="336,275 326,270 326,280" fill="#37424e"/>
<line x1="644" y1="275" x2="656" y2="275" stroke="#37424e" stroke-width="2.5" stroke-linecap="round"/><polygon points="656,275 646,270 646,280" fill="#37424e"/>
<rect x="60" y="390" width="880" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="84" y="432" font-size="23" fill="#a8321f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">重叠 10 ns：A 还没退，B 已开口</text>
<text x="84" y="464" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">结果不是“晚一点”，而是一串微秒级电流尖峰。</text>
<rect x="60" y="530" width="880" height="76" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="84" y="578" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">示波器开余辉，看总线低电平上有没有叠出来的细毛刺。</text>
<text x="500" y="650" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">先撤销 OE，再转身，后开口。</text>
</svg>

<text x="52" y="58" font-size="38" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">上拉电阻是一道合围题</text><text x="52" y="94" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">3.3 V / 100 pF / 快速模式：窗口 967 Ω 到 3.5 kΩ，取中间 2.2k。</text>
<rect x="50" y="140" width="430" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="74" y="178" font-size="22" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">驱动下限</text>
<text x="74" y="214" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">R ≥ (3.3−0.4)/3 mA = 967 Ω</text>
<rect x="520" y="140" width="430" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="544" y="178" font-size="22" fill="#1f5d7a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">速度上限</text>
<text x="544" y="214" font-size="22" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">R ≤ 300 ns/(0.8473×100 pF) = 3.5 kΩ</text>
<rect x="220" y="300" width="540" height="34" rx="8" fill="#e2ebe0" stroke="#3d6b4a" stroke-width="2"/>
<path d="M100 317 Q500.00 316.84 900 317" fill="none" stroke="#c9bb9d" stroke-width="2"/>
<path d="M220 288 Q219.94 317.00 220 346" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="220" y="278" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">967 Ω</text>
<path d="M500 288 Q499.99 317.00 500 346" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="500" y="278" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">2.2k</text>
<path d="M760 288 Q759.87 317.00 760 346" fill="none" stroke="#37424e" stroke-width="2"/>
<text x="760" y="278" font-size="24" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">3.5 kΩ</text>
<text x="500" y="380" font-size="23" fill="#3d6b4a" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="middle">实板常用 2.2k：两头都留余量</text>
<text x="500" y="424" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">99kΩ 漏电上限在这条总线上不卡</text>
<rect x="50" y="480" width="900" height="100" rx="6" fill="#f6eedb" stroke="#37424e" stroke-width="2"/>
<text x="76" y="522" font-size="23" fill="#16202b" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="700" text-anchor="start">任何一条约束变了，先重跑这道围合，再动电阻。</text>
<text x="76" y="556" font-size="22" fill="#37424e" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="start">总线电容、模式等级、器件数量，都会改写窗口。</text>
<text x="500" y="650" font-size="22" fill="#a4630f" font-family="'KaiTi','STKaiti','Kaiti SC','LXGW WenKai','Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun','Noto Serif SC',serif" font-weight="400" text-anchor="middle">先算窗口，再选阻值；2.2k 是结果，不是口诀。</text>
</svg>

- id: ch01-thevenin-two-load
  source: docs/p1-02-ch1.md#1.4
  before: '**教学示例（两负载法实测内阻）**：某传感器信号源开路电压 2.52V；接 100kΩ 负载读 2.40V，接 10kΩ 负载读 1.80V。由第一组：$R_s=100\,\text{k}\Omega\times(2.52-2.40)/2.40=5\,\text{k}\Omega$；用第二组校验：$10\,\text{k}\Omega\times0.72/1.80=4\,\text{k}\Omega$。两组算出的内阻不一致，说明这个端口不是纯线性——可能含偏置电流或保护二极管——**戴维南的"两个数"在这里已经装不下它**。这正是本节末尾那条边界的现身说法：等效之前，先确认网络真的线性。'
  after: '**教学示例（两负载法实测内阻）**：接两个已知负载量电压跌落，分别反推内阻（下图红框）。两组结果不一致，说明端口含偏置电流或保护二极管——**戴维南的"两个数"装不下它**：等效之前，先确认网络真的线性。'
  caption: 戴维南：把任何线性网络压成两个数。带不带得动，永远只需比内阻与负载两个数。但等效之前，先确认网络真的线性
  removed_prose_chars: 188
  relationship: replaces-text
- id: ch01-q-selectivity-map
  source: docs/p1-02-ch1.md#1.5
  before: 选频的"窄缝"有多窄，也用数字说话：中波收音机载波约 1MHz、音频带宽约 5kHz，需要的 Q 在 100 上下，LC 刚好胜任；FM 收音机载波约 100MHz、信号带宽约 150kHz，Q
    只要个位数。但 $f_0$ 的稳定性要求苛刻——这就是调谐电容要做成精密空气介质的原因。Q 与 $f_0$ 是一对联体指标：**频率越高，做出高 Q 越难**，因为元件损耗与寄生都随频率一起涨。到了
    GHz 级，分立 LC 的 Q 撑死几十，选频就交给声表面波、介质谐振器这些专物专用的器件了。
  after: 按 $Q=f_0/BW$：载波 1MHz、半功率带宽 5kHz 得 Q=200；100MHz、150kHz 得 Q≈667。这是给定带宽下单谐振回路的算例，不能直接代替实际接收机的多级选频设计。但
    $f_0$ 的稳定性要求苛刻——这就是调谐电容要做成精密空气介质的原因。到了 GHz 级，分立 LC 的 Q 撑死几十，选频就交给声表面波、介质谐振器这些专物专用的器件了。
  caption: Q 是挑频率的锐度，不是越高越好。Q 高不等于更好：选台要尖，电源滤波要钝，两头差两个数量级
  removed_prose_chars: 51
  relationship: replaces-text
- id: ch01-derating-product
  source: docs/p1-02-ch1.md#1.7
  before: 温度特性与老化也要进预算，别只算偏压一项。X7R 的 ±15% 是**全温范围内的总窗口**，高低温两头各占一半；II 类陶瓷还有**老化**：极化随时间缓慢退火，容值每十倍时程跌约
    1%~2%（典型值，Y5V 更高）。回流焊的高温会把老化时钟"归零"，重新计时。一只 10µF X5R 在 85°C 机内、带 3.3V 偏压、服役三年，有效容值 = 标称 × 温度保持率 × 偏压保持率
    × 老化保持率。三项各打八折，就只剩一半上下：**最坏情况预算是乘法，不是加法**。这就是"标称 10µF 按 5µF 设计"这类工程惯例的来源：不是悲观，是把乘法提前算好。
  after: 温度与老化也要进预算，别只算偏压一项：有效容值 = 标称 × 温度保持率 × 偏压保持率 × 老化保持率，三项各打八折只剩一半上下（降容预算图右栏；老化率是典型值，Y5V 更高）。"标称
    10µF 按 5µF 设计"不是悲观，是把乘法提前算好。
  caption: 最坏情况预算是乘法，不是加法。标称容量有测试条件；温度、偏压、老化三项各打八折，只剩一半上下
  removed_prose_chars: 148
  relationship: replaces-text
- id: ch01-electrolytic-life
  source: docs/p1-02-ch1.md#1.7
  before: 铝电解另有一条纹波电流的账：datasheet 给的纹波电流额定值，本质是 **ESR 发热的许可**。纹波电流 $I_{rms}$ 在 ESR 上发热 $I_{rms}^2\times
    ESR$，这份热直接计入上面寿命公式里的 $T$；纹波电流超额 30%，芯温可能升高 5~10°C，寿命当场腰斩。所以开关电源输出电容的选型顺序是：先按纹波电流与温升选系列，再按容量与偏压选值。**顺序反了，电容会先被自己的
    ESR 煮熟**。
  after: 铝电解另有一条纹波电流的账：datasheet 给的纹波电流额定值，本质是 **ESR 发热的许可**，$I_{rms}^2\times ESR$ 这份热直接进寿命公式的温度项（下图右栏）。选型顺序因此是：先按纹波电流与温升选系列，再按容量与偏压选值。
  caption: 10°C 翻倍法则：2000 小时能变 3.7 年。厂商给的是 L0 小时 @ T0；降温一档翻一倍，纹波发热反着吃回去
  removed_prose_chars: 81
  relationship: replaces-text

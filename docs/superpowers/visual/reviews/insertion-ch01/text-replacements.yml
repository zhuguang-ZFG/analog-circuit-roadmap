- id: ch01-e24-ladder
  source: docs/p1-02-ch1.md#1.1
  before: 顺手把"怪阻值"也解释了：货架上的 4.7k、2.21k 不是拍脑袋，来自 E24/E96 系列。E24 每个十倍频程分 24 档、相邻档比约 1.1，与 ±5% 容差对齐，任何真实阻值都能落进某一档的误差窗内；E96
    对应 ±1%。
  after: 顺手把"怪阻值"也解释了：货架上的 4.7k、2.21k 不是拍脑袋，来自 E24/E96 系列——等比档位配容差窗，任何真实阻值都有档可落（下图）。

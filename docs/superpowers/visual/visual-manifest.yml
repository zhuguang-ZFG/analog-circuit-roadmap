    2/3 Vcc，比较器 A 翻转，触发器复位、放电管导通。右红框「落下限：松手」：电容降到 1/3 Vcc，比较器 B 翻转，触发器置位、放电管截止。琥珀框写所以占空比永远大于 50%：充电走 R1
    加 R2、放电只走 R2，进得慢出得快；R1 只出现在充电支路，所以这个比值压不到 50%。底部写触发器只锁状态、不产生振荡，秋千自己会停，能量一路向电源讨。

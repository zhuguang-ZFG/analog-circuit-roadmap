  alt: 手绘 741 四级框图。左侧四块：差分输入级是长尾对加电流镜负载，决定失调电压、偏置电流与输入阻抗；中间增益级是共射放大加密勒补偿，开环增益约 200,000 倍；输出级是互补推挽加 AB

name: tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  svg-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -B -m unittest discover -s scripts -p test_svg_assets.py -v
      - run: python -B -m unittest discover -s scripts -p test_readme_links.py -v
      - name: 无障碍静态护栏（role/desc/alt/减弱动效块）
        run: python -B -m unittest discover -s scripts -p test_a11y.py -v

  docs-sync:
    name: docs 单一数据源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: docs/ ↔ README.md 同步 + 跨页锚点可达
        run: python -B -m unittest discover -s scripts -p test_docs_sync.py -v
      - run: python -B -m unittest discover -s scripts -p test_docs_links.py -v
      - run: python -B -m unittest discover -s scripts -p test_split_readme.py -v
      - name: 标题层级归一 + 提示卡切分（站点产物的两处正文结构变换）
        run: python -B -m unittest discover -s scripts -p test_page_structure.py -v

  lab-simulations:
    name: 实验包 SPICE 仿真与可重建性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: python -B -m unittest discover -s scripts -p test_lab_packages.py -v
      - run: python -B -m unittest discover -s scripts -p test_circuit_examples.py -v

  site-build:
    name: 站点可构建性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -B -m unittest discover -s scripts -p test_release_gate.py -v
      - name: 站点源自洽性（画廊卡片/章节筛选/导航/侧栏去重/SEO/共建页脚/标题层级/提示卡/JSON-LD）
        run: python -B -m unittest discover -s scripts -p test_site_build.py -v
      - name: smartsymbols 护栏（斜杠区间不会被排成分数）
        run: python -B -m unittest discover -s scripts -p test_smartsymbols.py -v
      - run: python scripts/build_site.py --build

  svg-render:
    name: SVG 渲染回归（时间轴 + 版面几何 + 明暗对比度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pillow 是 test_home_hero.py 用的：它按 WCAG 量首页 hero 上 chip / eyebrow
      # 的对比度，需要把截图解成像素（众数色当底、离底最远的像素当字芯）。
      - run: pip install -r requirements.txt playwright Pillow
      - name: Reading routes, old bookmarks, mobile layout and search
        run: python -B -m unittest discover -s scripts -p test_reading_journey.py -v
      - name: Gallery keyboard, modal focus and shareable filters
        run: python -B -m unittest discover -s scripts -p test_gallery_interactions.py -v
      - name: Lesson controls, video loading and mobile layout
        run: python -B -m unittest discover -s scripts -p test_learning_interactions.py -v
      - name: 时间轴（波形游标按时间匀速推进）
        run: python -B -m unittest discover -s scripts -p test_waveform_timing.py -v
      - name: 版面几何（内容出界 / 字幕压字 / 注释框溢出 / 文字被裁 / 静态压字 / 文字被盖）
        run: python -B -m unittest discover -s scripts -p test_svg_layout.py -v
      - name: 明暗两套主题的文字对比度（light + dark 均须 ≥ 3.0）
        run: python -B -m unittest discover -s scripts -p test_svg_contrast.py -v
      - name: 减弱动效（<picture> 选源正确、静止版粒子全停、字幕不误伤）
        run: python -B -m unittest discover -s scripts -p test_reduced_motion.py -v
      - name: 首页 hero 视觉（皮肤生效 / 文字对比度 ≥4.5 / chip 不换行）
        run: python -B -m unittest discover -s scripts -p test_home_hero.py -v

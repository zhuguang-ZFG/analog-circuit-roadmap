name: tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  svg-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -B -m unittest discover -s scripts -p test_svg_assets.py -v
      - run: python -B -m unittest discover -s scripts -p test_readme_links.py -v
      - name: 无障碍静态护栏（role/desc/alt/减弱动效块）
        run: python -B -m unittest discover -s scripts -p test_a11y.py -v

  docs-sync:
    name: docs 单一数据源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: docs/ ↔ README.md 同步 + 跨页锚点可达
        run: python -B -m unittest discover -s scripts -p test_docs_sync.py -v
      - run: python -B -m unittest discover -s scripts -p test_docs_links.py -v
      - run: python -B -m unittest discover -s scripts -p test_split_readme.py -v
      - name: 标题层级归一 + 提示卡切分（站点产物的两处正文结构变换）
        run: python -B -m unittest discover -s scripts -p test_page_structure.py -v

  lab-simulations:
    name: 实验包 SPICE 仿真与可重建性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: python -B -m unittest discover -s scripts -p test_lab_packages.py -v
      - run: python -B -m unittest discover -s scripts -p test_circuit_examples.py -v

  site-build:
    name: 站点可构建性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -B -m unittest discover -s scripts -p test_release_gate.py -v
      - run: python -B -m unittest discover -s scripts -p test_publish_a4_book.py -v
      - name: 站点源自洽性（画廊卡片/章节筛选/导航/侧栏去重/SEO/共建页脚/标题层级/提示卡/JSON-LD）
        run: python -B -m unittest discover -s scripts -p test_site_build.py -v
      - name: smartsymbols 护栏（斜杠区间不会被排成分数）
        run: python -B -m unittest discover -s scripts -p test_smartsymbols.py -v
      - run: python scripts/build_site.py --build

  remotion-smoke:
    name: Remotion 渲染冒烟（tsc + ep04 竖/横单帧渲染）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: video/remotion/package-lock.json
      - run: npm ci
        working-directory: video/remotion
      - name: 类型检查
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: video/remotion
      - name: ep04 单帧渲染（900 帧：戏眼坍塌幕 + 卡拉OK字幕路径）
        run: npx remotion still src/index.ts ep04 out/smoke.png --frame=900
        working-directory: video/remotion
      - name: ep04-h 横屏单帧渲染（900 帧：横版戏眼 + 卡拉OK字幕路径）
        run: npx remotion still src/index.ts ep04-h out/smoke-h.png --frame=900
        working-directory: video/remotion

  svg-render:
    name: SVG 渲染回归（时间轴 + 版面几何 + 明暗对比度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pillow 是 test_first_screen.py 用的：它按 WCAG 量首屏（顶栏 + 首页 hero）
      # 上文字的对比度，需要把截图解成像素（众数色当底、离底最远的像素当字芯）。
      - run: pip install -r requirements.txt playwright Pillow
      - name: Reading routes, old bookmarks, mobile layout and search
        run: python -B -m unittest discover -s scripts -p test_reading_journey.py -v
      - name: Diagnostic routes, cheat sheet exits and no-JS fallback
        run: python -B -m unittest discover -s scripts -p test_diagnostic.py -v
      - name: Gallery keyboard, modal focus and shareable filters
        run: python -B -m unittest discover -s scripts -p test_gallery_interactions.py -v
      - name: Lesson controls, video loading and mobile layout
        run: python -B -m unittest discover -s scripts -p test_learning_interactions.py -v
      - name: 时间轴（波形游标按时间匀速推进）
        run: python -B -m unittest discover -s scripts -p test_waveform_timing.py -v
      - name: 版面几何（内容出界 / 字幕压字 / 注释框溢出 / 文字被裁 / 静态压字 / 文字被盖）
        run: python -B -m unittest discover -s scripts -p test_svg_layout.py -v
      - name: 明暗两套主题的文字对比度（light + dark 均须 ≥ 3.0）
        run: python -B -m unittest discover -s scripts -p test_svg_contrast.py -v
      - name: 减弱动效（<picture> 选源正确、静止版粒子全停、字幕不误伤）
        run: python -B -m unittest discover -s scripts -p test_reduced_motion.py -v
      - name: 顶栏调试（临时）
        run: |
          python - <<'EOF'
          import subprocess, sys, json
          from playwright.sync_api import sync_playwright
          subprocess.run([sys.executable, "scripts/build_site.py", "--build"], check=True)
          import http.server, threading, functools
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory="build/site")
          srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), handler)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          base = f"http://127.0.0.1:{srv.server_port}/"
          with sync_playwright() as pw:
              b = pw.chromium.launch(channel="chrome")
              for scheme in ("light", "dark"):
                  ctx = b.new_context(viewport={"width": 1280, "height": 900}, color_scheme=scheme)
                  pg = ctx.new_page(); pg.goto(base + "index.html", wait_until="load"); pg.wait_for_timeout(1200)
                  info = pg.evaluate("""() => {
                    const t = document.querySelector('.md-header__title');
                    const cs = getComputedStyle(t);
                    const topic = document.querySelector('.md-header__topic');
                    const tcs = topic ? getComputedStyle(topic) : null;
                    return {text: t.textContent.trim(), color: cs.color, bg: cs.backgroundColor,
                            opacity: cs.opacity, visibility: cs.visibility, display: cs.display,
                            w: t.getBoundingClientRect().width, h: t.getBoundingClientRect().height,
                            topicColor: tcs && tcs.color, topicOpacity: tcs && tcs.opacity,
                            topicRect: topic && topic.getBoundingClientRect().toJSON(),
                            headerBg: getComputedStyle(document.querySelector('.md-header')).backgroundColor,
                            fonts: [...document.fonts].map(f => f.family + ':' + f.status).slice(0, 6)};
                  }""")
                  print(scheme, json.dumps(info, ensure_ascii=False))
                  pg.screenshot(path=f"header-{scheme}.png", clip={"x": 0, "y": 0, "width": 1280, "height": 60})
                  ctx.close()
              b.close()
          EOF
      - name: 首屏视觉（顶栏标识是描边 / 仓库链接不截断 / hero 皮肤 / 对比度 ≥4.5 / chip 不换行）
        run: python -B -m unittest discover -s scripts -p test_first_screen.py -v

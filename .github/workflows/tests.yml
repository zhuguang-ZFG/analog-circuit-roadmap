name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  svg-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -B -m unittest discover -s scripts -p test_svg_assets.py -v
      - run: python -B -m unittest discover -s scripts -p test_readme_links.py -v

  docs-sync:
    name: docs 单一数据源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: docs/ ↔ README.md 同步 + 跨页锚点可达
        run: python -B -m unittest discover -s scripts -p test_docs_sync.py -v
      - run: python -B -m unittest discover -s scripts -p test_docs_links.py -v
      - run: python -B -m unittest discover -s scripts -p test_split_readme.py -v

  site-build:
    name: 站点可构建性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 站点源自洽性（画廊卡片/章节筛选/导航/SEO/共建页脚）
        run: python -B -m unittest discover -s scripts -p test_site_build.py -v
      - run: python scripts/build_site.py --build

  svg-render:
    name: SVG 渲染回归（时间轴 + 版面几何 + 明暗对比度）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - name: Reading routes, old bookmarks, mobile layout and search
        run: python -B -m unittest discover -s scripts -p test_reading_journey.py -v
      - name: Gallery keyboard, modal focus and shareable filters
        run: python -B -m unittest discover -s scripts -p test_gallery_interactions.py -v
      - name: Lesson controls, video loading and mobile layout
        run: python -B -m unittest discover -s scripts -p test_learning_interactions.py -v
      - name: 时间轴（波形游标按时间匀速推进）
        run: python -B -m unittest discover -s scripts -p test_waveform_timing.py -v
      - name: 版面几何（内容出界 / 字幕压字 / 注释框溢出 / 文字被裁 / 静态压字 / 文字被盖）
        run: python -B -m unittest discover -s scripts -p test_svg_layout.py -v
      - name: 明暗两套主题的文字对比度（light + dark 均须 ≥ 3.0）
        run: python -B -m unittest discover -s scripts -p test_svg_contrast.py -v

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  svg-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -B -m unittest discover -s scripts -p test_svg_assets.py -v

  waveform-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy playwright
      - run: python -B -m unittest discover -s scripts -p test_waveform_timing.py -v

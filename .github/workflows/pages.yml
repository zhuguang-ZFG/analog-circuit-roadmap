name: pages

# 归档重定向：本站已并入《从模拟电路到 BMS》，此工作流只部署静态重定向页。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: false
      - name: 生成重定向首页
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="3; url=https://zhuguang-zfg.github.io/BMS-Z/">
          <link rel="canonical" href="https://zhuguang-zfg.github.io/BMS-Z/">
          <title>《通往模拟电路之路》已并入《从模拟电路到 BMS》</title>
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fffdf5;color:#293b3a;font:16px/1.8 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
          main{max-width:38rem;padding:2.5rem 1.5rem;border:1px solid #cfc6b2;border-radius:14px;background:#f7f2e5;box-shadow:4px 5px 0 #e4f0df}
          h1{font-size:1.35rem;margin:0 0 .8rem}
          p{margin:.5rem 0}
          a{color:#176b73;font-weight:650}
          </style>
          </head>
          <body>
          <main>
          <h1>这本《通往模拟电路之路》已经搬家</h1>
          <p>原仓库自 2026-11 起并入两卷本<strong>《从模拟电路到 BMS》</strong>（卷一仍是模拟电路内容，并新增卷二 BMS 实战）。本仓库归档只读，站点入口整体迁移。</p>
          <p><a href="https://zhuguang-zfg.github.io/BMS-Z/">前往新站 https://zhuguang-zfg.github.io/BMS-Z/</a>（3 秒后自动跳转）。</p>
          <p>离线阅读与下载：<a href="https://zhuguang-zfg.github.io/BMS-Z/downloads/">新下载页</a>（卷一稳定文件名 <code>volume-1.html</code> / <code>volume-1.pdf</code> / <code>volume-1.epub</code>）。历史 release 与提交保留在本仓库。</p>
          </main>
          </body>
          </html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
